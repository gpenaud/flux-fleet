version: v2beta1
logLevel: warn

vars:
  PENULTIMATE_SNAPSHOT:
    command: set -a && source ~/.config/restic/restic.env && set +a && restic -r "s3:https://s3.sbg.io.cloud.ovh.net/backup-${SERVER}-${TENANT}-${SERVICE}" snapshots --json | jq -r '.[-2].id'

pipelines:
  deploy: |-
    create_deployments dolibarr
  restore: |-
    kubectl --context local delete restore ${TENANT}-${SERVICE} --ignore-not-found || /bin/true
    create_deployments restore
    download_sql_dump
    restore_mysql_dump
  purge: |-
    purge_deployments --all
    remove_pvcs --all

deployments:
  dolibarr:
    helm:
      releaseName: ${TENANT}-${SERVICE}
      chart:
        repo: https://cowboysysop.github.io/charts/
        name: dolibarr
      upgradeArgs:
        - "--wait"
        - "--timeout=5m"
      values:
        replicaCount: 1
        image:
          tag: 22.0.4
        pdb:
          create: false
          minAvailable: 1
          maxUnavailable:
        ingress:
          enabled: true
          ingressClassName: traefik
          pathType: Prefix
          annotations:
            kubernetes.io/ingress.class: traefik
            cert-manager.io/cluster-issuer: mkcert
          hosts:
            - host: ${SERVICE}.${TENANT}.localhost
              paths:
                - /
          tls:
            - secretName: ${SERVICE}.${TENANT}.localhost-tls
              hosts:
                - ${SERVICE}.${TENANT}.localhost
        persistence:
          enabled: true
          size: 5Gi
        dolibarr:
          admin:
            username: admin
            password: admin
          externalUrl: https://${SERVICE}.${TENANT}.localhost
        mariadb:
          auth:
            database: dolibarr
            username: dolibarr
            password: dolibarr

  restore:
    kubectl:
      inlineManifest: |-
        apiVersion: k8up.io/v1
        kind: Restore
        metadata:
          name: ${TENANT}-${SERVICE}
        spec:
          snapshot: ${PENULTIMATE_SNAPSHOT}
          podSecurityContext:
            runAsUser: 0
            fsGroup: 0
            fsGroupChangePolicy: OnRootMismatch
          restoreMethod:
            folder:
              claimName: ${TENANT}-${SERVICE}
          backend:
            repoPasswordSecretRef:
              name: s3-ovh
              key: RESTIC_PASSWORD
            s3:
              endpoint: https://s3.sbg.io.cloud.ovh.net
              bucket: backup-${SERVER}-${TENANT}-${SERVICE}
              accessKeyIDSecretRef:
                name: s3-ovh
                key: AWS_ACCESS_KEY_ID
              secretAccessKeySecretRef:
                name: s3-ovh
                key: AWS_SECRET_ACCESS_KEY

functions:
  download_sql_dump: |-
    set -a && source ~/.config/restic/restic.env && set +a && \
    restic -r "s3:https://s3.sbg.io.cloud.ovh.net/backup-${SERVER}-${TENANT}-${SERVICE}" \
      restore latest \
      --target /tmp/restore \
      --include "*.sql"

  restore_mysql_dump: |-
    FILE_PATH=/tmp/restore/${TENANT}-${SERVICE}-db-dump.sql
    sed -i '/CONSTRAINT.*FOREIGN KEY/d' $FILE_PATH  # Supprime les lignes contenant "CONSTRAINT" et "FOREIGN KEY"
    sed -i ':a;N;$!ba;s/,\n)/\n)/g' $FILE_PATH      # Supprime les virgules avant les parenthèses fermantes
    kubectl exec -i ${TENANT}-${SERVICE}-mariadb-0 -c mariadb -- \
      sh -c 'mariadb --init-command="SET FOREIGN_KEY_CHECKS=0;" -u dolibarr -p"dolibarr" dolibarr' < ${FILE_PATH}
    rm -rf ${FILE_PATH}

  remove_pvcs: |-
    kubectl --context local delete pvc \
      $(kubectl --context local get pvc -l app.kubernetes.io/instance=${TENANT}-${SERVICE},app.kubernetes.io/name=dolibarr) \
      $PVC_NAME 2>/dev/null || true
    kubectl --context local delete pvc \
      $(kubectl --context local get pvc -l app.kubernetes.io/instance=${TENANT}-${SERVICE},app.kubernetes.io/name=dolibarr) \
      $PVC_NAME 2>/dev/null || true