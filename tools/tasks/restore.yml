version: '3'

tasks:

  all:from:*:to:*:
    vars:
      SOURCE_CLUSTER: '{{index .MATCH 0}}'
      DESTINATION_CLUSTER: '{{index .MATCH 1}}'
    requires:
      vars: [SOURCE_CLUSTER, DESTINATION_CLUSTER]
    desc: 'Restore all tenants from a backup through argo worflow (optional shortcut: task restore:all)'
    cmds:
      - task: application:from:{{.SOURCE_CLUSTER}}:to:{{.DESTINATION_CLUSTER}}:le-portail:wordpress-site
      - task: application:from:{{.SOURCE_CLUSTER}}:to:{{.DESTINATION_CLUSTER}}:le-portail:wordpress-epilibres
      # - task: application:from:{{.SOURCE_CLUSTER}}:to:{{.DESTINATION_CLUSTER}}:le-portail:alterconso
      - task: application:from:{{.SOURCE_CLUSTER}}:to:{{.DESTINATION_CLUSTER}}:le-portail:grist
      - task: application:from:{{.SOURCE_CLUSTER}}:to:{{.DESTINATION_CLUSTER}}:le-portail:dolibarr
      - task: application:from:{{.SOURCE_CLUSTER}}:to:{{.DESTINATION_CLUSTER}}:ferme-du-jointout:wordpress-site
      - task: application:from:{{.SOURCE_CLUSTER}}:to:{{.DESTINATION_CLUSTER}}:ferme-du-jointout:nextcloud
      - task: application:from:{{.SOURCE_CLUSTER}}:to:{{.DESTINATION_CLUSTER}}:ferme-du-jointout:dolibarr
      - task: application:from:{{.SOURCE_CLUSTER}}:to:{{.DESTINATION_CLUSTER}}:la-bergeronnette:wordpress-site

    silent: false

  application:from:*:to:*:*:*:
    desc: 'Restore a backup for a specific tenant and application for a specific cluster'
    silent: false
    vars:
      SOURCE_CLUSTER: '{{index .MATCH 0}}'
      DESTINATION_CLUSTER: '{{index .MATCH 1}}'
      TENANT:  '{{index .MATCH 2}}'
      APPLICATION: '{{index .MATCH 3}}'
    requires:
      vars: [SOURCE_CLUSTER, DESTINATION_CLUSTER, APPLICATION, TENANT]
    cmds:
      - argo submit --context admin@{{.DESTINATION_CLUSTER}} -n {{.TENANT}}-{{.APPLICATION}} --from workflowtemplate/restore -p backup-cluster-source='{{.SOURCE_CLUSTER}}'

  alterconso:transform:
    desc: 'Transform alterconso database from Haxe to Go (internal task)'
    cmds:
      - task: backup:download
        vars:
          CLI_ARGS: 21
      - |
        docker run -d \
          --name alterconso-import-from-haxe-to-go \
          -p 3306:3306 \
          -e MYSQL_HOST=localhost \
          -e MYSQL_PORT=3306 \
          -e MYSQL_USER=alterconso \
          -e MYSQL_PASSWORD=changeme \
          -e MYSQL_ROOT_USER=root \
          -e MYSQL_ROOT_PASSWORD=root \
          -e MYSQL_DATABASE=alterconso_haxe_import \
          mysql:latest
      - |
        until docker exec alterconso-import-from-haxe-to-go \
          mysql -ualterconso -pchangeme -e 'SELECT 1' alterconso_haxe_import >/dev/null 2>&1; do
          sleep 1
        done
      - $ALTERCONSO_TOOLS_PATH/import-haxe.sh $ALTERCONSO_DUMPS_PATH/le-portail-alterconso-db-dump.sql
      - docker rm -f alterconso-import-from-haxe-to-go
      - sleep 5
    silent: true

  alterconso:import:
    desc: 'Import transformed alterconso database into Mariadb'
    cmds:
      - |
        LOCAL_PORT=3306
        kubectl -n controller-database port-forward svc/mariadb "${LOCAL_PORT}:3306" &
        PF_PID=$!

        # Nettoyage garanti, quelle que soit la sortie (succès, erreur, Ctrl-C)
        trap 'kill "${PF_PID}" 2>/dev/null || true' EXIT

        # Readiness : on poll le port local jusqu'à ce qu'il accepte une connexion TCP
        for i in {1..30}; do
          if bash -c "echo > /dev/tcp/127.0.0.1/${LOCAL_PORT}" 2>/dev/null; then
            break
          fi
          # le port-forward est-il encore vivant ? (le pod a pu crasher)
          kill -0 "${PF_PID}" 2>/dev/null || { echo "port-forward mort"; exit 1; }
          sleep 0.5
        done

        # --- ton travail ici : le tunnel est ouvert ---
        mysql -h 127.0.0.1 -u alterconso -p"frayanadele71!" lp-alterconso  < ~/work/alterconso/import-go.sql
        # --- fin ; le trap EXIT tue le tunnel automatiquement ---
    silent: true

  alterconso:process:
    desc: 'Process alterconso database'
    cmds:
      - task: alterconso:transform
      - task: alterconso:import
    silent: true