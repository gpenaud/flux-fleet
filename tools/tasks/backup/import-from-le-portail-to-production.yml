      - |
        kubectl --context production --namespace {{.TENANT}}-{{.SERVICE}} exec -i {{.LOCAL_WP_POD}} -c wordpress -- bash -c "
          mv /bitnami/wordpress/wp-config.php /tmp/wp-config.php && 
