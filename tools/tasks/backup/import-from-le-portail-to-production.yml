          rm /tmp/backup.tgz
        "
      # - |
      #   echo "Cleaning up local backup files..."
      #   rm ./backup.sql ./backups-data.tgz

  le-portail:wordpress-site:
    desc: Backup & import le portail wordpress site from production to local
    cmds:
      - task: .wordpress
        vars:
          TENANT: le-portail
          SERVICE: wordpress-site
          MYSQL_PASSWORD:
            sh: sops -d "applications/le-portail/production/wordpress-site/secrets.enc.yaml" | yq '.stringData["mariadb-password"] | select(. != null)'

  le-portail:wordpress-epilibres:
    desc: Backup & import epilibres wordpress from production to local
    cmds:
      - task: .wordpress
        vars:
          TENANT: le-portail
          SERVICE: wordpress-epilibres
          MYSQL_PASSWORD:
            sh: sops -d "applications/le-portail/production/wordpress-epilibres/secrets.enc.yaml" | yq '.stringData["mariadb-password"] | select(. != null)'


  la-bergeronnette:wordpress-site:
    desc: Backup & import la-bergeronnette wordpress from production to local
    cmds:
      - task: .wordpress
        vars:
          TENANT: la-bergeronnette
          SERVICE: wordpress-site
          MYSQL_PASSWORD:
            sh: sops -d "applications/la-bergeronnette/production/wordpress-site/secrets.enc.yaml" | yq '.stringData["mariadb-password"] | select(. != null)'

  le-portail:dolibarr:
    desc: Backup le-portail dolibarr from production to production
    # silent: true
    vars:
      MYSQL_PASSWORD:
        sh: sops -d "applications/le-portail/production/dolibarr/secrets.enc.yaml" | yq '.stringData["mariadb-password"] | select(. != null)'
    cmds:
      - |
        kubectl --context le-portail exec sts/dolibarr-database -c dolibarr -- \
          sh -c 'mariadb-dump -u dolibarr -p"{{.MYSQL_PASSWORD}}" dolibarr --single-transaction --disable-keys --no-tablespaces > /tmp/backup.sql'
      - |
        kubectl --context le-portail cp -c dolibarr --retries=-1 \
          $(kubectl --context le-portail get pods -l app=dolibarr-database -o jsonpath='{.items[0].metadata.name}'):/tmp/backup.sql \
          ~/work/backups/le-portail-dolibarr.sql
      - |
          kubectl --context le-portail exec -i deploy/dolibarr -c dolibarr -- \
            tar -czvf - -C /var/www/ documents html/custom/ html/conf/conf.php\
            > ~/work/backups/le-portail-dolibarr.tgz
      - |
        # echo "Updates backup..."
        # sed -i '23s/^/SET SQL_MODE="NO_AUTO_VALUE_ON_ZERO";\n/' ~/work/backups/le-portail-dolibarr.sql
        # sed -i '26s/^/DROP TABLE IF EXISTS `llx_accounting_system`;\n/' ~/work/backups/le-portail-dolibarr.sql
        # sed -i '3603s/,$//' ~/work/backups/le-portail-dolibarr.sql
        # sed -i '3604d' ~/work/backups/le-portail-dolibarr.sql
        sed -i '1{/999999/d}' ~/work/backups/le-portail-dolibarr.sql

        
        echo "Decrypting secrets..."
        _secrets=$(sops --decrypt --ignore-mac "applications/le-portail/production/dolibarr/secrets.enc.yaml")
        MYSQL_USER=$(echo "$_secrets" | yq -r '.stringData["mariadb-user"]')
        MYSQL_PASSWORD=$(echo "$_secrets" | yq -r '.stringData["mariadb-password"]')
        MYSQL_ROOT_PASSWORD=$(echo "$_secrets" | yq -r '.stringData["mariadb-root-password"]')
        MYSQL_DATABASE=$(echo "$_secrets" | yq -r '.stringData["mariadb-database"]')

        echo "Restore mysql..."
        kubectl --context production --namespace controller-mysql-operator exec -i mysql-version-8-lts-0 -c mysql -- \
          mysql -u ${MYSQL_USER} -p${MYSQL_PASSWORD} ${MYSQL_DATABASE} < ~/work/backups/le-portail-dolibarr.sql   
      - kubectl --context production -n le-portail-dolibarr cp  ~/work/backups/le-portail-dolibarr.tgz $(kubectl --context production -n le-portail-dolibarr get pods -l  app.kubernetes.io/name=dolibarr -o jsonpath='{.items[0].metadata.name}'):/tmp/backup.tgz
      - |
        kubectl --context production -n le-portail-dolibarr exec deploy/dolibarr -- sh -c '\
          mv /var/www/html/conf/conf.php /tmp/conf.php &&
          tar -C /var/www/ -xzvf /tmp/backup.tgz --strip-components=1 &&
          mv /tmp/conf.php /var/www/html/conf/conf.php && 
          rm /tmp/backup.tgz
          rm /var/www/documents/install.lock
        '