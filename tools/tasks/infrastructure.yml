version: '3'

tasks:
  vps:snapshot:
    desc: Create a VPS snapshot
    cmds:
      - task: .snapshot-vps
        vars:
          HOSTNAME: "srv1515851.hstgr.cloud"

  vps:snapshot:old-vm:
    desc: Create a VPS snapshot
    cmds:
      - task: .snapshot-vps
        vars:
          HOSTNAME: "srv521992.hstgr.cloud"

  .snapshot-vps:
    internal: true
    desc: Create a VPS snapshot
    cmds:
      - |
        echo "⚠️ Cette opération va écraser le snapshot existant."
        echo "Tapez exactement 'je confirme' pour continuer :"
        read CONFIRMATION
        if [ "$CONFIRMATION" != "je confirme" ]; then
          echo "❌ Confirmation incorrecte. Opération annulée."
          exit 1
        fi
        echo "✅ Confirmation acceptée. Création du snapshot..."
        VM_ID=$(hapi vps vm list --format json | jq -r '.[] | select(.hostname == "{{.HOSTNAME}}") | .id')
        echo ${VM_ID}
        hapi vps snapshots create ${VM_ID}
    silent: true

  recreate:flux:
    desc: Force k3s local redeployment with flux
    cmds:
      - 'ANSIBLE_CONFIG=${ANSIBLE_PATH}/ansible.cfg ansible-playbook -i ${ANSIBLE_PATH}/inventories/localhost/hosts.yml ${ANSIBLE_PATH}/playbooks/install-k3s-with-flux.yml --tags flux'
    silent: true

  recreate:lab:
    desc: Force k3s local redeployment for lab
    cmds:
      - 'ANSIBLE_CONFIG=${ANSIBLE_PATH}/ansible.cfg ansible-playbook -i ${ANSIBLE_PATH}/inventories/localhost/hosts.yml ${ANSIBLE_PATH}/playbooks/install-k3s-lab.yml'
    silent: true

  encrypt:
    desc: Encrypt secrets with sops
    cmds:
      - |
        #!/bin/bash
        find . -name "secrets.yaml" ! -name "*.enc.yaml" | while read -r file; do

          enc_file="${file%.yaml}.enc.yaml"

          # Pas encore chiffré → chiffrer vers .enc.yaml
          if [ ! -f "$enc_file" ]; then
            echo "Chiffrement de $file → $enc_file..."
            sops --encrypt "$file" > "$enc_file"
            continue
          fi

          # Jamais commité → rechiffrer par sécurité
          if ! git show HEAD:"$enc_file" &>/dev/null; then
            echo "Jamais commité, chiffrement de $file → $enc_file..."
            sops --encrypt "$file" > "$enc_file"
            continue
          fi

          # Comparer le contenu déchiffré actuel vs dernier commit
          current=$(cat "$file")
          committed=$(git show HEAD:"$enc_file" | sops --decrypt --input-type yaml --output-type yaml /dev/stdin 2>/dev/null)

          if [ "$current" = "$committed" ]; then
            echo "Aucun changement, ignoré : $file"
          else
            echo "Contenu modifié, rechiffrement de $file → $enc_file..."
            sops --encrypt "$file" > "$enc_file"
          fi
        done
        exit 0
    silent: true