version: '3'

env:
  ALTERCONSO_TOOLS_PATH: /home/gpenaud/work/alterconso/tools
  ALTERCONSO_DUMPS_PATH: /tmp/restic-le-portail-alterconso/2011e88c

tasks:
  list:
    desc: 'List restic snapshots from infra01(optional shortcut: task backup:list -- 21)'
    cmds:
      - python3 ../../tools/scripts/restic-snapshots.py --list {{.CLI_ARGS}} --cluster {{.CLUSTER}}
    silent: false

  download:
    desc: 'Download latest restic backup to /tmp (optional shortcut: task backup:download -- 21)'
    cmds:
      - python3 ../../tools/scripts/restic-snapshots.py --download {{.CLI_ARGS}} --cluster {{.CLUSTER}}
    silent: false

  download:alterconso:
    desc: 'Download latest restic backup of alterconso tenant to /tmp (optional shortcut: task backup:alterconso -- 21)'
    cmds:
      - task {{.CLUSTER}}:backup:download -- 21
    silent: false

  tenant:le-portail:
    desc: 'Create a backup for le-portail apps for a specific cluster'
    silent: false
    cmds:
      - task: application:le-portail:wordpress-site
      - task: application:le-portail:wordpress-epilibres
      - task: application:le-portail:grist
      - task: application:le-portail:dolibarr

  tenant:ferme-du-jointout:
    desc: 'Create a backup for ferme-du-jointout apps for a specific cluster'
    silent: false
    cmds:
      - task: application:ferme-du-jointout:wordpress-site
      - task: application:ferme-du-jointout:nextcloud
      - task: application:ferme-du-jointout:dolibarr

  tenant:la-bergeronnette:
    desc: 'Create a backup for la-bergeronnette apps for a specific cluster'
    silent: false
    cmds:
      - task: application:la-bergeronnette:wordpress-site

  tenant:jardins-vedas:
    desc: 'Create a backup for jardins-vedas apps for a specific cluster'
    silent: false
    cmds:
      - task: application:jardins-vedas:wordpress-site

  all:
    desc: 'Create a backup for all backupable tenants and infrastructure services'
    silent: false
    cmds:
      - task: tenant:le-portail
      - task: tenant:ferme-du-jointout
      - task: tenant:la-bergeronnette
      - task: tenant:jardins-vedas
      - task: infrastructure:directory

  application:*:*:
    desc: 'Create a backup for a specific tenant and application for a specific cluster'
    silent: false
    vars:
      TENANT:  '{{index .MATCH 0}}'
      APPLICATION: '{{index .MATCH 1}}'
    cmds:
      - task: .create-backup-resource
        vars:
          BACKUP_SOURCE_CLUSTER: '{{.CLUSTER}}'
          SCOPE: '{{.TENANT}}'
          SERVICE: '{{.APPLICATION}}'

  infrastructure:*:
    desc: 'Create a backup for a specific infrastructure service for a specific cluster'
    silent: false
    vars:
      SERVICE: '{{index .MATCH 0}}'
    cmds:
      - task: .create-backup-resource
        vars:
          BACKUP_SOURCE_CLUSTER: '{{.CLUSTER}}'
          SCOPE: controller
          SERVICE: '{{.SERVICE}}'
          # Les namespaces controller-* appliquent PodSecurity `restricted`, à la
          # différence de ceux des tenants. Sans podConfigRef, les Jobs que k8up
          # génère sont refusés à l'admission (allowPrivilegeEscalation,
          # capabilities, runAsNonRoot, seccompProfile) : le pod de
          # pré-sauvegarde démarre puis attend indéfiniment un backup qui ne naît
          # jamais.
          POD_CONFIG: podconfig

  .create-backup-resource:
    internal: true
    silent: false
    desc: 'Create backup resource'
    cmds:
      - kubectl --context admin@{{.BACKUP_SOURCE_CLUSTER}} --namespace {{.SCOPE}}-{{.SERVICE}} delete backups.k8up.io {{.SERVICE}} --ignore-not-found
      - |
        kubectl --context admin@{{.BACKUP_SOURCE_CLUSTER}} --namespace {{.SCOPE}}-{{.SERVICE}} apply -f - <<EOF
        apiVersion: k8up.io/v1
        kind: Backup
        metadata:
          name: {{.SERVICE}}
          namespace: {{.SCOPE}}-{{.SERVICE}}
        spec:
        {{- if .POD_CONFIG}}
          # Sur un Backup, podConfigRef se pose bien au niveau spec. Ne pas
          # transposer tel quel dans un Schedule : k8up ne l'y propage pas aux
          # Backup générés, il faut l'y répéter sous backup/check/prune.
          #
          # Volontairement absent par défaut : les tenants sauvegardent
          # aujourd'hui sans securityContext imposé, et leur en appliquer un
          # d'un coup risquerait d'empêcher restic de lire des fichiers
          # appartenant à d'autres UID.
          podConfigRef:
            name: {{.POD_CONFIG}}
        {{- end}}
          backend:
            repoPasswordSecretRef:
              key: RESTIC_PASSWORD
              name: k8up-credentials
            s3:
              accessKeyIDSecretRef:
                key: AWS_ACCESS_KEY_ID
                name: k8up-credentials
              bucket: alter-it-{{.BACKUP_SOURCE_CLUSTER}}-backup-{{.SCOPE}}-{{.SERVICE}}
              endpoint: https://s3.sbg.io.cloud.ovh.net
              secretAccessKeySecretRef:
                key: AWS_SECRET_ACCESS_KEY
                name: k8up-credentials
        EOF