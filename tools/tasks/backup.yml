version: '3'

tasks:
  la-bergeronnette:wordpress-site:
    - task: .backup
      silent: true
      vars:
        SERVER: srv1515851
        TENANT: la-bergeronnette
        SERVICE: wordpress-site
        USER_ID: 1001
        GROUP_ID: 1001

  le-portail:wordpress-epilibres:
    - task: .backup
      silent: true
      vars:
        SERVER: srv1515851
        TENANT: le-portail
        SERVICE: wordpress-epilibres
        USER_ID: 1001
        GROUP_ID: 1001

  le-portail:wordpress-site:
    - task: .backup
      silent: true
      vars:
        SERVER: srv1515851
        TENANT: le-portail
        SERVICE: wordpress-site
        USER_ID: 1001
        GROUP_ID: 1001

  le-portail:dolibarr:
    - task: .backup
      silent: true
      vars:
        SERVER: srv1515851
        TENANT: le-portail
        SERVICE: dolibarr
        USER_ID: 0
        GROUP_ID: 0

  le-portail:alterconso:
    - task: .backup
      silent: true
      vars:
        SERVER: srv1515851
        TENANT: le-portail
        SERVICE: alterconso
        USER_ID: 33
        GROUP_ID: 33

  le-portail:grist:
    - task: .backup
      silent: true
      vars:
        SERVER: srv1515851
        TENANT: le-portail
        SERVICE: grist
        USER_ID: 0
        GROUP_ID: 0

  ferme-du-jointout:wordpress-site:
    - task: .backup
      silent: true
      vars:
        SERVER: srv1515851
        TENANT: ferme-du-jointout
        SERVICE: wordpress-site
        USER_ID: 1001
        GROUP_ID: 1001

  ferme-du-jointout:dolibarr:
    - task: .backup
      silent: true
      vars:
        SERVER: srv1515851
        TENANT: ferme-du-jointout
        SERVICE: dolibarr
        USER_ID: 0
        GROUP_ID: 0

  ferme-du-jointout:nextcloud:
    - task: .backup
      silent: true
      vars:
        SERVER: srv1515851
        TENANT: ferme-du-jointout
        SERVICE: nextcloud
        USER_ID: 0
        GROUP_ID: 0

  .backup:
    internal: true
    silent: true
    cmds:
      - echo "Backuping {{.TENANT}}-{{.SERVICE}} to bucket {{.SERVER}}-{{.TENANT}}-{{.SERVICE}}..."
      - |
        kubectl --context production apply -f - <<EOF
        apiVersion: k8up.io/v1
        kind: Backup
        metadata:
          name: {{.TENANT}}-{{.SERVICE}}
          namespace: {{.TENANT}}-{{.SERVICE}}
          labels:
            reflector/s3-ovh: "true"
        spec:
          podSecurityContext:
            runAsUser: {{.USER_ID}}
            fsGroup: {{.GROUP_ID}}
          backend:
            repoPasswordSecretRef:
              name: s3-ovh
              key: RESTIC_PASSWORD
            s3:
              endpoint: https://s3.sbg.io.cloud.ovh.net
              bucket: "backup-{{.SERVER}}-{{.TENANT}}-{{.SERVICE}}"
              accessKeyIDSecretRef:
                name: s3-ovh
                key: AWS_ACCESS_KEY_ID
              secretAccessKeySecretRef:
                name: s3-ovh
                key: AWS_SECRET_ACCESS_KEY
        EOF
      - kubectl --context production --namespace {{.TENANT}}-{{.SERVICE}} wait backup {{.TENANT}}-{{.SERVICE}} --for=condition=Completed --timeout=30m
      - kubectl --context production --namespace {{.TENANT}}-{{.SERVICE}} delete backup {{.TENANT}}-{{.SERVICE}}

