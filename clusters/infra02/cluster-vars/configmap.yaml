
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-vars
  namespace: flux-system
data:
  owner: alter-it
  cluster: infra02
  s3_region: sbg 
  domain: alter-it.eu
  domain_prefix: "staging." # only for applications, not used in cluster configuration, can be empty string if not needed
  environment: staging
  # Distingue le cookie de session Authelia de celui de la production, qui est
  # aussi envoyé aux sous-domaines « staging. ». Absent sur infra01, où la
  # valeur par défaut vide préserve le nom historique.
  session_cookie_suffix: "_staging"
  # Chaîne d'authentification Dolibarr, essayée dans l'ordre : SSO Authelia,
  # puis bind LLDAP, puis comptes locaux. Les trois cohabitent sur le même
  # écran de login — le formulaire n'est masqué que par 'googleoauth'.
  #
  # Volontairement absente d'infra01 : le même values.yaml sert les deux
  # clusters, et la valeur par défaut « dolibarr » du substitute y conserve le
  # comportement actuel jusqu'à validation sur staging.
  dolibarr_auth: "openid_connect,ldap,dolibarr"
  # Active le module LDAP de Dolibarr, requis par le script qui provisionne les
  # comptes depuis l'annuaire. Absent d'infra01 pour les mêmes raisons que
  # dolibarr_auth.
  dolibarr_ldap_module: "1"
  # Laisse tourner la synchronisation des comptes depuis l'annuaire. Absente
  # d'infra01, où le CronJob reste suspendu.
  dolibarr_sync_suspend: "false"
  # Restreint l'accès à Grist aux groupes de l'annuaire. Absent d'infra01, où
  # les groupes portent encore l'ancienne nomenclature : une politique en
  # « deny » par défaut y fermerait Grist à tout le monde.
  grist_authorization_policy: "grist-le-portail"
  # La cle d'API existe desormais : la synchronisation des roles Grist peut
  # tourner. Un passage a blanc l'a precedee, delta vide.
  grist_sync_suspend: "false"
  # Branche Nextcloud sur l'annuaire : comptes par LDAP, SSO par OIDC. Absent
  # d'infra01 tant que le mapping d'identifiant n'y est pas éprouvé — mal réglé,
  # il ferait atterrir les utilisateurs sur un espace vide.
  nextcloud_directory: "1"
  nextcloud_authorization_policy: "nextcloud-le-portail"
  # Branche les deux WordPress du portail sur l'annuaire. Un seul groupe par
  # site, sans le 'le-portail-admins' transverse : quiconque franchit Authelia
  # y devient administrateur, la porte est donc etroite a dessein. Le groupe est
  # verifie une seconde fois par le mu-plugin, cote WordPress.
  wordpress_directory: "1"
  wordpress_site_authorization_policy: "wordpress-site-le-portail"
  wordpress_epilibres_authorization_policy: "wordpress-epilibres-le-portail"
  # Mode de connexion, commun a toutes les applications qui savent le distinguer.
  #
  #   mixed  formulaire local ET bouton de connexion unique (defaut)
  #   sso    redirection d'emblee vers Authelia
  #
  # Meme en « sso », le formulaire reste joignable : « ?connexion-locale » sur
  # wp-login.php, « /login?direct=1 » sur Nextcloud. Sans cela une panne de
  # l'annuaire fermerait tout, y compris aux comptes de depannage.
  #
  # Grist n'apparait pas ici : configure en OIDC, il n'a aucun formulaire local,
  # il est donc deja en « sso » sans qu'on puisse en decider. Dolibarr non plus :
  # sa redirection automatique exige que 'openid_connect' soit le SEUL mode de
  # dolibarr_auth, ce qui supprimerait du meme coup le bind LDAP et les comptes
  # locaux — le recours entier, sans porte de secours d'aucune sorte.
  wordpress_login_mode: "sso"
  nextcloud_login_mode: "sso"
  tenant: shared # default tenant for shared resources, can be overridden in by-tenant kustomization
  cluster_endpoint_ip: 5.161.32.22
  internal_service_cidr: 10.96.0.0/12
  internal_service_ip: 10.96.0.100
  storage_class: openebs-lvm
  cilium_operator_replicas: "1"