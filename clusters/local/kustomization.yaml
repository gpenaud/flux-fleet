
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-configuration
  namespace: flux-system
spec:
  interval: 1h
  path: ./clusters/local/cluster-vars
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system

