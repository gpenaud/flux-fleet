
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-vars
  namespace: flux-system
data:
  owner: alter-it
  cluster: infra01-staging
  # project : le groupe de clients hébergé, stable d'un environnement à l'autre.
  # C'est lui qui nomme les domaines, précédé de domain_prefix —
  #   production : vpn.internal.infra01.alter-it.eu
  #   staging    : vpn.internal.staging.infra01.alter-it.eu
  #
  # cluster, juste au-dessus, désigne l'instance réellement déployée et diffère
  # donc entre les deux. Il nomme les ressources qui ne doivent surtout pas se
  # confondre : buckets de sauvegarde restic, blocs Loki et Mimir. Les mélanger
  # ferait écrire staging et production dans le même dépôt.
  project: infra01
  s3_region: sbg 
  domain: alter-it.eu
  domain_prefix: "staging."
  # Distingue le cookie de session de celui de la production, qui est aussi
  # envoyé aux sous-domaines « staging. » : à nom identique, le navigateur
  # transmet les deux et staging rejette une session qu'il n'a pas émise.
  session_cookie_suffix: "_staging"
  environment: staging
  # Authentification adossée à l'annuaire, validée sur infra02 avant bascule.
  # Les groupes ont été renommés selon la nomenclature du cluster, sans quoi ces
  # réglages ne désigneraient rien.
  #
  # La chaîne essaie le SSO Authelia, puis le bind LLDAP, puis les comptes
  # locaux : ces derniers restent le recours si l'annuaire devient injoignable.
  dolibarr_auth: "openid_connect,ldap,dolibarr"
  dolibarr_ldap_module: "1"
  dolibarr_sync_suspend: "false"
  # Restreint l'entrée de Grist aux membres des groupes. Ils reprennent
  # exactement les accès en place, donc personne ne perd le sien.
  grist_authorization_policy: "grist-le-portail"
  # La clé d'API existe désormais, posée sur le compte propriétaire de
  # l'instance : la synchronisation des rôles Grist peut tourner. Un passage à
  # blanc l'a précédée sur les deux clusters, delta vide.
  grist_sync_suspend: "false"
  #
  # Branche Nextcloud sur l'annuaire : comptes par LDAP, SSO par OIDC. Le point
  # qu'il fallait éprouver sur infra02 est le mapping d'identifiant — les deux
  # backends doivent produire le même, sinon la connexion SSO crée un compte
  # parallèle et l'utilisateur arrive sur un espace vide. Validé au navigateur
  # le 11 août 2026 : la connexion aboutit bien sur le compte créé par LDAP.
  #
  # La production ne compte encore que le compte « admin » local, qui reste le
  # recours si l'annuaire devient injoignable : les comptes de l'annuaire n'y
  # apparaîtront qu'à leur première connexion.
  nextcloud_directory: "1"
  # Restreint l'entrée aux membres des groupes Nextcloud du tenant et à ses
  # administrateurs toutes applications, au lieu de laisser entrer tout
  # l'annuaire. Les trois groupes désignés existent bien sur ce cluster, sans
  # quoi le « deny » par défaut fermerait l'application à tout le monde.
  nextcloud_authorization_policy: "nextcloud-le-portail"
  # Les deux WordPress du portail. Un seul groupe par site, sans le
  # 'le-portail-admins' transverse des autres applications : quiconque franchit
  # Authelia y devient administrateur. Le groupe est pour cette raison verifie
  # une seconde fois cote WordPress, par le mu-plugin.
  wordpress_directory: "1"
  wordpress_site_authorization_policy: "wordpress-site-le-portail"
  wordpress_epilibres_authorization_policy: "wordpress-epilibres-le-portail"
  # Mode de connexion : « sso » redirige d'emblee vers Authelia, « mixed »
  # laisse le formulaire local a cote du bouton. Le formulaire reste joignable
  # dans les deux cas — « ?connexion-locale » sur wp-login.php, « /login?direct=1 »
  # sur Nextcloud, ce dernier natif — sans quoi une panne de l'annuaire fermerait
  # tout, comptes de depannage compris.
  #
  # Ni Grist ni Dolibarr n'y figurent : le premier, configure en OIDC, n'expose
  # aucun formulaire local ; le second n'accepte de rediriger que si
  # 'openid_connect' est le seul mode de dolibarr_auth, ce qui supprimerait le
  # bind LDAP et les comptes locaux du meme coup.
  wordpress_login_mode: "sso"
  nextcloud_login_mode: "sso"
  # Version d'alterconso, eprouvee sur infra02 avant d'arriver ici.
  #
  # 3c713a3 : le responsable technique cesse de figurer comme responsable des
  # groupes ou le compte d'installation porte « GroupAdmin » — le droit y reste
  # et reprend effet des que la configuration designe quelqu'un d'autre. Le role
  # de responsable de groupe ne s'attribue plus que par lui ; le responsable en
  # place distribue les autres delegations sans transferer le sien.
  #
  # Le prefixe « sha- » n'est pas cosmetique : un sha tout en chiffres ressort en
  # nombre apres substitution Kustomize, puis en notation scientifique, designant
  # une image introuvable. Celui-ci en porte, le prefixe reste par coherence.
  alterconso_image_tag: "sha-3c713a3"
  tenant: shared # default tenant for shared resources, can be overridden in by-tenant kustomization
  # À RENSEIGNER à la création du cluster de staging : cette valeur est celle
  # de la production, recopiée avec le reste. Laissée telle quelle, external-dns
  # ferait pointer les enregistrements de staging vers la production.
  cluster_endpoint_ip: 0.0.0.0
  internal_service_cidr: 10.96.0.0/12
  internal_service_ip: 10.96.0.100
  # openebs-hostpath, et non openebs-lvm comme sur infra02 : le VPS Hostinger
  # n'a qu'UN disque, entièrement consommé par Talos à l'installation (sda6 /
  # EPHEMERAL occupe 212 des 215 Go). Il ne reste rien pour le groupe de volumes
  # vg-openebs, la capacité CSI annoncée est nulle, et tout PVC en openebs-lvm
  # reste Pending sur « node(s) did not have enough free storage ».
  #
  # infra02 garde openebs-lvm : son VG vit sur un second disque dédié (sdb).
  storage_class: openebs-hostpath
  cilium_operator_replicas: "1"