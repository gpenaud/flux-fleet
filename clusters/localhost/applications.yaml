---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: applications
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./applications
  prune: true
  wait: true
  timeout: 5m
  postBuild:
    substitute:
      ENVIRONMENT: localhost
