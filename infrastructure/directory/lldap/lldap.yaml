apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: alexmorbo
  namespace: controller-directory
spec:
  type: oci
  interval: 1h
  url: oci://ghcr.io/alexmorbo/helm-charts
---
# clusters/leportail/lldap/helm-release.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lldap
  namespace: controller-directory
spec:
  interval: 30m
  chart:
    spec:
      chart: lldap
      version: "1.0.x"
      sourceRef:
        kind: HelmRepository
        name: alexmorbo
        namespace: controller-directory
  values:
    replicaCount: 1  # NE PAS AUGMENTER (SQLite)

    image:
      registry: ghcr.io
      repository: lldap/lldap
      tag: "2026-01-06-alpine"  # pin explicite, pas latest
      pullPolicy: IfNotPresent

    secret:
      create: false
      existingSecret: lldap-secrets

    env:
      TZ: "Europe/Paris"
      GID: "1000"
      UID: "1000"

    extraEnv:
      - name: "LLDAP_FORCE_UPDATE_PRIVATE_KEY"
        value: "false"
      - name: "LLDAP_FORCE_LDAP_USER_PASS_RESET"
        value: "false"
      - name: "LLDAP_ADMIN_PASSWORD"
        valueFrom:
          secretKeyRef:
            name: lldap-secrets
            key: lldap-ldap-user-pass

    extraEnvFrom:
      - secretRef:
          name: lldap-secrets

    persistence:
      enabled: true
      size: 1Gi
      accessModes: ["ReadWriteOnce"]
      storageClass: ${storage_class}
      annotations:
        # Pas de sauvegarde au niveau fichier : elle copierait users.db sans
        # garantie de cohérence transactionnelle, et embarquerait au passage les
        # users.db.bak-* laissés par les restaurations. La sauvegarde passe par
        # le PreBackupPod de components/backup, qui produit un dump SQLite
        # cohérent.
        #
        # (Cette annotation était de toute façon inopérante : le chart ne la
        # propageait pas jusqu'au PVC.)
        k8up.io/backup: "false"

    service:
      type: ClusterIP
      ldap_port: 3890
      http_port: 17170
      ldaps_enabled: false

    ingress:
      enabled:

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi

  postRenderers:
    - kustomize:
        patches:
          # Exclut le PVC de la sauvegarde au niveau fichier. k8up sauvegarde par
          # défaut TOUT PVC non annoté — ses logs le disaient explicitement :
          # « PVC doesn't have annotation, adding to list ». On se retrouvait
          # avec deux sauvegardes du même volume : le dump SQLite cohérent du
          # PreBackupPod, et une copie brute embarquant les users.db.bak-*.
          #
          # L'annotation déclarée dans values.persistence.annotations n'atteint
          # jamais le PVC : le chart ne la propage pas. D'où ce patch.
          - target:
              kind: PersistentVolumeClaim
              name: lldap-data
            patch: |
              - op: add
                path: /metadata/annotations/k8up.io~1backup
                value: "false"
          - target:
              kind: Deployment
              name: lldap
            patch: |
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: bootstrap
                  projected:
                    sources:
                      - secret:
                          name: lldap-bootstrap-users
                          items:
                            - key: authelia.json
                              path: user-configs/authelia.json
                      - configMap:
                          name: lldap-bootstrap-groups
                          items:
                            - key: lldap_strict_readonly.json
                              path: group-configs/lldap_strict_readonly.json

              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: bootstrap
                  mountPath: /bootstrap
                  readOnly: true

              # pour /app/bootstrap.sh (read-only filesystem)
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: tmp
                  emptyDir: {}
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: tmp
                  mountPath: /tmp

              - op: add
                path: /spec/template/spec/containers/0/lifecycle
                value:
                  postStart:
                    exec:
                      command:
                        - /bin/sh
                        - -c
                        - |
                          until wget -q -O /dev/null http://127.0.0.1:17170/health 2>/dev/null; do
                            sleep 1
                          done
                          /app/bootstrap.sh

    # readOnlyRootFilesystem: true demande un /tmp writable
    # Si le chart ne le fournit pas par défaut, on patche via postRenderer
    # (à valider après premier déploiement : si crash sur /tmp, ajouter ici)