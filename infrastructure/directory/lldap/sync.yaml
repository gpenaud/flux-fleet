apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-directory-lldap
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-storage
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/directory/lldap
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age-private-key
  postBuild:
    # Le Schedule mutualisé nomme son bucket ${owner}-${cluster}-backup-${tenant}-${application}.
    # lldap n'appartenant à aucun tenant, on lui réserve le pseudo-tenant
    # « controller » → alter-it-<cluster>-backup-controller-lldap.
    #
    # Doit rester identique à local.backup_tenants dans
    # infrastructure-as-code/infrastructure/infra02/s3.tf, qui crée le bucket.
    substitute:
      application: lldap
      tenant: controller
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
        optional: false