
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authelia-${cluster}-${domain}
  namespace: controller-authentication
  annotations:
    external-dns.alpha.kubernetes.io/hostname: auth.${domain_prefix}${project}.${domain}
    external-dns.alpha.kubernetes.io/target: ${domain_prefix}${project}.${domain}
    external-dns.alpha.kubernetes.io/ttl: "300"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`auth.${domain_prefix}${project}.${domain}`)
      kind: Rule
      services:
        - name: authelia
          port: 80
  tls:
    secretName: wildcard.${domain_prefix}${project}.${domain}.tls