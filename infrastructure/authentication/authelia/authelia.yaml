apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: authelia
  namespace: controller-authentication
spec:
  interval: 24h
  url: https://charts.authelia.com
# ---
# apiVersion: v1
# kind: PersistentVolumeClaim
# metadata:
#   name: authelia-storage
#   namespace: controller-authentication
# spec:
#   accessModes:
#     - ReadWriteOnce
#   storageClassName: ${storage_class}
#   resources:
#     requests:
#       storage: 1Gi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: controller-authentication
spec:
  interval: 30m
  chart:
    spec:
      chart: authelia
      version: "0.11.5"
      sourceRef:
        kind: HelmRepository
        name: authelia
        namespace: controller-authentication
      interval: 12h

  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3

  values:
    # ================================================================
    # Pod : Deployment (pas DaemonSet, mono-instance suffit)
    # ================================================================
    pod:
      kind: 'Deployment'
      replicas: 1
      
      # Users database monté depuis un secret externe (gérer hors chart)
      env:
        - name: TZ
          value: "Europe/Paris"

    # ================================================================
    # Persistence : PVC pour SQLite
    # ================================================================
    persistence:
      enabled: true
      storageClass: ${storage_class}
      size: '1Gi'
      accessModes:
        - 'ReadWriteOnce'

    # ================================================================
    # Service : ClusterIP, exposé via IngressRoute séparée
    # ================================================================
    service:
      type: 'ClusterIP'
      port: 80

    # ================================================================
    # Ingress : géré par notre IngressRoute Traefik séparée
    # ================================================================
    ingress:
      enabled: false

    # ================================================================
    # Configuration Authelia
    # ================================================================
    
    configMap:
      disabled: false
      
      # --- Serveur
      server:
        port: 9091
      
      # --- Logs
      log:
        level: 'info'
      
      # --- Theme
      theme: 'dark'
      
      # # --- Authentication backend : file-based
      # authentication_backend:
      #   password_reset:
      #     disable: false  # désactivé jusqu'à ce qu'on configure SMTP
      #   password_change:
      #     disable: false
      #   refresh_interval: '5 minutes'
      #   file:
      #     enabled: true
      #     path: '/secrets/users/users_database.yml'
      #     watch: false
      #     search:
      #       email: false
      #       case_insensitive: false
      #     password:
      #       algorithm: 'argon2'
      #       argon2:
      #         variant: 'argon2id'
      #         iterations: 3
      #         memory: 65536
      #         parallelism: 4
      #         key_length: 32
      #         salt_length: 16

      authentication_backend:
        refresh_interval: '5 minutes'
        password_reset:
          disable: false   # active le password reset par email
        ldap:
          enabled: true
          implementation: 'lldap'
          address: 'ldap://lldap.controller-directory.svc.cluster.local:3890'
          timeout: '5 seconds'
          start_tls: false
          base_dn: 'dc=alter-it,dc=eu'
          additional_users_dn: 'ou=people'
          users_filter: '(&({username_attribute}={input})(objectClass=person))'
          additional_groups_dn: 'ou=groups'
          groups_filter: '(member={dn})'
          user: 'uid=authelia,ou=people,dc=alter-it,dc=eu'
          password:
            disabled: false
            secret_name: 'authelia-ldap-bind'
            path: 'AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD'
          attributes:
            username: 'uid'
            display_name: 'displayName'
            mail: 'mail'
            member_of: 'memberOf'
            group_name: 'cn'

      # --- Access Control
      access_control:
        default_policy: 'deny'
        rules:
          # Tenant leportail
          # Les domaines portent ${domain_prefix} (vide en production,
          # « staging. » sur infra02) : figés en dur, ils ne désignaient rien
          # sur le cluster de staging, dont toutes les routes sont préfixées.
          - domain: '*.${domain_prefix}leportail.org'
            policy: 'one_factor'
            subject:
              - 'group:le-portail-admins'
              - 'group:le-portail-users'
          # Authelia lui-même : bypass (sinon boucle infinie de login)
          - domain: 'auth.${cluster}.${domain}'
            policy: 'bypass'

      # --- Session
      session:
        # Le nom doit différer entre production et staging. Un cookie posé sur
        # « leportail.org » est aussi envoyé à « auth.staging.leportail.org » :
        # à nom identique, le navigateur transmet les deux, staging reçoit une
        # session qu'il n'a pas émise, la rejette et renvoie au portail — une
        # boucle silencieuse, sans échec d'authentification à journaliser.
        # Le suffixe est vide par défaut : la production garde son nom actuel
        # et ses sessions en cours.
        name: 'authelia_session${session_cookie_suffix:=}'
        expiration: '1 hour'
        inactivity: '5 minutes'
        remember_me: '1 month'
        encryption_key:
          disabled: false
          secret_name: 'authelia-secrets'
          path: 'AUTHELIA_SESSION_SECRET'
        # Authelia refuse toute requête OIDC dont l'URL ne correspond à aucune
        # de ces entrées (« no session cookie configuration matches url ») :
        # sur staging, les hôtes préfixés n'étaient couverts par aucune, et la
        # découverte OIDC répondait 500.
        cookies:
          - subdomain: 'auth.${cluster}'
            domain: '${domain}'
          - subdomain: 'auth'
            domain: '${domain_prefix}leportail.org'
          - subdomain: 'auth'
            domain: '${domain_prefix}fermedujointout.fr'
          - subdomain: 'auth'
            domain: '${domain_prefix}labergeronnette.org'
          - subdomain: 'auth'
            domain: '${domain_prefix}jardinsvedas.com'

      # Clé de chiffrement des données sensibles de la base — secrets TOTP,
      # identifiants WebAuthn. Elle vivait ici en clair ; elle est desormais lue
      # dans le Secret authelia-secrets, chiffré par SOPS, qui en portait déjà
      # une copie rigoureusement identique. La bascule ne change donc aucune
      # valeur, ce qui importe plus ici qu'ailleurs : une clé différente rendrait
      # la base illisible.
      #
      # Ce n'est pas un simple rangement. Le chart fabriquait ce Secret lui-même
      # et n'en conservait la valeur, d'un déploiement à l'autre, que par un
      # lookup sur l'existant. Le Secret disparu, il en aurait tiré une nouvelle
      # au hasard, et Authelia n'aurait plus rien su déchiffrer.
      identity_validation:
        reset_password:
          secret:
            secret_name: 'authelia-secrets'
            path: 'AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET'

      # --- Storage : SQLite local
      storage:
        encryption_key:
          secret_name: 'authelia-secrets'
          path: 'AUTHELIA_STORAGE_ENCRYPTION_KEY'
        local:
          enabled: true
          path: '/config/db.sqlite3'

      notifier:
        disable_startup_check: true
        
        # Désactiver l'ancien notifier filesystem
        filesystem:
          enabled: false
        
        # Activer SMTP
        smtp:
          enabled: true
          address: 'submissions://smtp.gmail.com:465'
          timeout: '10 seconds'
          sender: 'Authelia <ops.gpenaud@gmail.com>'
          identifier: 'auth.${cluster}.${domain}'
          subject: '[Authelia] {title}'
          startup_check_address: 'ops.gpenaud@gmail.com'
          disable_html_emails: false
          disable_require_tls: false
          disable_starttls: false
          username: 'ops.gpenaud@gmail.com'
          password:
            secret_name: 'authelia-smtp'
            path: 'password.txt'
          tls:
            skip_verify: false
            minimum_version: 'TLS1.2'
          
      # --- Regulation (rate limit anti-brute force)
      regulation:
        max_retries: 5
        find_time: '2 minutes'
        ban_time: '5 minutes'

      # --- Identity Providers : OIDC
      identity_providers:
        oidc:
          enabled: true

          # Claims autorises a etre demandes par le parametre « claims » d'une
          # requete d'autorisation.
          #
          # user_oidc ne se contente pas des scopes : il demande nommement les
          # claims dont il a besoin. Sans cette declaration, Authelia refuse la
          # requete — « the client requested claims were not permitted » — et
          # Nextcloud n'en voit que le contrecoup, « Le fournisseur d'identite
          # n'a pas reussi a authentifier l'utilisateur ».
          claims_policies:
            nextcloud:
              id_token:
                - 'preferred_username'
                - 'email'
                - 'name'
                - 'groups'

          # Politiques d'autorisation nommees, referencees par les clients.
          #
          # Sans elles, « one_factor » laisse entrer TOUT compte de l'annuaire :
          # l'application ne l'apprend qu'ensuite. Grist provisionne son compte
          # des la premiere connexion, il en creerait donc un pour n'importe qui.
          #
          # Les entrees de « subject » sont alternatives : appartenir a l'un des
          # groupes suffit. Le role, lui, se pose par l'API — Grist n'exploite
          # aucun claim de groupe.
          authorization_policies:
            nextcloud-le-portail:
              default_policy: 'deny'
              rules:
                - policy: 'one_factor'
                  subject:
                    - 'group:le-portail-nextcloud'
                    - 'group:le-portail-nextcloud-admins'
                    - 'group:le-portail-admins'
            grist-le-portail:
              default_policy: 'deny'
              rules:
                - policy: 'one_factor'
                  subject:
                    - 'group:le-portail-grist-readers'
                    - 'group:le-portail-grist-writers'
                    - 'group:le-portail-grist-admins'
                    - 'group:le-portail-admins'
            # Un seul groupe par site, sans le 'le-portail-admins' transverse que
            # connaissent les autres applications : quiconque franchit Authelia
            # ici devient administrateur du site, la porte est donc etroite a
            # dessein.
            wordpress-site-le-portail:
              default_policy: 'deny'
              rules:
                - policy: 'one_factor'
                  subject:
                    - 'group:le-portail-wordpress-site-admins'
            wordpress-epilibres-le-portail:
              default_policy: 'deny'
              rules:
                - policy: 'one_factor'
                  subject:
                    - 'group:le-portail-wordpress-epilibres-admins'

          # Clients
          clients:
            - client_id: 'grist-le-portail'
              client_name: 'Grist - Ecolieu du Portail'
              client_secret:
                # Le hash pbkdf2 du client secret en clair
                value: "$pbkdf2-sha512$310000$Kra1XW1tIxx3aBFtBassbw$0VQPncmkduO4dxiIv1/3eVLB3XQ5Ioq0sU5CdY5Li08EINcciyITqmIxt2tZ7ZzmN4tsOgAKcPC3KQ0v8w0hWQ"
              public: false
              # Restreint aux groupes Grist du tenant et a ses administrateurs
              # toutes applications, au lieu de laisser entrer tout l'annuaire.
              #
              # Pilote par cluster-vars, et volontairement laisse a 'one_factor'
              # sur infra01 : les groupes y portent encore l'ancienne
              # nomenclature, et une politique en « deny » par defaut qui ne
              # designerait aucun groupe existant fermerait Grist a tout le
              # monde. A basculer une fois la production renommee.
              authorization_policy: '${grist_authorization_policy:=one_factor}'
              redirect_uris:
                - 'https://grist.${domain_prefix}leportail.org/oauth2/callback'
              scopes:
                - 'openid'
                - 'email'
                - 'profile'
              userinfo_signed_response_alg: 'none'
              token_endpoint_auth_method: 'client_secret_basic'
              consent_mode: 'implicit'

            - client_id: 'nextcloud-le-portail'
              client_name: 'Nextcloud - Ecolieu du Portail'
              client_secret:
                value: "$pbkdf2-sha512$310000$/8YjU2idb6cg7j.nRBX8hw$ED/VqDTblH79cdFNOQjFGET9Fd/CXE9O2Qexeu9i7WCEcWCo5iwscuQVlT.uZpvPXoavU/8mE667gIHknTW3RA"
              public: false
              # Comme Grist, laisse a 'one_factor' la ou l'application n'est pas
              # encore branchee sur l'annuaire.
              authorization_policy: '${nextcloud_authorization_policy:=one_factor}'
              claims_policy: 'nextcloud'
              redirect_uris:
                # Chemin impose par user_oidc : /apps/user_oidc/code.
                - 'https://nextcloud.${domain_prefix}leportail.org/apps/user_oidc/code'
              scopes:
                - 'openid'
                - 'email'
                - 'profile'
                # user_oidc demande le claim « groups » ; Authelia exige alors
                # le scope du meme nom dans l'enregistrement du client, sans
                # quoi il rejette toute la requete d'autorisation : « The claims
                # 'groups' require the 'groups' scope; but these scopes are
                # absent from the client registration. »
                - 'groups'
              userinfo_signed_response_alg: 'none'
              # client_secret_post, comme Dolibarr : user_oidc place ses
              # identifiants dans le corps du POST au token endpoint. Declare en
              # _basic, Authelia refuse l'echange du code contre le jeton.
              token_endpoint_auth_method: 'client_secret_post'
              consent_mode: 'implicit'

            - client_id: 'dolibarr-le-portail'
              client_name: 'Dolibarr - Ecolieu du Portail'
              client_secret:
                # Hash pbkdf2 du client secret ; la valeur en clair est dans le
                # Secret dolibarr-le-portail-oidc-client-secret, reflété vers le
                # namespace de l'application.
                value: "$pbkdf2-sha512$310000$xtOHpw34f8M1Rmu/X5KAJg$Rqq88pBBA3c6NIA8GHhIQAaNvG9xWQgMruGalkIUjHLFlcGMbSdHasHqD6G2qibvqoaYiyvCz44d6aC0O7pi9A"
              public: false
              authorization_policy: 'one_factor'
              redirect_uris:
                # Chemin imposé par Dolibarr : openid_connect_get_redirect_url()
                # renvoie DOL_MAIN_URL_ROOT suivi de ce fichier, sans réglage
                # possible.
                - 'https://dolibarr.${domain_prefix}leportail.org/core/modules/openid_connect/callback.php'
              scopes:
                - 'openid'
                - 'email'
                - 'profile'
              userinfo_signed_response_alg: 'none'
              # client_secret_post, et non _basic comme Grist : Dolibarr place
              # client_id et client_secret dans le corps du POST au token
              # endpoint (http_build_query), donc l'authentification Basic
              # échouerait en 401 au moment de l'échange du code.
              token_endpoint_auth_method: 'client_secret_post'
              consent_mode: 'implicit'

            - client_id: 'wordpress-site-le-portail'
              client_name: 'WordPress site - Ecolieu du Portail'
              client_secret:
                value: "$pbkdf2-sha512$310000$Iv83vfnag01nbzYY66t4LA$oEKyPTxzJREtAMKRmZ0KbOfBJHKLohhk759nO7qeuDj30tdcWv9YE4NHK03WbaGpTMynRccjUeBvkZOyqDB30Q"
              public: false
              authorization_policy: '${wordpress_site_authorization_policy:=one_factor}'
              redirect_uris:
                - 'https://www.${domain_prefix}leportail.org/wp-admin/admin-ajax.php?action=openid-connect-authorize'
              scopes:
                - 'openid'
                - 'email'
                - 'profile'
                # Le groupe est verifie une seconde fois cote WordPress, dans le
                # mu-plugin : une politique mal reglee ici donnerait sinon les
                # pleins pouvoirs a tout l'annuaire.
                - 'groups'
              userinfo_signed_response_alg: 'none'
              # client_secret_post : le plugin place client_id et client_secret
              # dans le corps du POST au token endpoint.
              token_endpoint_auth_method: 'client_secret_post'
              consent_mode: 'implicit'

            - client_id: 'wordpress-epilibres-le-portail'
              client_name: 'WordPress epilibres - Ecolieu du Portail'
              client_secret:
                value: "$pbkdf2-sha512$310000$Xx9JMgJxu87ReqLL4SFdmQ$7n/zwXlpfiWgKpOicFovPv0PP/F44WXOBEp4UwRrwdoz2TXg0gYKivr/jSaERhUNp/2D/eawDD06xMBxWCf7IQ"
              public: false
              authorization_policy: '${wordpress_epilibres_authorization_policy:=one_factor}'
              redirect_uris:
                - 'https://epilibres.${domain_prefix}leportail.org/wp-admin/admin-ajax.php?action=openid-connect-authorize'
                - 'https://epi-libres.${domain_prefix}leportail.org/wp-admin/admin-ajax.php?action=openid-connect-authorize'
                - 'https://epis-libres.${domain_prefix}leportail.org/wp-admin/admin-ajax.php?action=openid-connect-authorize'
              scopes:
                - 'openid'
                - 'email'
                - 'profile'
                # Le groupe est verifie une seconde fois cote WordPress, dans le
                # mu-plugin : une politique mal reglee ici donnerait sinon les
                # pleins pouvoirs a tout l'annuaire.
                - 'groups'
              userinfo_signed_response_alg: 'none'
              # client_secret_post : le plugin place client_id et client_secret
              # dans le corps du POST au token endpoint.
              token_endpoint_auth_method: 'client_secret_post'
              consent_mode: 'implicit'

          # Lu dans le Secret authelia-secrets, chiffre par SOPS, plutot que pose
          # en clair ici : ce fichier est versionne, et le secret y etait lisible
          # de quiconque a acces au depot.
          #
          # secret_name suffit a detourner le chart : il cesse alors de fabriquer
          # sa propre cle et injecte AUTHELIA_..._HMAC_SECRET_FILE pointant sur
          # le fichier monte. Encore faut-il que la cle figure dans les items de
          # secret.additionalSecrets, sans quoi rien n'est monte.
          hmac_secret:
            secret_name: 'authelia-secrets'
            path: 'AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET'
          
          # JWKS : cle RSA de signature des id_tokens, lue dans le meme Secret.
          #
          # Ici pas de secret_name : le chart ne sait pas monter les cles JWKS,
          # il se contente de rendre « {{ secret "<chemin>" }} » dans la
          # configuration, que le filtre « template » d'Authelia resout au
          # demarrage. Le chemin est donc celui du fichier DANS le conteneur, et
          # depend de secret.mountPath.
          jwks:
            - key_id: 'default'
              algorithm: 'RS256'
              use: 'sig'
              key:
                path: '/secrets/authelia-secrets/AUTHELIA_IDENTITY_PROVIDERS_OIDC_ISSUER_PRIVATE_KEY'
          
          # CORS
          cors:
            endpoints:
              - 'authorization'
              - 'token'
              - 'revocation'
              - 'introspection'
              - 'userinfo'
            allowed_origins_from_client_redirect_uris: true
          
          # Lifespans
          lifespans:
            access_token: '1 hour'
            authorize_code: '1 minute'
            id_token: '1 hour'
            refresh_token: '1 hour and 30 minutes'

    # ================================================================
    # Secrets : on configure le users_database via additionalSecrets
    # ================================================================
    secret:
      mountPath: '/secrets'
      # Le users_database.yml monté à part (on le crée à la main)
      additionalSecrets:
        # authelia-users:
        #   path: 'users'
        #   items:
        #     - key: 'users_database.yml'
        #       path: 'users_database.yml'
        authelia-ldap-bind:
          items:
            - key: 'AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD'
              path: 'AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD' 
        # Seules les cles listees ici sont montees : une cle presente dans le
        # Secret mais absente de cette liste reste invisible au conteneur, et la
        # reference faite plus haut echouerait au demarrage.
        authelia-secrets:
          items:
            - key: 'AUTHELIA_SESSION_SECRET'
              path: 'AUTHELIA_SESSION_SECRET'
            - key: 'AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET'
              path: 'AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET'
            - key: 'AUTHELIA_IDENTITY_PROVIDERS_OIDC_ISSUER_PRIVATE_KEY'
              path: 'AUTHELIA_IDENTITY_PROVIDERS_OIDC_ISSUER_PRIVATE_KEY'
            - key: 'AUTHELIA_STORAGE_ENCRYPTION_KEY'
              path: 'AUTHELIA_STORAGE_ENCRYPTION_KEY'
            - key: 'AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET'
              path: 'AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET'
        authelia-smtp:
          items:
            - key: 'password.txt'
              path: 'password.txt'