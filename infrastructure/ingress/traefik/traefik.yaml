apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: traefik
  namespace: controller-ingress
spec:
  interval: 24h
  url: oci://ghcr.io/traefik/helm/traefik
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "39.0.0"

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: controller-ingress
spec:
  interval: 5m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: traefik
    namespace: controller-ingress
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    api:
      dashboard: true
      insecure: false
    logs:
      access:
        enabled: true
      general:
        level: INFO
    providers:
      kubernetesCRD:
        allowCrossNamespace: true

    # =====================================================
    # MODE D'EXÉCUTION : DaemonSet hostNetwork sur eth1
    # =====================================================
    deployment:
      kind: DaemonSet

      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true

    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
        add: ["NET_BIND_SERVICE"]
      readOnlyRootFilesystem: true

    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
    
    # =====================================================
    # SERVICE : on désactive le Service LoadBalancer
    # =====================================================
    # Plus besoin : on n'a plus d'IP de Service à attribuer, hostNetwork suffit
    service:
      enabled: false
      # spec:
      #   externalTrafficPolicy: Local

    ports:
      web:
        port: 80
        hostPort: 80
        expose:
          default: true
        exposedPort: 80
        protocol: TCP
        http:
          redirections:
            entryPoint:
              permanent: true
              scheme: https
              to: websecure

      websecure:
        port: 443
        hostPort: 443
        expose:
          default: true
        exposedPort: 443
        protocol: TCP
        http:
          tls:
            enabled: true
      internal:
        port: 8444
        expose:
          default: true
        exposedPort: 8444
        protocol: TCP
      traefik:
        port: 8080
        expose:
          default: false
      metrics:
        port: 8082
        expose:
          default: true
        exposedPort: 8082
        protocol: TCP

    # ports:
    #   web:
    #     http:
    #       redirections:
    #         entryPoint:
    #           permanent: true
    #           scheme: https
    #           to: websecure
    #   metrics:
    #     port: 8082
    #     expose:
    #       default: true
    #     exposedPort: 8082
    #     protocol: TCP

    metrics:
      prometheus:
        entryPoint: metrics
        addEntryPointsLabels: true
        addRoutersLabels: false # ça ferait trop de cardinalité
        addServicesLabels: true # on a seulement besoin de metrics sur les services
        buckets: "0.1,0.3,1,3,10"