apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: traefik
  namespace: controller-ingress
spec:
  interval: 24h
  url: oci://ghcr.io/traefik/helm/traefik
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "39.0.0"

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: controller-ingress
spec:
  interval: 5m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: traefik
    namespace: controller-ingress
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    api:
      dashboard: true
      insecure: false
    logs:
      access:
        enabled: true
      general:
        level: INFO
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    deployment:
      kind: DaemonSet
    service:
      spec:
        externalTrafficPolicy: Local
    ports:
      web:
        http:
          redirections:
            entryPoint:
              permanent: true
              scheme: https
              to: websecure
      metrics:
        port: 8082
        expose:
          default: true
        exposedPort: 8082
        protocol: TCP

    metrics:
      prometheus:
        entryPoint: metrics
        addEntryPointsLabels: true
        addRoutersLabels: false # ça ferait trop de cardinalité
        addServicesLabels: true # on a seulement besoin de metrics sur les services
        buckets: "0.1,0.3,1,3,10"