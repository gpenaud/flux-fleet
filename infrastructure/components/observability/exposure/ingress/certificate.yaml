---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: monitoring.internal.${cluster}.${service_domain}
  namespace: controller-observability
spec:
  secretName: monitoring.internal.${cluster}.${service_domain}.tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "monitoring.internal.${cluster}.${service_domain}"
  dnsNames:
    - "monitoring.internal.${cluster}.${service_domain}"