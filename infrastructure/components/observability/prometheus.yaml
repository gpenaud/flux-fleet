---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: controller-observability
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "84.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 24h
  install:
    crds: Create
    timeout: 10m
  upgrade:
    crds: CreateReplace
    timeout: 10m
  values:
    crds:
      enabled: true

    # ----- OPÉRATEUR -----
    prometheusOperator:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
      serviceMonitor:
        selfMonitor: true
      admissionWebhooks:
        enabled: false
        patch:
          enabled:
        certManager:
          enabled: false
      tls:
        enabled: false

    # ----- PROMETHEUS -----
    prometheus:
      enabled: true
      prometheusSpec:
        retention: 10d
        retentionSize: "8GB"
        scrapeInterval: 60s
        evaluationInterval: 60s
        externalUrl: https://monitoring.leportail.org/prometheus
        routePrefix: /prometheus
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            memory: 768Mi
        # Permet au Prometheus de découvrir tous les ServiceMonitor/PodMonitor/PrometheusRule
        # de tous les namespaces, pas seulement ceux labellisés "release: kube-prometheus-stack"
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        walCompression: true
        ruleSelector:
          matchExpressions:
            - key: loki_rule
              operator: DoesNotExist
      ingress:
        enabled: false

    # ----- ALERTMANAGER -----
    alertmanager:
      enabled: true
      alertmanagerSpec:
        externalUrl: https://monitoring.leportail.org/alertmanager
        routePrefix: /alertmanager
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            memory: 64Mi
        configSecret: alertmanager-config
      ingress:
        enabled: false

    # ----- NODE EXPORTER -----
    nodeExporter:
      enabled: true
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 20m
          memory: 16Mi
        limits:
          memory: 32Mi
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
      extraArgs:
        - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
        - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$

    # ----- KUBE-STATE-METRICS -----
    kubeStateMetrics:
      enabled: true
    kube-state-metrics:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi

    # ----- GRAFANA : DÉSACTIVÉ (chart séparé) -----
    grafana:
      enabled: false
      forceDeployDashboards: false
      forceDeployDatasources: false

    # ----- DEFAULT RULES : DÉSACTIVÉES (on écrira nos PrometheusRule au bloc 2) -----
    defaultRules:
      create: false

    windowsMonitoring:
      enabled: false

    # ----- CONTROL PLANE : DÉSACTIVÉ (k3s expose ces composants différemment) -----
    kubelet:
      enabled: false
    kubeApiServer:
      enabled: false
    kubeControllerManager:
      enabled: false
    coreDns:
      enabled: false
    kubeDns:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false