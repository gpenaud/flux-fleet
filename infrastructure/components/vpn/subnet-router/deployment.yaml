apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-subnet-router
  namespace: controller-vpn
  labels:
    app.kubernetes.io/name: tailscale-subnet-router
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tailscale-subnet-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tailscale-subnet-router
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tailscale
          image: tailscale/tailscale:latest
          imagePullPolicy: Always
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-authkey
                  key: TS_AUTHKEY
            - name: TS_EXTRA_ARGS
              value: "--login-server=https://vpn.${cluster}.${domain} --advertise-tags=tag:k8s-router"
            - name: TS_ROUTES
              value: "10.0.1.0/24"
            - name: TS_USERSPACE
              value: "true"
            - name: TS_STATE_DIR
              value: "/var/lib/tailscale"
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_HOSTNAME
              value: "k8s-router-infra02"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: state
              mountPath: /var/lib/tailscale
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: tailscale-subnet-router-state
        - name: tmp
          emptyDir: {}
        - name: var-run
          emptyDir: {}
      volumeMounts:
        - name: state
          mountPath: /var/lib/tailscale
        - name: tmp
          mountPath: /tmp
        - name: var-run
          mountPath: /var/run/tailscale
