
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: gabe565
  namespace: controller-vpn
spec:
  type: oci
  url: oci://ghcr.io/gabe565/charts
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headscale
  namespace: controller-vpn
spec:
  interval: 30m
  chart:
    spec:
      chart: headscale
      version: "0.16.x"  # à pinner précisément après vérification artifacthub
      sourceRef:
        kind: HelmRepository
        name: gabe565
        namespace: controller-vpn
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: ghcr.io/juanfont/headscale
      tag: v0.29.0-beta.1  # à valider — dernière patch stable au moment du déploiement

    # Args par défaut du chart : ["serve"]
    args: ["serve"]

    # Configuration Headscale via variables d'environnement
    # cf. https://github.com/juanfont/headscale/blob/main/config-example.yaml
    env:
      HEADSCALE_SERVER_URL: "https://vpn.${cluster}.${domain}"
      HEADSCALE_LISTEN_ADDR: "0.0.0.0:8080"
      HEADSCALE_METRICS_LISTEN_ADDR: "0.0.0.0:9090"
      HEADSCALE_GRPC_LISTEN_ADDR: "127.0.0.1:50443"
      HEADSCALE_GRPC_ALLOW_INSECURE: "true"
      HEADSCALE_PREFIXES_V4: "100.64.0.0/10"
      HEADSCALE_PREFIXES_V6: "fd7a:115c:a1e0::/48"
      HEADSCALE_DNS_BASE_DOMAIN: "ts.${domain}"
      HEADSCALE_DNS_MAGIC_DNS: "true"
      HEADSCALE_LOG_LEVEL: "debug"

    # === POLICY ACL : géré nativement par le chart ===
    configMaps:
      acl:
        enabled: true
        data:
          acl.hujson: |
            {
              "groups": {
                "group:admins": ["gpenaud@"]
              },
              "tagOwners": {
                "tag:k8s-router": ["group:admins"]
              },
              "autoApprovers": {
                "routes": {
                  "10.0.1.0/24": ["tag:k8s-router"]
                }
              },
              "acls": [
                {
                  "action": "accept",
                  "src":    ["*"],
                  "dst":    ["*:*"]
                }
              ]
            }

    # Persistance : une seule PVC pour config + clés + SQLite (sous /etc/headscale)
    persistence:
      config:
        enabled: true
        type: pvc
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: longhorn
        retain: true
        # mountPath par défaut : /etc/headscale (laissé tel quel)
      run:
        enabled: true
        type: emptyDir
        mountPath: /var/run/headscale


    # PostgreSQL subchart désactivé — on reste sur SQLite
    postgresql:
      enabled: false

    # Service ClusterIP — exposition via IngressRoute Traefik
    service:
      main:
        ports:
          http:
            port: 8080
            targetPort: 8080
          metrics:
            enabled: true
            port: 9090
            targetPort: 9090

    # Pas d'Ingress géré par le chart — on utilise une IngressRoute Traefik externe
    ingress:
      main:
        enabled: false

    # Resources : Headscale est très léger
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

    # Pod security context appliqué à TOUS les containers (init + main)
    # via defaultPodOptions de la bjw-s common library
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      # Force kubelet à chown le volume si l'owner ne matche pas fsGroup.
      # Nécessaire avec Longhorn qui ne propage pas toujours fsGroup au mount.
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault


    # Override du securityContext de l'initContainer "config" (hardcodé par le chart)
    # Nécessaire pour passer Pod Security Admission "restricted"
    initContainers:
      config:
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # l'init écrit /etc/headscale/config.yaml
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault

    # SecurityContext du container principal Headscale
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault