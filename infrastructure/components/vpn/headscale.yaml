
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: gabe565
  namespace: controller-vpn
spec:
  type: oci
  url: oci://ghcr.io/gabe565/charts
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headscale
  namespace: controller-vpn
spec:
  interval: 30m
  chart:
    spec:
      chart: headscale
      version: "0.16.x"  # à pinner précisément après vérification artifacthub
      sourceRef:
        kind: HelmRepository
        name: gabe565
        namespace: controller-vpn
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: ghcr.io/juanfont/headscale
      tag: v0.28.0  # à valider — dernière patch stable au moment du déploiement

    # Args par défaut du chart : ["serve"]
    args: ["serve"]

    # Configuration Headscale via variables d'environnement
    # cf. https://github.com/juanfont/headscale/blob/main/config-example.yaml
    env:
      HEADSCALE_SERVER_URL: https://vpn.${cluster}.${domain}
      HEADSCALE_LISTEN_ADDR: 0.0.0.0:8080
      HEADSCALE_METRICS_LISTEN_ADDR: 0.0.0.0:9090
      HEADSCALE_GRPC_LISTEN_ADDR: 127.0.0.1:50443
      HEADSCALE_GRPC_ALLOW_INSECURE: "true"

      # DNS (MagicDNS interne au tailnet)
      HEADSCALE_DNS_BASE_DOMAIN: "ts.${domain}"
      HEADSCALE_DNS_MAGIC_DNS: "true"
      HEADSCALE_DNS_NAMESERVERS_GLOBAL: "1.1.1.1 1.0.0.1"

      # Préfixes IP attribués aux nœuds du tailnet
      HEADSCALE_PREFIXES_V4: "100.64.0.0/10"
      HEADSCALE_PREFIXES_V6: "fd7a:115c:a1e0::/48"

      # DERP (relay Tailscale public, suffisant pour démarrer)
      HEADSCALE_DERP_URLS: https://controlplane.tailscale.com/derpmap/default
      HEADSCALE_DERP_AUTO_UPDATE_ENABLED: "true"
      HEADSCALE_DERP_UPDATE_FREQUENCY: 24h

      # Base SQLite — chemin pointé sur le volume persistant
      HEADSCALE_DATABASE_TYPE: sqlite3
      HEADSCALE_DATABASE_SQLITE_PATH: /var/lib/headscale/db.sqlite

      # Policy en mode fichier — montée depuis ConfigMap
      HEADSCALE_POLICY_MODE: file
      HEADSCALE_POLICY_PATH: /etc/headscale-policy/acl.hujson

      # Divers
      HEADSCALE_LOG_LEVEL: info
      HEADSCALE_NOISE: '{}'
      HEADSCALE_EPHEMERAL_NODE_INACTIVITY_TIMEOUT: 30m

    # === PERSISTENCE (bjw-s common syntax) ===
    persistence:
      # Volume pour la base SQLite + noise_private.key
      config:
        enabled: true
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 1Gi
        retain: true
        globalMounts:
          - path: /var/lib/headscale

      # Volume pour la policy ACL (depuis le ConfigMap)
      policy:
        enabled: true
        type: configMap
        name: headscale-policy
        globalMounts:
          - path: /etc/headscale-policy

      run:
        enabled: true
        type: emptyDir
        mountPath: /var/run/headscale


    # PostgreSQL subchart désactivé — on reste sur SQLite
    postgresql:
      enabled: false

    # Service ClusterIP — exposition via IngressRoute Traefik
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
            targetPort: 8080
          metrics:
            enabled: true
            port: 9090
            targetPort: 9090

    # Pas d'Ingress géré par le chart — on utilise une IngressRoute Traefik externe
    ingress:
      main:
        enabled: false

    # Resources : Headscale est très léger
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

     # === SÉCURITÉ — alignée avec PSS restricted ===
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    controllers:
      main:
        containers:
          main:
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]