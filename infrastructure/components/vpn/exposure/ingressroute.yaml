
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headscale
  namespace: controller-vpn
  annotations:
      external-dns.alpha.kubernetes.io/hostname: vpn.${cluster}.${domain}
      external-dns.alpha.kubernetes.io/target: ${cluster}.${domain}
      external-dns.alpha.kubernetes.io/ttl: "300"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`vpn.${cluster}.${domain}`)
      kind: Rule
      services:
        - name: headscale
          port: 8080
          scheme: http
  tls:
    secretName: wildcard.${cluster}.${domain}.tls