
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
  namespace: kube-system
  annotations:
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "controller-certificate"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "controller-certificate"
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops.gpenaud@gmail.com
    privateKeySecretRef:
      name: letsencrypt-production
    solvers:
      - dns01:
          webhook:
            groupName: acme.alter-it.org
            solverName: ovh
            config:
              endpoint: ovh-eu
              authenticationMethod: application
              applicationKeyRef:
                name: ovh-dns-zone-alter-it-eu
                key: applicationKey
              applicationSecretRef:
                name: ovh-dns-zone-alter-it-eu
                key: applicationSecret
              applicationConsumerKeyRef:
                name: ovh-dns-zone-alter-it-eu
                key: applicationConsumerKey
        selector:
          dnsZones:
            - "alter-it.eu"
            - "*.alter-it.eu"
      - dns01:
          webhook:
            groupName: acme.alter-it.org
            solverName: ovh
            config:
              endpoint: ovh-eu
              authenticationMethod: application
              applicationKeyRef:
                name: ovh-dns-zone-leportail-org
                key: applicationKey
              applicationSecretRef:
                name: ovh-dns-zone-leportail-org
                key: applicationSecret
              applicationConsumerKeyRef:
                name: ovh-dns-zone-leportail-org
                key: applicationConsumerKey
        selector:
          dnsZones:
            - "leportail.org"
            - "*.leportail.org"
      - dns01:
          webhook:
            groupName: acme.alter-it.org
            solverName: ovh
            config:
              endpoint: ovh-eu
              authenticationMethod: application
              applicationKeyRef:
                name: ovh-dns-zone-fermedujointout-fr
                key: applicationKey
              applicationSecretRef:
                name: ovh-dns-zone-fermedujointout-fr
                key: applicationSecret
              applicationConsumerKeyRef:
                name: ovh-dns-zone-fermedujointout-fr
                key: applicationConsumerKey
        selector:
            dnsZones:
              - "fermedujointout.fr"
              - "*.fermedujointout.fr"
      - dns01:
          webhook:
            groupName: acme.alter-it.org
            solverName: ovh
            config:
              endpoint: ovh-eu
              authenticationMethod: application
              applicationKeyRef:
                name: ovh-dns-zone-labergeronnette-org
                key: applicationKey
              applicationSecretRef:
                name: ovh-dns-zone-labergeronnette-org
                key: applicationSecret
              applicationConsumerKeyRef:
                name: ovh-dns-zone-labergeronnette-org
                key: applicationConsumerKey
        selector:
            dnsZones:
              - "labergeronnette.org"
              - "*.labergeronnette.org"