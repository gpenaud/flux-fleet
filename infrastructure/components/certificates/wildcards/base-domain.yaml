---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard.${cluster_name}.${base_domain}
  namespace: controller-cert-manager
spec:
  secretName: wildcard.${cluster_name}.${base_domain}.tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "${base_domain}"
  dnsNames:
    - "${cluster_name}.${base_domain}"
    - "*.${cluster_name}.${base_domain}"
    - "*.internal.${cluster_name}.${base_domain}"