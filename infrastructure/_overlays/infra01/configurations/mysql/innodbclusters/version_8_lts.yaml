
apiVersion: mysql.oracle.com/v2
kind: InnoDBCluster
metadata:
  name: mysql-version-8-lts
  namespace: controller-mysql-operator
spec:
  secretName: mysql-operator
  instances: 1
  tlsUseSelfSigned: true
  version: "8.4.3"
  edition: community
  mycnf: |
    [mysqld]
    # Régénéré 2026-05-17 17h
    # Activer le performance_schema pour les métriques et diagnostics
    performance_schema=ON
    # Configurations d'InnoDB pour de meilleures performances
    innodb_buffer_pool_size=256M
    # Cap du cache XCom Group Replication.
    # Défaut MySQL = 1G, calibré pour multi-nœuds en prod.
    # Sur mono-nœud, ce cache ne sert à rien (pas de pair à qui retransmettre).
    # 128M est le minimum autorisé et suffit largement.
    loose_group_replication_message_cache_size=128M
    # Limiter les connexions pour éviter de surcharger le serveur avec trop de clients simultanés
    max_connections=50
  podSpec:
    resources:
      requests:
        memory: "512Mi"
      limits:
        memory: "2Gi"
  router:
    instances: 1