
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  namespace: kube-system
  annotations:
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "controller-cert-manager"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "controller-cert-manager"
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ops.gpenaud@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
      - dns01:
          webhook:
            groupName: acme.alter-it.org
            solverName: ovh
            config:
              endpoint: ovh-eu
              authenticationMethod: application
              applicationKeyRef:
                name: dns-ovh
                key: applicationKey
              applicationSecretRef:
                name: dns-ovh
                key: applicationSecret
              applicationConsumerKeyRef:
                name: dns-ovh
                key: applicationConsumerKey
        selector:
          dnsZones:
            - leportail.org
            - labergeronnette.org
      - dns01:
          webhook:
            groupName: acme.alter-it.org
            solverName: ovh
            config:
              endpoint: ovh-eu
              authenticationMethod: application
              applicationKeyRef:
                name: dns-ovh-ferme-du-jointout
                key: applicationKey
              applicationSecretRef:
                name: dns-ovh-ferme-du-jointout
                key: applicationSecret
              applicationConsumerKeyRef:
                name: dns-ovh-ferme-du-jointout
                key: applicationConsumerKey
        selector:
            dnsZones:
              - fermedujointout.fr