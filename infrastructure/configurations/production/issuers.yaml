
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  namespace: kube-system
  annotations:
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "controller-cert-manager"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "controller-cert-manager"
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ops.gpenaud@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
      - dns01:
          webhook:
            groupName: acme.alter-it.org
            solverName: ovh
            config:
              endpoint: ovh-eu
              applicationKeyRef:
                name: dns-ovh
                key: applicationKey
              applicationSecretRef:
                name: dns-ovh
                key: applicationSecret
              applicationConsumerKeyRef:
                name: dns-ovh
                key: applicationConsumerKey
        selector:
          dnsZones:
            - "leportail.org"
            - "labergeronnette.org"
      - http01:
          ingress:
            class: traefik
        selector:
            dnsZones:
              - "fermedujointout.fr"
            
