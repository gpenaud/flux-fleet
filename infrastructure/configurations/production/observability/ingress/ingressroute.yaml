---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: monitoring
  namespace: controller-observability
  annotations:
      external-dns.alpha.kubernetes.io/hostname: monitoring.internal.infra01.alter-it.eu
      external-dns.alpha.kubernetes.io/target: internal.infra01.alter-it.eu
      external-dns.alpha.kubernetes.io/ttl: "300"
spec:
  entryPoints:
    - websecure
  
  routes:
    # === Route 1 : Racine → redirect vers /grafana ===
    - match: Host(`monitoring.internal.infra01.alter-it.eu`) && Path(`/`)
      kind: Rule
      middlewares:
        - name: tailnet-only
          namespace: controller-ingress
        - name: monitoring-redirect-root
          namespace: controller-observability
      services:
        # Service "factice" requis par Traefik même quand seul le middleware compte
        # (le middleware répond avec un 302 avant que le backend soit appelé)
        - name: grafana
          port: 80
    
    # === Route 2 : Grafana ===
    - match: Host(`monitoring.internal.infra01.alter-it.eu`) && PathPrefix(`/grafana`)
      kind: Rule
      middlewares:
        - name: tailnet-only
          namespace: controller-ingress
      services:
        - name: grafana
          port: 80
      # Pas de middleware d'auth : Grafana gère sa propre login
    
    # === Route 3 : Prometheus ===
    - match: Host(`monitoring.internal.infra01.alter-it.eu`) && PathPrefix(`/prometheus`)
      kind: Rule
      services:
        - name: prometheus-operated
          port: 9090
      middlewares:
        - name: tailnet-only
          namespace: controller-ingress
    
    # === Route 4 : Alertmanager ===
    - match: Host(`monitoring.internal.infra01.alter-it.eu`) && PathPrefix(`/alertmanager`)
      kind: Rule
      services:
        - name: alertmanager-operated
          port: 9093
      middlewares:
        - name: tailnet-only
          namespace: controller-ingress
  
  tls:
    secretName: monitoring-internal-infra01-alter-it-eu-tls