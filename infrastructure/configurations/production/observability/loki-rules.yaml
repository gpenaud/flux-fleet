---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-rules
  namespace: controller-observability
data:
  # Le tenant par défaut s'appelle "fake" quand auth_enabled=false
  # Le fichier doit être dans /var/loki/rules/fake/<filename>.yaml
  k8up-backups.yaml: |
    groups:
      - name: backups-from-logs
        interval: 1m
        rules:
          # Détecte les ERROR dans les logs des Jobs backup k8up
          # C'est la signature exacte du bug Nextcloud
          - alert: K8upBackupErrorInLogs
            expr: |
              sum by (namespace) (
                count_over_time(
                  {container=~"backup.*"} |~ "(?i)error" [10m]
                )
              ) > 0
            for: 2m
            labels:
              severity: critical
              source: loki
            annotations:
              summary: "ERROR détecté dans les logs backup de {{ $labels.namespace }}"
              description: |
                Au moins une ligne contenant "error" a été détectée dans les logs
                des pods backup du namespace {{ $labels.namespace }} sur les 10
                dernières minutes. C'est typiquement le mode silent failure de k8up
                où Restic logue des erreurs mais le Job termine avec succès.
                
                Investiguer immédiatement avec :
                kubectl -n {{ $labels.namespace }} logs -l app.kubernetes.io/managed-by=k8up --tail=200 | grep -i error