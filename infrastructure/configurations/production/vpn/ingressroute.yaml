
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headscale
  namespace: controller-vpn
  annotations:
      external-dns.alpha.kubernetes.io/hostname: vpn.infra01.alter-it.eu
      external-dns.alpha.kubernetes.io/target: infra01.alter-it.eu
      external-dns.alpha.kubernetes.io/ttl: "300"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`vpn.infra01.alter-it.eu`)
      kind: Rule
      middlewares:
        - name: headscale-headers
          namespace: controller-vpn
      services:
        - name: headscale
          # ⚠️ À vérifier : le nom de Service réel dépend du chart gabe565
          # Souvent c'est le nom de la release ou "<release>-headscale"
          # Confirmer après premier déploiement avec : kubectl -n controller-vpn get svc
          port: 8080
          scheme: http
          # Important pour Headscale : pas de passHostHeader=false, pas de
          # rewriting. Le serveur doit recevoir le Host original.
          passHostHeader: true
  tls:
    secretName: vpn-infra01-alter-it-eu-tls