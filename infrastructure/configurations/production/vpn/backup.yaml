---
# Schedule k8up : backup PVC headscale-data vers S3 OVH (Restic)
# Suit la convention de tes autres apps (Nextcloud, Grist, etc.)
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: headscale
  namespace: controller-vpn
spec:
  backend:
    repoPasswordSecretRef:
      # ⚠️ À ajuster : nom du secret Reflector-répliqué dans ce namespace
      # contenant RESTIC_PASSWORD (équivalent à ce que tu fais pour tes autres apps)
      name: k8up-repo-password
      key: password
    s3:
      # ⚠️ À ajuster : endpoint/bucket/credentials S3 OVH selon ta config existante
      endpoint: https://s3.gra.io.cloud.ovh.net
      bucket: alter-it-backups
      accessKeyIDSecretRef:
        name: s3-ovh
        key: accessKey
      secretAccessKeySecretRef:
        name: s3-ovh
        key: secretKey

  backup:
    # Tous les jours à 02h17 (décalé pour éviter conflit avec autres backups)
    schedule: "17 2 * * *"
    # Headscale doit être ARRÊTÉ pendant le snapshot SQLite, OU on accepte
    # le risque d'un backup en cours d'écriture (rare avec 1 seul serveur,
    # SQLite mode WAL relativement résilient).
    # Option propre : pre/post backup hook qui fait un `sqlite3 ... .backup`
    # cohérent. À faire en v2 si besoin.
    failedJobsHistoryLimit: 2
    successfulJobsHistoryLimit: 2

  prune:
    # Rétention : 7 quotidiens, 4 hebdo, 6 mensuels
    schedule: "30 3 * * 0"
    retention:
      keepLast: 5
      keepDaily: 7
      keepWeekly: 4
      keepMonthly: 6

  check:
    # Vérification intégrité repo une fois par semaine
    schedule: "45 4 * * 1"
