
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
  namespace: controller-storage
spec:
  interval: 24h
  url: https://charts.longhorn.io

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: controller-storage
spec:
  interval: 30m
  chart:
    spec:
      chart: longhorn
      version: "v1.x"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: controller-storage
  values:
    defaultSettings:
      defaultDataPath: /var/lib/longhorn
      backupTarget: ""
      snapshotDataIntegrity: disabled
      autoCleanupSystemGeneratedSnapshot: true
      disableScheduledBackup: true
    persistence:
      defaultClass: true
      defaultClassReplicaCount: 1
      defaultFsType: xfs      
    ingress:
      enabled: false