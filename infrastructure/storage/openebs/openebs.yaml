
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openebs
  namespace: controller-storage
spec:
  interval: 24h
  url: https://openebs.github.io/openebs

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
  namespace: controller-storage
spec:
  interval: 1h
  chart:
    spec:
      chart: openebs
      version: "4.2.0"
      sourceRef:
        kind: HelmRepository
        name: openebs
        namespace: controller-storage
  values:
    engines:
      local:
        lvm:
          enabled: true
        zfs:
          enabled: false
      replicated:
        mayastor:
          enabled: false
    localpv-provisioner:
      enabled: false
    loki:
      enabled: false
    alloy:
      enabled: false