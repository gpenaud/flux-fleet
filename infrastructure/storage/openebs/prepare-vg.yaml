# ============================================================================
#  PRÉPARATION DU VOLUME GROUP — version auto-découvrante (garde-fou corrigé)
#
#  OpenEBS LVM ne crée PAS le Volume Group : il découpe dedans. Ce VG doit
#  exister sur chaque nœud AVANT que le CSI provisionne. Ce DaemonSet le crée,
#  une fois par nœud, de façon idempotente.
#
#  Pas de paramètre par nœud : chaque pod DÉCOUVRE localement le volume Hetzner
#  dédié (glob /dev/disk/by-id/scsi-0HC_Volume_*).
#
#  ── CORRECTIF GARDE-FOU ──
#  L'ancien test `if blkid <dev>` donnait des FAUX POSITIFS : sans util-linux,
#  le blkid de busybox ne renvoie pas exit=2 sur un device vierge, et le test
#  concluait à tort "signature présente". On installe désormais util-linux ET
#  on teste le TYPE (chaîne vide = vierge) au lieu du code retour brut.
#
#  ── PRÉREQUIS TALOS ──
#  1. Extension lvm2 dans l'image Talos.
#  2. EXACTEMENT UN volume Hetzner de données par nœud, automount=false, non formaté.
# ============================================================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vg-prep
  namespace: controller-storage
  labels:
    app: vg-prep
spec:
  selector:
    matchLabels:
      app: vg-prep
  template:
    metadata:
      labels:
        app: vg-prep
    spec:
      # nodeSelector:
      #   node.kubernetes.io/storage: "lvm"
      hostPID: true
      containers:
        - name: vg-prep
          image: alpine:3.20
          securityContext:
            privileged: true
          env:
            - name: VG_NAME
              value: "vg-openebs"
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # util-linux pour un blkid au comportement standard (exit=2 / TYPE vide
              # sur device vierge), lvm2 pour pvcreate/vgcreate.
              apk add --no-cache lvm2 util-linux >/dev/null 2>&1 || true

              # Idempotent : si le VG existe deja, ne touche a rien.
              if vgs "$VG_NAME" >/dev/null 2>&1; then
                echo "VG $VG_NAME deja present - rien a faire."
                exec sleep infinity
              fi

              # --- Auto-decouverte du volume Hetzner dedie ---
              set +e
              MATCHES=$(ls /dev/disk/by-id/scsi-0HC_Volume_* 2>/dev/null)
              set -e
              COUNT=$(printf '%s\n' "$MATCHES" | grep -c . || true)

              if [ "$COUNT" -eq 0 ]; then
                echo "ERREUR: aucun volume Hetzner (scsi-0HC_Volume_*) sur ce noeud."
                echo "Verifie l'attachement du volume de donnees."
                exec sleep infinity
              fi
              if [ "$COUNT" -gt 1 ]; then
                echo "ERREUR: plusieurs volumes Hetzner detectes - choix ambigu :"
                printf '%s\n' "$MATCHES"
                echo "Garde-fou : on n'agit pas. Attache UN SEUL volume de donnees."
                exec sleep infinity
              fi

              DATA_DISK=$(printf '%s\n' "$MATCHES" | head -1)
              echo ">> Volume de donnees detecte : $DATA_DISK"

              # Garde-fou CORRIGE : on teste le TYPE de signature, pas le code
              # retour brut de blkid. Chaine vide = device vierge => on agit.
              # Un type reel (ext4, xfs, LVM2_member, etc.) => on refuse.
              FSTYPE=$(blkid -o value -s TYPE "$DATA_DISK" 2>/dev/null || true)
              if [ -n "$FSTYPE" ]; then
                echo "ERREUR: $DATA_DISK porte une signature de type '$FSTYPE'."
                echo "Attendu : volume brut. Garde-fou : on n'agit pas."
                exec sleep infinity
              fi

              echo ">> Creation PV/VG sur $DATA_DISK ..."
              pvcreate -ff -y "$DATA_DISK"
              vgcreate "$VG_NAME" "$DATA_DISK"
              echo ">> VG $VG_NAME cree."

              exec sleep infinity
          volumeMounts:
            - name: dev
              mountPath: /dev
            - name: lvm
              mountPath: /etc/lvm
      volumes:
        - name: dev
          hostPath:
            path: /dev
        - name: lvm
          hostPath:
            path: /etc/lvm
            type: DirectoryOrCreate