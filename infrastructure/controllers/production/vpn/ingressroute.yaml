---
# Middleware : headers nécessaires pour le protocole de contrôle Headscale
# Le client Tailscale utilise HTTP/2 et WebSocket sur /ts2021
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: headscale-headers
  namespace: controller-vpn
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
    # Pas de compression sur /ts2021 (binaire)
    # Traefik ne compresse pas par défaut, donc rien à faire ici
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headscale
  namespace: controller-vpn
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`headscale.alter-it.eu`)
      kind: Rule
      middlewares:
        - name: headscale-headers
          namespace: controller-vpn
      services:
        - name: headscale
          # ⚠️ À vérifier : le nom de Service réel dépend du chart gabe565
          # Souvent c'est le nom de la release ou "<release>-headscale"
          # Confirmer après premier déploiement avec : kubectl -n controller-vpn get svc
          port: 8080
          scheme: http
          # Important pour Headscale : pas de passHostHeader=false, pas de
          # rewriting. Le serveur doit recevoir le Host original.
          passHostHeader: true
  tls:
    secretName: headscale-alter-it-eu-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: headscale-alter-it-eu
  namespace: controller-vpn
spec:
  secretName: headscale-alter-it-eu-tls
  duration: 2160h    # 90 jours
  renewBefore: 720h  # renouvellement 30 jours avant expiration
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  commonName: headscale.alter-it.eu
  dnsNames:
    - headscale.alter-it.eu
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always