apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authelia
  namespace: controller-authentication
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`auth.alter-it.eu`)
      kind: Rule
      services:
        - name: authelia
          port: 80
  tls:
    secretName: auth-alter-it-eu-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: auth-alter-it-eu
  namespace: controller-authentication
spec:
  secretName: auth-alter-it-eu-tls
  commonName: auth.alter-it.eu
  dnsNames:
    - auth.alter-it.eu
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production