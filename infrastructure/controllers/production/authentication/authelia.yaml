apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: authelia
  namespace: controller-authentication
spec:
  interval: 24h
  url: https://charts.authelia.com
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authelia-storage
  namespace: controller-authentication
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: controller-authentication
spec:
  interval: 30m
  chart:
    spec:
      chart: authelia
      version: "0.11.5"
      sourceRef:
        kind: HelmRepository
        name: authelia
        namespace: controller-authentication
      interval: 12h

  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3

  values:
    # ================================================================
    # Pod : Deployment (pas DaemonSet, mono-instance suffit)
    # ================================================================
    pod:
      kind: 'Deployment'
      replicas: 1
      
      # Users database monté depuis un secret externe (gérer hors chart)
      env:
        - name: TZ
          value: "Europe/Paris"

    # ================================================================
    # Persistence : PVC Longhorn pour SQLite
    # ================================================================
    persistence:
      enabled: true
      storageClass: longhorn
      size: '1Gi'
      accessModes:
        - 'ReadWriteOnce'

    # ================================================================
    # Service : ClusterIP, exposé via IngressRoute séparée
    # ================================================================
    service:
      type: 'ClusterIP'
      port: 80

    # ================================================================
    # Ingress : géré par notre IngressRoute Traefik séparée
    # ================================================================
    ingress:
      enabled: false

    # ================================================================
    # Configuration Authelia
    # ================================================================
    configMap:
      disabled: false
      
      # --- Serveur
      server:
        port: 9091
      
      # --- Logs
      log:
        level: 'info'
      
      # --- Theme
      theme: 'dark'
      
      # --- Authentication backend : file-based
      authentication_backend:
        password_reset:
          disable: true  # désactivé jusqu'à ce qu'on configure SMTP
        password_change:
          disable: false
        refresh_interval: '5 minutes'
        file:
          enabled: true
          path: '/config/users_database.yml'
          watch: false
          search:
            email: false
            case_insensitive: false
          password:
            algorithm: 'argon2'
            argon2:
              variant: 'argon2id'
              iterations: 3
              memory: 65536
              parallelism: 4
              key_length: 32
              salt_length: 16

      # --- Access Control
      access_control:
        default_policy: 'deny'
        rules:
          # Authelia lui-même : bypass (sinon boucle infinie de login)
          - domain: 'auth.alter-it.eu'
            policy: 'bypass'

      # --- Session
      session:
        name: 'authelia_session'
        same_site: 'lax'
        expiration: '1 hour'
        inactivity: '5 minutes'
        remember_me: '1 month'
        # Cookies pour les deux domaines
        cookies:
          - domain: 'alter-it.eu'
            authelia_url: 'https://auth.alter-it.eu'
            default_redirection_url: 'https://auth.alter-it.eu'
          - domain: 'leportail.org'
            authelia_url: 'https://auth.alter-it.eu'
            default_redirection_url: 'https://www.leportail.org'

      # --- Storage : SQLite local
      storage:
        encryption_key:
          # Le chart génère le Secret tout seul à partir de cette valeur
          value: "AX03F64FzxEUUlZsI3/xrFnNZPjrsdljovjpeAWbE5eacWN2y7+Pwa98/MssUCX7TA+rMP"
        local:
          enabled: true
          path: '/config/db.sqlite3'

      # --- Notifier : filesystem pour démarrer (pas de SMTP)
      notifier:
        filesystem:
          enabled: true

      # --- Regulation (rate limit anti-brute force)
      regulation:
        max_retries: 5
        find_time: '2 minutes'
        ban_time: '5 minutes'

      # --- Identity Providers : OIDC
