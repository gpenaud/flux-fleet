        oidc:
          enabled: true
          
          hmac_secret:
            value: "0FZg4+U4lhgJqUA49n1H0SoO6NzAuC94hRG4jtjBozwQQjwPL/tRuWznPqUJMauV5yXlz58YFc6mWro5R"
          
          # JWKS : clé RSA pour signer les id_tokens
          # On la met directement en valeur (le chart la mettra dans un secret pour nous)
