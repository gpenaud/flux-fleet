apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lldap-ui
  namespace: controller-directory
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`directory.infra01.alter-it.eu`)
      kind: Rule
      middlewares:
        - name: tailnet-only
          namespace: controller-traefik
      services:
        - name: lldap
          port: 17170
  tls:
    secretName: directory-infra01-alter-it-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: directory-infra01-alter-it-tls
  namespace: controller-directory
spec:
  secretName: directory-infra01-alter-it-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - directory.infra01.alter-it.eu