apiVersion: v1
kind: Namespace
metadata:
  name: controller-traefik
  labels:
    alter-it.org/controller: traefik
    alter-it.org/managed-by: fluxcd
    reflector/ovh-dns-zone-alter-it-eu: "true"

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: traefik
  namespace: controller-traefik
spec:
  interval: 24h
  url: oci://ghcr.io/traefik/helm/traefik
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "39.0.0"

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: controller-traefik
spec:
  interval: 5m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: traefik
    namespace: controller-traefik
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    api:
      dashboard: true
      insecure: true
    logs:
      access:
        enabled: true
      general:
        level: INFO
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    ports:
      web:
        http:
          redirections:
            entryPoint:
              permanent: true
              scheme: https
              to: websecure
    additionalArguments:
      - "--entryPoints.websecure.forwardedHeaders.trustedIPs=10.42.0.0/16,10.43.0.0/16,127.0.0.1/32"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tailnet-only
  namespace: controller-traefik
spec:
  ipAllowList:
    sourceRange:
      - 100.64.0.0/10
      - 127.0.0.1/32
    ipStrategy:
      depth: 1   # ← prendre la 1ère IP dans X-Forwarded-For