
apiVersion: v1
kind: Namespace
metadata:
  name: controller-longhorn

---apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
  namespace: controller-longhorn
spec:
  interval: 24h
  url: https://charts.longhorn.io

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: controller-longhorn
spec:
  interval: 30m
  chart:
    spec:
      chart: longhorn
      version: "v1.x"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: controller-longhorn
  values:
    defaultSettings:
      defaultDataPath: /var/lib/longhorn
      backupTarget: ""
      snapshotDataIntegrity: disabled
      autoCleanupSystemGeneratedSnapshot: true
      disableScheduledBackup: true
    persistence:
      defaultClass: true
      defaultClassReplicaCount: 1       
    ingress:
      enabled: true
      ingressClassName: traefik
      host: longhorn.gpenaud.localhost
      tls: true
      tlsSecret: longhorn.gpenaud.localhost-tls
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-staging