---
apiVersion: v1
kind: Namespace
metadata:
  name: controller-reflector
  labels:
    alter-it.org/controller: reflector
    alter-it.org/managed-by: fluxcd

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: emberstack
  namespace: controller-reflector
spec:
  interval: 24h
  url: https://emberstack.github.io/helm-charts

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
  namespace: controller-reflector
spec:
  interval: 1h
  chart:
    spec:
      chart: reflector
      version: ">=7.0.0"
      sourceRef:
        kind: HelmRepository
        name: emberstack
        namespace: controller-reflector
      interval: 24h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    replicaCount: 1
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ClusterRole
              name: reflector
            patch: |
              - op: add
                path: /rules/0/verbs/-
                value: create
              - op: add
                path: /rules/0/verbs/-
                value: patch