apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cert-manager-webhook-ovh
  namespace: controller-cert-manager
spec:
  interval: 24h
  url: https://aureq.github.io/cert-manager-webhook-ovh

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-webhook-ovh
  namespace: controller-cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager-webhook-ovh
      sourceRef:
        kind: HelmRepository
        name: cert-manager-webhook-ovh
        namespace: controller-cert-manager
  values:
    groupName: acme.alter-it.org
    certManager:
      namespace: controller-cert-manager
    issuers:
      - name: letsencrypt-staging
        create: true
        kind: ClusterIssuer
        namespace: default
        cnameStrategy: None
        acmeServerUrl: https://acme-staging-v02.api.letsencrypt.org/directory
        email: ops.gpenaud@gmail.com
        ovhEndpointName: ovh-eu
        ovhAuthenticationRef:
          applicationKeyRef:
            name: dns-ovh
            key: applicationKey
          applicationSecretRef:
            name: dns-ovh
            key: applicationSecret
          consumerKeyRef:
            name: dns-ovh
            key: consumerKey
      - name: letsencrypt-production
        create: true
        kind: ClusterIssuer
        namespace: default
        cnameStrategy: None
        acmeServerUrl: https://acme-v02.api.letsencrypt.org/directory
        email: ops.gpenaud@gmail.com
        ovhEndpointName: ovh-eu
        ovhAuthenticationRef:
          applicationKeyRef:
            name: dns-ovh
            key: applicationKey
          applicationSecretRef:
            name: dns-ovh
            key: applicationSecret
          consumerKeyRef:
            name: dns-ovh
            key: consumerKey