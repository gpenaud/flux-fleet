apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cert-manager-webhook-ovh
  namespace: controller-cert-manager
spec:
  interval: 24h
  url: https://aureq.github.io/cert-manager-webhook-ovh

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-webhook-ovh
  namespace: controller-cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager-webhook-ovh
      sourceRef:
        kind: HelmRepository
        name: cert-manager-webhook-ovh
        namespace: controller-cert-manager
  values:
    groupName: acme.alter-it.org
    certManager:
      namespace: controller-cert-manager
      serviceAccountName: cert-manager

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-webhook-ovh-secrets
  namespace: controller-cert-manager
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["dns-ovh"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-webhook-ovh-secrets
  namespace: controller-cert-manager
subjects:
  - kind: ServiceAccount
    name: cert-manager-webhook-ovh
    namespace: controller-cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-manager-webhook-ovh-secrets