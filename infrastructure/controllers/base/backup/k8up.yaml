apiVersion: v1
kind: Namespace
metadata:
  name: controller-k8up
  labels:
    alter-it.org/controller: k8up
    alter-it.org/managed-by: fluxcd

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: k8up
  namespace: controller-k8up
spec:
  interval: 5m0s
  url: https://k8up-io.github.io/k8up

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8up
  namespace: controller-k8up
spec:
  interval: 5m
  timeout: 5m
  chart:
    spec:
      chart: k8up
      version: '4.8.*'
      sourceRef:
        kind: HelmRepository
        name: k8up
        namespace: controller-k8up
      interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    k8up:
      skipWithoutAnnotation: true
      envVars:
        - name: BACKUP_ENABLE_RWO_VOLUMES
          value: "true"
        - name: BACKUP_SKIP_SNAPSHOT_SYNC
          value: "true"
        - name: BACKUP_PROMURL
          value: ""