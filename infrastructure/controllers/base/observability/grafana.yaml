---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 24h
  url: https://grafana.github.io/helm-charts

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: controller-observability
spec:
  interval: 1h
  chart:
    spec:
      chart: grafana
      version: "8.x"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 24h
  values:
    # Persistence : conserve dashboards créés via UI, plugins, etc.
    persistence:
      enabled: true
      storageClassName: longhorn
      size: 5Gi
      accessModes:
        - ReadWriteOnce

    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        memory: 192Mi

    # Admin password sera dans un secret SOPS (à créer manuellement avant le 1er deploy)
    # voir section "Avant le commit" plus bas
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password

    # Configuration subpath pour l'ingress monitoring.leportail.org/grafana
    grafana.ini:
      server:
        domain: monitoring.leportail.org
        root_url: https://monitoring.leportail.org/grafana
        serve_from_sub_path: true
      analytics:
        check_for_updates: false
        reporting_enabled: false
      log:
        mode: console
        level: info
      # Désactive la création automatique de comptes lors du login OAuth (à activer plus tard si besoin)
      auth.anonymous:
        enabled: false

    # Datasource Prometheus pré-configuré
    # (le service "prometheus-operated" sera créé par l'Operator au Bloc 2)
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            uid: prometheus
            access: proxy
            url: http://prometheus-operated.controller-observability.svc.cluster.local:9090/prometheus
            isDefault: true
            jsonData:
              # Important : matche le scrapeInterval qu'on configurera sur Prometheus
              timeInterval: 60s

    # Sidecar qui auto-importe les dashboards depuis des ConfigMaps labellés
    # On s'en servira plus tard pour committer des dashboards en YAML
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL
        folderAnnotation: grafana_folder
        provider:
          foldersFromFilesStructure: true

    # Désactive la création automatique de l'IngressRoute par le chart
    # On le crée nous-mêmes au Bloc 2 (un seul IngressRoute pour les 3 services)
    ingress:
      enabled: false

    # Pas de ServiceMonitor non plus, on le crée au Bloc 2
    serviceMonitor:
      enabled: false