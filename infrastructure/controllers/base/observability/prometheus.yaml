---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator
  namespace: controller-observability
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus-operator
      version: "27.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 24h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    # On installe l'opérateur ET les CRDs
    # (Prometheus, Alertmanager, ServiceMonitor, PodMonitor, PrometheusRule, ThanosRuler, Probe)
    crds:
      enabled: true

    # L'opérateur gère par défaut TOUS les namespaces
    # On le laisse comme ça pour pouvoir faire des ServiceMonitor dans n'importe quel ns
    # (utile pour scraper k8up, nextcloud-exporter, etc.)

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi

    # L'opérateur lui-même expose des métriques sur sa propre santé
    # On les scrapera plus tard via un ServiceMonitor
    serviceMonitor:
      selfMonitor: true

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-node-exporter
  namespace: controller-observability
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus-node-exporter
      version: "4.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 24h
  values:
    # DaemonSet : un pod par nœud (1 chez toi)
    # Expose les métriques host : CPU, RAM, disque, réseau, fs, hwmon, etc.

    resources:
      requests:
        cpu: 20m
        memory: 16Mi
      limits:
        memory: 32Mi

    # Tolerations pour tourner sur les control-plane aussi (chez toi tout est sur le même nœud)
    tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists

    # ServiceMonitor : on le crée nous-mêmes au Bloc 2
    # (la création par le chart ne marche que si Prometheus operator est déjà là, race condition possible)
    prometheus:
      monitor:
        enabled: false

    # Active uniquement les collectors utiles (réduit le nb de séries)
    extraArgs:
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
  namespace: controller-observability
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-state-metrics
      version: "5.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 24h
  values:
    # Expose l'état des objets k8s en métriques :
    # kube_pod_status_phase, kube_deployment_status_replicas_available,
    # kube_persistentvolumeclaim_status_phase, etc.

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi

    # ServiceMonitor : on le crée au Bloc 2
    prometheus:
      monitorsSelector: {}
    selfMonitor:
      enabled: false

    # Limite les ressources surveillées pour réduire les séries
    # On ne couvre pas les CRDs custom (k8up, capsule, longhorn) — ces métriques
    # viennent directement des opérateurs concernés
    collectors:
      - certificatesigningrequests
      - configmaps
      - cronjobs
      - daemonsets
      - deployments
      - endpoints
      - horizontalpodautoscalers
      - ingresses
      - jobs
      - namespaces
      - networkpolicies
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - poddisruptionbudgets
      - pods
      - replicasets
      - resourcequotas
      - secrets
      - services
      - statefulsets
      - storageclasses