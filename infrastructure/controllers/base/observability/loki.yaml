---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: controller-observability
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: "6.x"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 24h
  install:
    timeout: 10m
  upgrade:
    timeout: 10m
  values:
    # === Mode SingleBinary ===
    # Pour un cluster single-node, tout-en-un dans un seul pod.
    # Pas la peine de partir en microservices (distributor, ingester, querier...
    # séparés) — c'est la complexité d'un cluster prod multi-zones.
    deploymentMode: SingleBinary

    # === Stockage S3 pour les règles d'alerte ===
    extraEnvFrom:
      - secretRef:
          name: loki-s3-credentials

    # Ce qui suit désactive tous les composants microservices au cas où une
    # version par défaut les activerait.
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomCompactor:
      replicas: 0
    bloomGateway:
      replicas: 0

    singleBinary:
      extraArgs:
        - "-config.expand-env=true"
      extraEnvFrom:
        - secretRef:
            name: loki-s3-credentials
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
      persistence:
        enabled: true
        storageClass: longhorn
        size: 10Gi
        accessModes:
          - ReadWriteOnce

    # === Configuration Loki ===
    loki:
      # Pas de multi-tenant : un seul "user" virtuel dans ton cluster
      auth_enabled: false

      commonConfig:
        replication_factor: 1
        path_prefix: /var/loki
        ring:
          kvstore:
            store: inmemory
        instance_addr: 127.0.0.1

      # === Stockage GLOBAL en S3 OVH ===
      # Tous les composants (chunks, index, ruler, admin) utilisent S3
      storage:
        type: s3
        bucketNames:
          chunks: alter-it-infra01-platform-loki-chunks
          ruler: alter-it-infra01-platform-loki-rules
          admin: alter-it-infra01-platform-loki-rules
        s3:
          endpoint: s3.sbg.io.cloud.ovh.net
          region: sbg
          s3ForcePathStyle: true
          access_key_id: "${AWS_ACCESS_KEY_ID}"
          secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
          # credentials via env vars AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY
          # injectées dans le pod via extraEnvFrom

      # Schéma v13 = le plus récent et le plus efficace en stockage
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h

      # === Limits et rétention ===
      limits_config:
        retention_period: 360h        # 15 jours = 15 * 24h
        # Limite du nombre de séries actives par tenant — protection contre cardinalité
        max_global_streams_per_user: 5000
        # Rate limit ingestion : 10 MB/s, soit largement plus qu'un cluster perso
        ingestion_rate_mb: 10
        ingestion_burst_size_mb: 20
        # Refuse les logs trop vieux (évite réinjections accidentelles)
        reject_old_samples: true
        reject_old_samples_max_age: 168h

      # === Compactor : nécessaire pour la rétention ===
      # Sans compactor activé, retention_period est ignoré et le PVC grossit indéfiniment
      compactor:
        working_directory: /var/loki/compactor
        retention_enabled: true
        retention_delete_delay: 2h
        retention_delete_worker_count: 150
        delete_request_store: filesystem

      # === Ruler : pour les alertes LogQL (étape suivante) ===
      ruler:
        enable_api: true
        enable_alertmanager_v2: true
        alertmanager_url: http://kube-prometheus-stack-alertmanager.controller-observability.svc.cluster.local:9093/alertmanager
        storage:
          type: s3
          s3:
            endpoint: s3.sbg.io.cloud.ovh.net
            bucketnames: alter-it-infra01-platform-loki-rules
            s3forcepathstyle: true
            access_key_id: "${AWS_ACCESS_KEY_ID}"
            secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
            # Les credentials viennent des env vars AWS_ACCESS_KEY_ID et AWS_SECRET_ACCESS_KEY
            # qu'on injecte via extraEnvFrom plus bas
        rule_path: /var/loki/rules-temp
        ring:
          kvstore:
            store: inmemory

    # === Rules Loki via ConfigMap ===
    # Le chart monte ce ConfigMap dans /var/loki/rules/fake/
    # ("fake" est le tenant ID par défaut quand auth_enabled=false)
    rbac:
      pspEnabled: false

    # === Désactivations ===
    # Pas de Grafana embedded, on a déjà le nôtre
    monitoring:
      lokiCanary:
        enabled: false
      selfMonitoring:
        enabled: false
        grafanaAgent:
          installOperator: false

    # Pas de chunkache externe, single-binary embarque le sien
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false

    # Test pod (pour CI Helm), pas utile chez nous
    test:
      enabled: false

    # Gateway nginx devant Loki — pas utile pour notre usage
    # (Grafana et Alloy parlent directement au service Loki)
    gateway:
      enabled: false