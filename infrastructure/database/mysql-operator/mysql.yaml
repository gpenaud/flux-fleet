
apiVersion: v1
kind: Namespace
metadata:
  name: controller-database

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: mysql-operator
  namespace: controller-database
spec:
  interval: 1h
  url: https://mysql.github.io/mysql-operator/

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mysql-operator
  namespace: controller-database
spec:
  interval: 1h
  chart:
    spec:
      chart: mysql-operator
      sourceRef:
        kind: HelmRepository
        name: mysql-operator
        namespace: controller-database
  values:
    envs:
      k8sClusterDomain: cluster.local