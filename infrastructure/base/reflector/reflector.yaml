
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: emberstack
  namespace: controller-reflector
spec:
  interval: 24h
  url: https://emberstack.github.io/helm-charts

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
  namespace: controller-reflector
spec:
  interval: 1h
  chart:
    spec:
      chart: reflector
      version: ">=7.0.0"
      sourceRef:
        kind: HelmRepository
        name: emberstack
        namespace: controller-reflector
      interval: 24h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    replicaCount: 1
    resources:
      requests:
        memory: "64Mi"
        cpu: "10m"
      limits:
        memory: "128Mi"
        cpu: "100m"