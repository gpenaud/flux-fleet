
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: argo
  namespace: controller-workflow
spec:
  interval: 24h
  url: https://argoproj.github.io/argo-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argo-workflows
  namespace: controller-workflow
spec:
  interval: 1h
  chart:
    spec:
      chart: argo-workflows
      version: "0.45.x"
      sourceRef:
        kind: HelmRepository
        name: argo
        namespace: controller-workflow
  values:
    controller:
      # cluster install : workflows autorisés dans tous les NS (défaut)
      workflowNamespaces: []
    workflow:
      serviceAccount:
        create: false          # on gère les SA par namespace tenant, cf. plus bas
    server:
      enabled: true
      authModes:
        - server               # ⚠️ pas d'auth : à exposer uniquement sur ton entrypoint tailnet privé
      # SSO Authelia possible plus tard via server.sso, hors périmètre ici