
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: workflow
  namespace: controller-workflow
  annotations:
    external-dns.alpha.kubernetes.io/hostname: workflow.${domain_prefix}${project}.${domain}
    external-dns.alpha.kubernetes.io/target: ${domain_prefix}${project}.${domain}
    external-dns.alpha.kubernetes.io/ttl: "300"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`workflow.${domain_prefix}${project}.${domain}`)
      kind: Rule
      services:
        - name: argo-workflows-server
          port: 2746
  tls:
    secretName: wildcard.${domain_prefix}${project}.${domain}.tls
