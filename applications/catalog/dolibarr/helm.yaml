---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: dolibarr
spec:
  interval: 5m
  url: https://cowboysysop.github.io/charts/

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dolibarr
spec:
  releaseName: dolibarr
  chart:
    spec:
      chart: dolibarr
      sourceRef:
        kind: HelmRepository
        name: dolibarr
  interval: 5m
  timeout: 3m
  install:
    remediation:
      retries: 3