
apiVersion: batch/v1
kind: Job
metadata:
  name: init-create-database
  labels:
    reflector/mysql-operator: "true"
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    spec:
      ttlSecondsAfterFinished: 0
      activeDeadlineSeconds: 90
      containers:
        - name: mysql-init
          image: mysql:8.4.3
          env:
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: mysql-operator
                  key: rootPassword
            - name: WORDPRESS_MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: wordpress
                  key: mariadb-user
            - name: WORDPRESS_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordpress
                  key: mariadb-password
            - name: WORDPRESS_MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: wordpress
                  key: mariadb-database
          command:
            - sh
            - -c
            - |
              mysql -h mysql-version-8-lts.controller-database.svc.cluster.local -u root <<EOF
              CREATE DATABASE IF NOT EXISTS \`$(WORDPRESS_MYSQL_DATABASE)\`;
              CREATE USER IF NOT EXISTS \`$(WORDPRESS_MYSQL_USER)\`@'%' IDENTIFIED BY '$(WORDPRESS_MYSQL_PASSWORD)';
              GRANT ALL ON \`$(WORDPRESS_MYSQL_DATABASE)\`.* TO \`$(WORDPRESS_MYSQL_USER)\`@'%';
              FLUSH PRIVILEGES;
              EOF
      restartPolicy: OnFailure