---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: la-bergeronnette-wordpress-site
resources:
  - ../../../base/wordpress/
  - secrets.enc.yaml
patches:
  # Rename the helm release
  - target:
      kind: HelmRelease
      name: wordpress
    patch: |
      - op: replace
        path: /metadata/name
        value: la-bergeronnette-wordpress-site
  # Overrides the helm release values.yaml
  - target:
      kind: HelmRelease
      name: la-bergeronnette-wordpress-site
    path: values.yaml
  # Overrides the namespace name
  - target:
      kind: Namespace
      name: la-bergeronnette-wordpress
    patch: |
      - op: replace
        path: /metadata/name
        value: la-bergeronnette-wordpress-site
  # Overrides the k8up bucket values with subPath
  - target:
      kind: Schedule
      name: wordpress
    patch: |-
      - op: replace
        path: /spec/backend/s3/bucket
        value: "backup-srv1515851-la-bergeronnette-wordpress-site"