---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: la-bergeronnette-wordpress-site
resources:
  - ../../../base/wordpress/
  - secrets.enc.yaml
  - backup-pod-config.yaml
patches:
  - target:
      kind: HelmRelease
      name: wordpress
    patch: |
      - op: replace
        path: /metadata/name
        value: la-bergeronnette-wordpress-site
  - target:
      kind: HelmRelease
      name: la-bergeronnette-wordpress-site
    path: values.yaml
  - target:
      kind: Namespace
      name: la-bergeronnette-wordpress
    patch: |
      - op: replace
        path: /metadata/name
        value: la-bergeronnette-wordpress-site