apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: la-bergeronnette-website
spec:
  values:
    wordpressUsername: ""
    wordpressPassword: ""
    wordpressEmail: dugrainamoudre@gmail.com
    mariadb:
      enabled: true
      auth:
        existingSecret: website-mariadb
    externalDatabase:
      host: wordpress-mariadb-0.la-bergeronnette-website.svc.cluster.local
      port: 3306
      user: la-bergeronnette
      database: la-bergeronnette
      existingSecret: website-wordpress
      existingSecretPasswordKey: WORDPRESS_DATABASE_PASSWORD
    wordpressPlugins: []
    service:
      type: ClusterIP
    ingress:
      enabled: true
      ingressClassName: traefik
      hostname: la-bergeronnette.gpenaud.localhost
      annotations:
        kubernetes.io/ingress.class: traefik
        cert-manager.io/cluster-issuer: mkcert-issuer
      extraTls:
        - hosts:
            - la-bergeronnette.gpenaud.localhost
          secretName: la-bergeronnette.gpenaud.localhost-tls
  valuesFrom:
    - kind: Secret
      name: website
      valuesKey: WORDPRESS_USERNAME
      targetPath: wordpressUsername
    - kind: Secret
      name: website
      valuesKey: WORDPRESS_PASSWORD
      targetPath: wordpressPassword
