---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: dolibarr
spec:
  interval: 5m
  url: https://cowboysysop.github.io/charts/

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dolibarr
spec:
  releaseName: dolibarr
  chart:
    spec:
      chart: dolibarr
      sourceRef:
        kind: HelmRepository
        name: dolibarr
  interval: 5m
  timeout: 3m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      # Sans ce bloc, retries vaut 0 : un upgrade raté reste en échec et laisse
      # l'application indisponible jusqu'à intervention. Avec rollback, Flux
      # revient à la dernière release fonctionnelle le temps qu'on corrige.
      retries: 3
      strategy: rollback