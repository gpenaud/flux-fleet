
apiVersion: v1
kind: ConfigMap
metadata:
  name: ldap-sync-scripts
data:
  apply-directory.php: |
    <?php
    // Aligne sur l'annuaire ce que sync_users_ldap2dolibarr.php laisse de cote :
    // la colonne admin de llx_user, et l'activation des comptes.
    //
    // Le script officiel cree et met a jour les comptes des membres des groupes,
    // mais n'a aucune notion de sortie de groupe : sans ce complement, retirer
    // quelqu'un d'un groupe lui laisse un compte actif, administrateur compris.

    $dbPort = (int) (getenv('DOLI_DB_HOST_PORT') ?: 3306);
    $db = new mysqli(getenv('DOLI_DB_HOST'), getenv('DOLI_DB_USER'), getenv('DOLI_DB_PASSWORD'), getenv('DOLI_DB_NAME'), $dbPort);
    if ($db->connect_errno) {
        fwrite(STDERR, 'Connexion a la base impossible : ' . $db->connect_error . PHP_EOL);
        exit(1);
    }
    $db->set_charset('utf8mb4');

    // La configuration LDAP est lue dans llx_const plutot que dupliquee dans les
    // variables du pod : une seule source, celle que Flux tient a jour.
    function constante(mysqli $db, string $nom): string {
        $st = $db->prepare('SELECT value FROM llx_const WHERE name = ? AND entity IN (0, 1) ORDER BY entity DESC LIMIT 1');
        $st->bind_param('s', $nom);
        $st->execute();
        $row = $st->get_result()->fetch_row();
        return $row ? (string) $row[0] : '';
    }

    $userDn = constante($db, 'LDAP_USER_DN');
    $filtre = constante($db, 'LDAP_FILTER_CONNECTION');
    $champ = constante($db, 'LDAP_FIELD_LOGIN') ?: 'uid';

    $ldap = ldap_connect('ldap://' . constante($db, 'LDAP_SERVER_HOST') . ':' . ((int) (constante($db, 'LDAP_SERVER_PORT') ?: 389)));
    ldap_set_option($ldap, LDAP_OPT_PROTOCOL_VERSION, 3);
    ldap_set_option($ldap, LDAP_OPT_REFERRALS, 0);
    if (!@ldap_bind($ldap, constante($db, 'LDAP_ADMIN_DN'), constante($db, 'LDAP_ADMIN_PASS'))) {
        fwrite(STDERR, 'Bind LDAP echoue : ' . ldap_error($ldap) . PHP_EOL);
        exit(1);
    }

    function logins($ldap, string $userDn, string $filtre, string $champ): array {
        $res = @ldap_search($ldap, $userDn, $filtre, array($champ));
        if ($res === false) {
            fwrite(STDERR, 'Recherche LDAP echouee (' . $filtre . ') : ' . ldap_error($ldap) . PHP_EOL);
            exit(1);
        }
        $out = array();
        foreach (ldap_get_entries($ldap, $res) as $cle => $entree) {
            if ($cle === 'count' || !isset($entree[$champ][0])) {
                continue;
            }
            $out[] = $entree[$champ][0];
        }
        return $out;
    }

    // Trois ensembles, du plus large au plus etroit :
    //
    //   annuaire  tous les comptes de l'annuaire. Sert a reconnaitre ce que la
    //             synchronisation gouverne : un compte Dolibarr dont le login ne
    //             correspond a aucun identifiant d'annuaire est un compte local,
    //             jamais touche ici.
    //   perimetre les membres des groupes de l'application. Doivent etre actifs.
    //   admins    ceux des groupes d'administration.
    $annuaire = logins($ldap, $userDn, '(' . $champ . '=*)', $champ);
    $perimetre = logins($ldap, $userDn, '(' . $filtre . ')', $champ);

    $dnGroupes = array_filter(array_map('trim', explode(';', (string) getenv('ADMIN_GROUP_DNS'))));
    if (!$dnGroupes) {
        fwrite(STDERR, 'ADMIN_GROUP_DNS est vide : aucun groupe ne confere l administration.' . PHP_EOL);
        exit(1);
    }
    $clauses = '';
    foreach ($dnGroupes as $dn) {
        $clauses .= '(memberOf=' . $dn . ')';
    }
    $admins = logins($ldap, $userDn, '(|' . $clauses . ')', $champ);

    // Les comptes ecartes de la synchronisation le sont partout : leur login
    // Dolibarr ne correspond pas a leur identifiant d'annuaire, les toucher
    // reviendrait a agir sur le mauvais compte.
    $exclus = array_filter(array_map('trim', explode(',', (string) getenv('EXCLUDE_USERS'))));
    $annuaire = array_values(array_diff($annuaire, $exclus));
    $perimetre = array_values(array_diff($perimetre, $exclus));
    $admins = array_values(array_diff(array_intersect($admins, $perimetre), $exclus));
    $simples = array_values(array_diff($perimetre, $admins));
    // Connus de l'annuaire mais plus membres d'aucun groupe de l'application.
    $sortis = array_values(array_diff($annuaire, $perimetre));

    echo 'Perimetre : ' . (implode(', ', $perimetre) ?: '(aucun)') . PHP_EOL;
    echo 'Administrateurs attendus : ' . (implode(', ', $admins) ?: '(aucun)') . PHP_EOL;
    echo 'Sortis des groupes : ' . (implode(', ', $sortis) ?: '(aucun)') . PHP_EOL;

    function appliquer(mysqli $db, string $colonne, array $logins, int $valeur): int {
        if (!$logins) {
            return 0;
        }
        $trous = implode(',', array_fill(0, count($logins), '?'));
        $st = $db->prepare('UPDATE llx_user SET ' . $colonne . ' = ? WHERE login IN (' . $trous . ') AND ' . $colonne . ' <> ?');
        $st->bind_param(str_repeat('s', count($logins) + 2), ...array_merge(array($valeur), $logins, array($valeur)));
        $st->execute();
        return $st->affected_rows;
    }

    // Combien d'administrateurs resteraient actifs une fois tout applique, en
    // comptant les comptes locaux, que rien de tout ceci ne touche.
    function adminsRestants(mysqli $db, array $perdants): int {
        $sql = 'SELECT COUNT(*) FROM llx_user WHERE admin = 1 AND statut = 1';
        if ($perdants) {
            $echappes = array_map(array($db, 'real_escape_string'), $perdants);
            $sql .= " AND login NOT IN ('" . implode("','", $echappes) . "')";
        }
        return (int) $db->query($sql)->fetch_row()[0];
    }

    // Un compte remis dans un groupe redevient actif : l'annuaire fait autorite
    // dans les deux sens, sinon une reintegration resterait sans effet visible.
    $reactives = appliquer($db, 'statut', $perimetre, 1);
    $promus = appliquer($db, 'admin', $admins, 1);

    // Garde-fou commun aux deux retraits : ni la revocation ni la desactivation
    // ne doivent laisser l'application sans aucun administrateur actif.
    $revoques = 0;
    $desactives = 0;
    // Les promus viennent d'etre ecrits et ne figurent pas parmi les perdants
    // (admins, simples et sortis sont disjoints) : le compte ci-dessous les
    // inclut deja, les ajouter les compterait deux fois.
    if (adminsRestants($db, array_merge($simples, $sortis)) > 0) {
        // Les sortis perdent aussi l'administration : un compte desactive qui
        // resterait administrateur la retrouverait intacte a sa reintegration,
        // sans que l'annuaire ne l'ait jamais accordee.
        $revoques = appliquer($db, 'admin', array_merge($simples, $sortis), 0);
        $desactives = appliquer($db, 'statut', $sortis, 0);
    } else {
        fwrite(STDERR, 'Retraits ignores : ils ne laisseraient aucun administrateur actif.' . PHP_EOL);
    }

    echo 'Promus : ' . $promus . ' | Revoques : ' . $revoques
       . ' | Reactives : ' . $reactives . ' | Desactives : ' . $desactives . PHP_EOL;
