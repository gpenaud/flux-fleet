
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sync-ldap-users
spec:
  # Dolibarr ne crée aucun compte à la volée : main.inc.php refuse la connexion
  # dès que le fetch échoue, et le seul hook du parcours, afterLoginFailed,
  # s'exécute après le refus. Ce passage régulier est donc ce qui rapproche le
  # plus du provisionnement automatique : un nouveau membre du groupe est
  # utilisable au bout de cinq minutes au pire.
  schedule: "*/5 * * * *"
  # Suspendu partout sauf là où cluster-vars l'autorise : la production ne doit
  # pas se mettre à créer des comptes tant que staging n'est pas validé.
  suspend: ${dolibarr_sync_suspend:=true}
  # Une synchronisation à la fois : deux passages concurrents écriraient les
  # mêmes utilisateurs.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: sync
              # Même version que le Deployment : le script fait partie du code
              # applicatif et suit donc les montées de version de l'application.
              image: docker.io/dolibarr/dolibarr:23.0.0
              # args seulement, jamais command : l'ENTRYPOINT de l'image
              # régénère conf.php à partir des DOLI_* puis termine par
              # « exec "$@" », donc notre commande remplace apache2-foreground.
              args:
                - php
                - /var/www/scripts/user/sync_users_ldap2dolibarr.php
                - commitiferror
                - "-y"
                # Julie a déjà un compte Dolibarr, sous le login « Aux
                # retrouvailles » : le script la cherche par uid, ne la trouve
                # pas et créerait un doublon portant le même courriel, ce qui
                # rendrait ambiguë la recherche du module OIDC. À retirer une
                # fois son login aligné sur son uid.
                - "--excludeuser=jsergi"
              env:
                # Impératif ici : ce pod ne monte pas /var/www/documents, donc
                # l'install.lock qui protège l'application n'y est pas visible
                # et l'entrypoint relancerait une installation.
                - name: DOLI_INSTALL_AUTO
                  value: "0"
                - name: DOLI_DB_HOST
                  value: "mariadb.controller-database.svc.cluster.local"
                - name: DOLI_DB_HOST_PORT
                  value: "3306"
                - name: DOLI_URL_ROOT
                  value: "https://dolibarr.${domain}"
                - name: DOLI_DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: ${application}
                      key: mariadb-database
                - name: DOLI_DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: ${application}
                      key: mariadb-user
                - name: DOLI_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${application}
                      key: mariadb-password
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
