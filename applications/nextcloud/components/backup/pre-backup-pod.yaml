
apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: pre-backup
  annotations:
    k8up.io/backup: "true"
spec:
  backupCommand: sh -c 'mysqldump --no-tablespaces --skip-set-charset --set-gtid-purged=OFF --single-transaction -h mariadb.controller-database.svc.cluster.local -u $NEXTCLOUD_MYSQL_USER -p"$NEXTCLOUD_MYSQL_PASSWORD" $NEXTCLOUD_MYSQL_DATABASE'
  fileExtension: .sql
  pod:
    spec:
      containers:
        - name: nextcloud-db-dump
          image: mysql:8.4.3
          command: ["sleep", "infinity"]
          env:
            - name: MYSQL_ALLOW_EMPTY_PASSWORD
              value: "true"
            - name: NEXTCLOUD_MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud
                  key: mariadb-username
            - name: NEXTCLOUD_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud
                  key: mariadb-password
            - name: NEXTCLOUD_MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: nextcloud
                  key: mariadb-database