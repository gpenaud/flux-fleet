
apiVersion: batch/v1
kind: Job
metadata:
  name: init-db
  labels:
    reflector/database: "true"
  annotations:
    kustomize.toolkit.fluxcd.io/force: "enabled"
spec:
  template:
    spec:
      ttlSecondsAfterFinished: 30
      activeDeadlineSeconds: 90
      containers:
        - name: mysql-init
          image: mysql:8.4.3
          env:
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: mysql-operator
                  key: rootPassword
            - name: NEXTCLOUD_MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud
                  key: mariadb-username
            - name: NEXTCLOUD_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud
                  key: mariadb-password
            - name: NEXTCLOUD_MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: nextcloud
                  key: mariadb-database
          command:
            - sh
            - -c
            - |
              mysql -h mysql-version-8-lts.controller-database.svc.cluster.local -u root <<EOF
              CREATE DATABASE IF NOT EXISTS \`$(NEXTCLOUD_MYSQL_DATABASE)\`;
              CREATE USER IF NOT EXISTS \`$(NEXTCLOUD_MYSQL_USER)\`@'%' IDENTIFIED BY '$(NEXTCLOUD_MYSQL_PASSWORD)';
              GRANT ALL ON \`$(NEXTCLOUD_MYSQL_DATABASE)\`.* TO \`$(NEXTCLOUD_MYSQL_USER)\`@'%';
              FLUSH PRIVILEGES;
              EOF
      restartPolicy: OnFailure