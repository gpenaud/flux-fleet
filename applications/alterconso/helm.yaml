apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: gpenaud-charts
spec:
  type: oci
  interval: 5m
  url: oci://ghcr.io/gpenaud/charts

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alterconso
spec:
  releaseName: alterconso
  chart:
    spec:
      chart: alterconso
      version: "0.1.3"
      sourceRef:
        kind: HelmRepository
        name: gpenaud-charts
  interval: 5m
  timeout: 1m
  install:
    remediation:
      retries: 3