
apiVersion: v1
kind: ServiceAccount
metadata:
  name: access-sync-runner
  namespace: ${tenant}-${application}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: access-sync-runner
  namespace: ${tenant}-${application}
rules:
  # Le workflow ne pilote aucune ressource : il parle à l'annuaire et à l'API de
  # l'application. Seul reste ce qu'Argo exige de tout pod pour rapporter son
  # résultat.
  - apiGroups:
      - argoproj.io
    resources:
      - workflowtaskresults
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: access-sync-runner
  namespace: ${tenant}-${application}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: access-sync-runner
subjects:
  - kind: ServiceAccount
    name: access-sync-runner
    namespace: ${tenant}-${application}
