apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: le-portail-epilibres
spec:
  values:
    wordpressUsername: epilibres
    wordpressExistingSecret: wordpress
    wordpressEmail: epilibres@${tenant_domain}
    mariadb:
      enabled: false
    externalDatabase:
      host: mysql-version-8-lts.controller-mysql-operator.svc.cluster.local
      port: 3306
      user: epilibres
      database: epilibres
      existingSecret: wordpress
    wordpressPlugins: []
    service:
      type: ClusterIP
    persistence:
      enabled: true
      storageClass: longhorn-ext4
      size: 7Gi
    ingress:
      enabled: true
      ingressClassName: traefik
      hostname: epilibres.${tenant_domain}
      extraHosts:
        - name: epi-libres.${tenant_domain}
          path: /
        - name: epis-libres.${tenant_domain}
          path: /
      annotations:
        kubernetes.io/ingress.class: traefik
        cert-manager.io/cluster-issuer: letsencrypt-production
      extraTls:
        - hosts:
            - epilibres.${tenant_domain}
            - epi-libres.${tenant_domain}
            - epis-libres.${tenant_domain}
          secretName: epi-libres.${tenant_domain}-tls
    resourcesPreset: "none"
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        cpu: 1500m
        memory: 3Gi
    initContainers: []
    volumePermissions:
      enabled: false
      resourcesPreset: "none"
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi

