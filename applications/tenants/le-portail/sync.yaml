apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: applications-le-portail
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./applications/tenants/le-portail/${ENVIRONMENT}
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age-private-key
  postBuild:
    substitute:
      tenant: le-portail