apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: applications-ferme-du-jointout
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./applications/tenants/ferme-du-jointout
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age-private-key
  postBuild:
    # substituteFrom:
    #   - kind: ConfigMap
    #     name: cluster-vars
    substitute:
      owner: alter-it
      cluster: infra01
      tenant: ferme-du-jointout
      tenant_domain: fermedujointout.fr