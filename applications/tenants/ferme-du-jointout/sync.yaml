apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: applications-ferme-du-jointout
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./applications/tenants/ferme-du-jointout/${ENVIRONMENT}
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age-private-key
  postBuild:
    substitute:
      TENANT: ferme-du-jointout