---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ${TENANT}-nextcloud
resources:
  - ../../../../base/nextcloud/
  - ingress-aliases.yaml
  - secrets.enc.yaml
patches:
  - path: values.yaml
    target:
      kind: HelmRelease
      name: nextcloud
  # Add the k8up backup annotation to the PVC
  - target:
      kind: PersistentVolumeClaim
      namespace: ferme-du-jointout-nextcloud
    patch: |-
      - op: add
        path: /metadata/annotations/k8up.io~1backup
        value: "true"
  # Overrides the k8up bucket values with subPath
  - target:
      kind: Schedule
      name: nextcloud
    patch: |-
      - op: replace
        path: /spec/backend/s3/bucket
        value: "alter-it-infra01-backup-ferme-du-jointout-nextcloud"