apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${tenant}-dolibarr
spec:
  values:
    replicaCount: 1
    image:
      tag: 23.0.0
    cron:
      enabled: false
    pdb:
      create: false
      minAvailable: 1
      maxUnavailable:
    ingress:
      enabled: false
    persistence:
      enabled: true
      size: 5Gi
    dolibarr:
      admin:
        username: ferme-du-jointout
        password: "REPLACED"
      externalUrl: https://dolibarr.${domain}
      cron:
        enabled: false
    existingSecret: dolibarr
    existingSecretKeyAdminPassword: dolibarr-admin-password
    existingSecretKeyCronSecurityKey: dolibarr-cron-security-key
    mariadb:
      enabled: false
    externalMariadb:
      enabled: true
      host: mysql-version-8-lts.controller-database.svc.cluster.local
      port: 3306
      database: fdj-dolibarr
      username: ferme-du-jointout
      existingSecret: dolibarr
      existingSecretKeyPassword: mariadb-password