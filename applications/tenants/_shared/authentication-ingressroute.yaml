
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authelia-${tenant}
  namespace: controller-authentication
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`auth.${tenant_domain}`)
      kind: Rule
      services:
        - name: authelia
          port: 80
  tls:
    secretName: auth-${tenant}-tls