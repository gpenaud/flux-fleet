apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: applications-la-bergeronnette
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./applications/tenants/la-bergeronnette/${ENVIRONMENT}
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age-private-key
  postBuild:
    substitute:
      tenant: la-bergeronnette
      tenant_domain: labergeronnette.org