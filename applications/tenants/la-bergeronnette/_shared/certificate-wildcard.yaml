
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-${tenant}
  namespace: controller-certificates
spec:
  secretName: wildcard-${tenant}-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - "*.${tenant_domain}"
    - "${tenant_domain}"