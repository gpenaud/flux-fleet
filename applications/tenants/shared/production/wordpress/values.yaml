apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: shared-wordpress
spec:
  values:
    wordpressUsername: admin
    wordpressExistingSecret: shared-wordpress
    wordpressEmail: ops.gpenaud@gmail.com
    mariadb:
      enabled: false
    externalDatabase:
      host: mysql-version-8-lts.controller-mysql-operator.svc.cluster.local
      port: 3306
      user: shared-wp-admin
      database: shared-wp
      existingSecret: wordpress
    wordpressPlugins: []
    service:
      type: ClusterIP
    persistence:
      enabled: true
      storageClass: longhorn
      size: 10Gi
    ingress:
      enabled: true
      ingressClassName: traefik
      hostname: wordpress.infra01.alter-it.eu
      annotations:
        kubernetes.io/ingress.class: traefik
        cert-manager.io/cluster-issuer: letsencrypt-production
      extraTls:
        - hosts:
            - wordpress.infra01.alter-it.eu
          secretName: wordpress-infra01-alter-it-eu-tls
    resourcesPreset: "none"
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        cpu: 1500m
        memory: 3Gi
    initContainers: []
    volumePermissions:
      enabled: false
      resourcesPreset: "none"
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi

