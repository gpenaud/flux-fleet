
apiVersion: batch/v1
kind: Job
metadata:
  name: init-db
  labels:
    reflector/mysql-operator: "true"
  annotations:
    kustomize.toolkit.fluxcd.io/force: "enabled"
spec:
  template:
    spec:
      ttlSecondsAfterFinished: 30
      activeDeadlineSeconds: 90
      containers:
        - name: mysql-init
          image: mysql:8.4.3
          env:
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: dolibarr
                  key: mariadb-root-password
            - name: DOLIBARR_MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: dolibarr
                  key: mariadb-user
            - name: DOLIBARR_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dolibarr
                  key: mariadb-password
            - name: DOLIBARR_MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: dolibarr
                  key: mariadb-database
          command:
            - sh
            - -c
            - |
              mysql -h mysql-version-8-lts.controller-mysql-operator.svc.cluster.local -u root <<EOF
              CREATE DATABASE IF NOT EXISTS \`$(DOLIBARR_MYSQL_DATABASE)\`;
              CREATE USER IF NOT EXISTS \`$(DOLIBARR_MYSQL_USER)\`@'%' IDENTIFIED BY '$(DOLIBARR_MYSQL_PASSWORD)';
              GRANT ALL ON \`$(DOLIBARR_MYSQL_DATABASE)\`.* TO \`$(DOLIBARR_MYSQL_USER)\`@'%';
              FLUSH PRIVILEGES;
              EOF
      restartPolicy: OnFailure

      