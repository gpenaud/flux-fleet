apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: podconfig
spec:
  template:
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: backup
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: wordpress
spec:
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 1
  podConfigRef:
    name: podconfig
  backend:
    repoPasswordSecretRef:
      name: k8up-credentials
      key: RESTIC_PASSWORD
    s3:
      endpoint: https://s3.sbg.io.cloud.ovh.net 
      bucket: "${owner}-${cluster}-backup-${tenant}-wordpress"
      accessKeyIDSecretRef:
        name: k8up-credentials
        key: AWS_ACCESS_KEY_ID
      secretAccessKeySecretRef:
        name: k8up-credentials
        key: AWS_SECRET_ACCESS_KEY
  backup:
    schedule: '0 21 1,15 * *'  # 1er et 15 de chaque mois à 21h
  check:
    schedule: '30 21 1,15 * *' # vérification 30min après
  prune:
    schedule: '0 22 1,15 * *'  # nettoyage 1h après
    retention:
      keepWeekly: 8            # ~4 mois de rétention
      keepMonthly: 6

---
apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: pre-backup
  labels:
    reflector/mysql-operator: "true"
  annotations:
    k8up.io/backup: "true"
spec:
  backupCommand: sh -c 'mysqldump --no-tablespaces --skip-set-charset --set-gtid-purged=OFF --single-transaction -h mysql-version-8-lts.controller-mysql-operator.svc.cluster.local -u $WORDPRESS_MYSQL_USER -p"$WORDPRESS_MYSQL_PASSWORD" $WORDPRESS_MYSQL_DATABASE'
  fileExtension: .sql
  pod:
    spec:
      containers:
        - name: wordpress-db-dump
          image: mysql:8.4.3
          command: ["sleep", "infinity"]
          env:
            - name: MYSQL_ALLOW_EMPTY_PASSWORD
              value: "true"
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: mysql-operator
                  key: rootPassword
            - name: WORDPRESS_MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: wordpress
                  key: mariadb-user
            - name: WORDPRESS_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordpress
                  key: mariadb-password
            - name: WORDPRESS_MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: wordpress
                  key: mariadb-database

