---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bitnami
spec:
  type: oci
  url: oci://registry-1.docker.io/bitnamicharts
  interval: 24h

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wordpress
spec:
  releaseName: wordpress
  chart:
    spec:
      chart: wordpress
      version: "28.1.7"
      sourceRef:
        kind: HelmRepository
        name: bitnami
  timeout: 30m
  interval: 5m
  install:
    timeout: 30m
    remediation:
      retries: -1
  postRenderers:
    - kustomize:
        patches:
          # Overrides the k8up backup annotation to the PVC
          - target:
              kind: PersistentVolumeClaim
              namespace: le-portail-wordpress-epilibres
            patch: |-
              - op: add
                path: /metadata/annotations/k8up.io~1backup
                value: "true"