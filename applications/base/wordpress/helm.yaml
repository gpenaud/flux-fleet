---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bitnami
spec:
  type: oci
  url: oci://registry-1.docker.io/bitnamicharts
  interval: 24h

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wordpress
spec:
  releaseName: wordpress
  chart:
    spec:
      chart: wordpress
      version: "28.1.7"
      sourceRef:
        kind: HelmRepository
        name: bitnami
  timeout: 30m
  install:
    timeout: 30m
    remediation:
      retries: -1
  values:
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 1Gi
        cpu: 500m
    livenessProbe:
      initialDelaySeconds: 300
    readinessProbe:
      initialDelaySeconds: 300
      failureThreshold: 20