apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: grist
spec:
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 1
  backend:
    repoPasswordSecretRef:
      name: s3-ovh
      key: RESTIC_PASSWORD
    s3:
      endpoint: https://s3.sbg.io.cloud.ovh.net 
      bucket: ""
      accessKeyIDSecretRef:
        name: s3-ovh
        key: AWS_ACCESS_KEY_ID
      secretAccessKeySecretRef:
        name: s3-ovh
        key: AWS_SECRET_ACCESS_KEY
  backup:
    schedule: '0 2 * * *' # tous les jours à 02h00
  check:
    schedule: '0 3 * * 1' # vérification chaque lundi
  prune:
    schedule: '0 4 * * 1' # nettoyage chaque lundi
    retention:
      keepDaily: 7    # 1 snapshot par jour pendant 7 jours
      keepWeekly: 4   # 1 snapshot par semaine pendant 4 semaines
      keepMonthly: 6  # 1 snapshot par mois pendant 6 mois

---
apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: pre-backup
  annotations:
    k8up.io/backup: "true"
spec:
  backupCommand: sh -c 'sqlite3 /persist/home.sqlite3 ".backup /tmp/grist-backup.sqlite3" && cat /tmp/grist-backup.sqlite3'
  fileExtension: .sqlite3
  pod:
    spec:
      containers:
        - name: grist-dump
          image: keinos/sqlite3
          command: ["sleep", "infinity"]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: grist-data
              mountPath: /persist
      volumes:
        - name: grist-data
          persistentVolumeClaim:
            claimName: grist-data