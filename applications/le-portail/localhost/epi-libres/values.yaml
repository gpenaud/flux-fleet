apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: le-portail-epi-libres
spec:
  values:
    wordpressUsername: ""
    wordpressPassword: ""
    wordpressEmail: epi-libres@gmail.com
    mariadb:
      enabled: true
      auth:
        existingSecret: epi-libres-mariadb
    externalDatabase:
      host: wordpress-mariadb-0.le-portail-epi-libres.svc.cluster.local
      port: 3306
      user: le-portail
      database: le-portail
      existingSecret: epi-libres-wordpress
      existingSecretPasswordKey: WORDPRESS_DATABASE_PASSWORD
    wordpressPlugins: []
    service:
      type: ClusterIP
    ingress:
      enabled: true
      ingressClassName: traefik
      hostname: epi-libres.gpenaud.localhost
      annotations:
        kubernetes.io/ingress.class: traefik
        cert-manager.io/cluster-issuer: mkcert-issuer
      extraTls:
        - hosts:
            - epi-libres.gpenaud.localhost
          secretName: epi-libres.gpenaud.localhost-tls
  valuesFrom:
    - kind: Secret
      name: epi-libres
      valuesKey: WORDPRESS_USERNAME
      targetPath: wordpressUsername
    - kind: Secret
      name: epi-libres
      valuesKey: WORDPRESS_PASSWORD
      targetPath: wordpressPassword
