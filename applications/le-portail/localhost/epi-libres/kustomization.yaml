---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: le-portail-epi-libres
resources:
  - ../../../base/wordpress/
  - secrets.enc.yaml
  - backup-pod-config.yaml
patches:
  - target:
      kind: HelmRelease
      name: wordpress
    patch: |
      - op: replace
        path: /metadata/name
        value: le-portail-epi-libres
  - target:
      kind: HelmRelease
      name: le-portail-epi-libres
    path: values.yaml
  - target:
      kind: Namespace
      name: le-portail-wordpress
    patch: |
      - op: replace
        path: /metadata/name
        value: le-portail-epi-libres
  - target:
      kind: Schedule
      name: le-portail
    patch: |
      - op: replace
        path: /metadata/name
        value:
          name: epi-libres
      - op: add
        path: /spec
        value:
          podConfigRef:
            name: epi-libres