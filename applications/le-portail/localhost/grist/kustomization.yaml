---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: le-portail-grist
resources:
  - ../../base/grist/
  - secrets.enc.yaml
  - backup-pod-config.yaml
patches:
  - target:
      kind: Namespace
      name: le-portail-grist
  - path: values.yaml
    target:
      kind: HelmRelease
      name: le-portail-grist
  - target: 
      kind: Schedule
      name: grist
    patch: |
      - op: add
        path: /spec
        value:
          podConfigRef:
            name: grist
