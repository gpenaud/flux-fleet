---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: le-portail-dolibarr
resources:
  - ../../../base/dolibarr/
  - secrets.enc.yaml
patches:
  - target:
      kind: Namespace
      name: dolibarr
    patch: |
      - op: replace
        path: /metadata/name
        value: le-portail-dolibarr
  - target:
      kind: HelmRelease
      name: dolibarr
    patch: |
      - op: replace
        path: /metadata/name
        value: le-portail-dolibarr
  - target:
      kind: HelmRelease
      name: le-portail-dolibarr
    path: values.yaml
  # Add the k8up backup annotation to the PVC
  - target:
      kind: PersistentVolumeClaim
      namespace: le-portail-dolibarr
    patch: |-
      - op: add
        path: /metadata/annotations/k8up.io~1backup
        value: "true"
  # Overrides the k8up bucket values with subPath
  - target:
      kind: Schedule
      name: dolibarr
    patch: |-
      - op: replace
        path: /spec/backend/s3/bucket
        value: "backup-srv1515851-le-portail-dolibarr"
