apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: le-portail-epilibres
spec:
  values:
    wordpressUsername: epilibres
    wordpressExistingSecret: wordpress
    wordpressEmail: epilibres.leportail.org
    
    mariadb:
      enabled: false
    externalDatabase:
      host: mysql-version-8-lts.controller-mysql-operator.svc.cluster.local
      port: 3306
      user: epilibres
      database: epilibres
      existingSecret: wordpress
    wordpressPlugins: []
    service:
      type: ClusterIP
    persistence:
      enabled: true
      storageClass: longhorn-ext4
      size: 3Gi
    ingress:
      enabled: true
      ingressClassName: traefik
      hostname: epilibres.leportail.org
      annotations:
        kubernetes.io/ingress.class: traefik
        cert-manager.io/cluster-issuer: letsencrypt-staging
      extraTls:
        - hosts:
            - epilibres.leportail.org
          secretName: epilibres.leportail.org-tls