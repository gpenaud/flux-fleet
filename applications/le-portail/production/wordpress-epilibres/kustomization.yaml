---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: le-portail-wordpress-epilibres
resources:
  - ../../../base/wordpress/
  - secrets.enc.yaml
patches: 
  # Rename the helm release
  - target:
      kind: HelmRelease
      name: wordpress
    patch: |
      - op: replace
        path: /metadata/name
        value: le-portail-wordpress-epilibres
  # Overrides the helm release values.yaml
  - target:
      kind: HelmRelease
      name: le-portail-wordpress-epilibres
    path: values.yaml
  # Overrides the namespace name
  - target:
      kind: Namespace
      name: le-portail-wordpress
    patch: |
      - op: replace
        path: /metadata/name
        value: le-portail-wordpress-epilibres
  # Overrides the k8up bucket values with subPath
  - target:
      kind: Schedule
      name: wordpress
    patch: |-
      - op: replace
        path: /spec/backend/s3/bucket
        value: "srv1515851-backups/le-portail/wordpress-epilibres"