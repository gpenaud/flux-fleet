---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ferme-du-jointout-wordpress-site
resources:
  - ../../../base/wordpress/
  - secrets.enc.yaml
  - backup-pod-config.yaml
patches:
  - target:
      kind: HelmRelease
      name: wordpress
    patch: |
      - op: replace
        path: /metadata/name
        value: ferme-du-jointout-wordpress-site
  - target:
      kind: HelmRelease
      name: ferme-du-jointout-wordpress-site
    path: values.yaml
  - target:
      kind: Namespace
      name: ferme-du-jointout-wordpress-site
    patch: |
      - op: replace
        path: /metadata/name
        value: ferme-du-jointout-wordpress-site
  # Add the k8up backup annotation to the PVC
  - target:
      kind: PersistentVolumeClaim
      namespace: ferme-du-jointout-wordpress-site
    patch: |-
      - op: add
        path: /metadata/annotations/k8up.io~1backup
        value: "true"
  # Overrides the k8up bucket values with subPath
  - target:
      kind: Schedule
      name: wordpress
    patch: |-
      - op: replace
        path: /spec/backend/s3/bucket
        value: "alter-it-infra01-backup-ferme-du-jointout-wordpress-site"