apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ferme-du-jointout-wordpress-gaec
spec:
  values:
    wordpressUsername: ""
    wordpressPassword: ""
    wordpressEmail: dugrainamoudre@gmail.com
    mariadb:
      enabled: true
      auth:
        existingSecret: wordpress-gaec-mariadb
    externalDatabase:
      host: wordpress-mariadb-0.ferme-du-jointout-wordpress-gaec.svc.cluster.local
      port: 3306
      user: ferme-du-jointout
      database: ferme-du-jointout
      existingSecret: wordpress-gaec-wordpress
      existingSecretPasswordKey: WORDPRESS_DATABASE_PASSWORD
    wordpressPlugins: []
    service:
      type: ClusterIP
    ingress:
      enabled: true
      ingressClassName: traefik
      hostname: www.fermedujointout.fr
      annotations:
        kubernetes.io/ingress.class: traefik
        cert-manager.io/cluster-issuer: letsencrypt-staging
      extraTls:
        - hosts:
            - www.fermedujointout.fr
          secretName: www.fermedujointout.fr-tls
  valuesFrom:
    - kind: Secret
      name: wordpress-gaec
      valuesKey: WORDPRESS_USERNAME
      targetPath: wordpressUsername
    - kind: Secret
      name: wordpress-gaec
      valuesKey: WORDPRESS_PASSWORD
      targetPath: wordpressPassword
