apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextcloud-aliases
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: nextcloud.fermedujointout.fr
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: nextcloud
              port:
                number: 8080
    - host: cloud.fermedujointout.fr
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: nextcloud
              port:
                number: 8080
  tls:
    - secretName: nextcloud.fermedujointout.fr
      hosts:
        - cloud.fermedujointout.fr
        - nextcloud.fermedujointout.fr
