apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
spec:
  values:
    internalDatabase:
      enabled: false
    mariadb:
      enabled: false
    externalDatabase:
      enabled: true
      type: mysql
      host: mysql-version-8-lts.controller-mysql-operator.svc.cluster.local:6446
      database: fdj-nextcloud
      existingSecret:
        enabled: true
        secretName: nextcloud
        usernameKey: mariadb-username
        passwordKey: mariadb-password
    persistence:
      enabled: true
      storageClass: longhorn
      accessMode: ReadWriteOnce
      size: 30Gi
      annotations:
        k8up.io/backup: true
    nextcloud:
      host: nextcloud.fermedujointout.fr
      datadir: /var/www/html/data
      # Important : trusted domains
      configs:
        custom.config.php: |-
          <?php
          $CONFIG = array(
            'trusted_domains' => [
              'nextcloud.fermedujointout.fr',
              'cloud.fermedujointout.fr'
            ],
            'overwrite.cli.url' => 'https://nextcloud.fermedujointout.fr',
            'overwriteprotocol' => 'https',
          );
      existingSecret:
        enabled: true
        secretName: nextcloud
        usernameKey: nextcloud-username
        passwordKey: nextcloud-password
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-production"
      hosts:
        - host: nextcloud.fermedujointout.fr
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: nextcloud.fermedujointout.fr-tls
          hosts:
            - nextcloud.fermedujointout.fr
