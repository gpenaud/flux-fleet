apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ferme-du-jointout-gaec
spec:
  values:
    wordpressUsername: ""
    wordpressPassword: ""
    wordpressEmail: dugrainamoudre@gmail.com
    mariadb:
      enabled: true
      auth:
        existingSecret: gaec-mariadb
    externalDatabase:
      host: wordpress-mariadb-0.ferme-du-jointout-gaec.svc.cluster.local
      port: 3306
      user: ferme-du-jointout
      database: ferme-du-jointout
      existingSecret: gaec-wordpress
      existingSecretPasswordKey: WORDPRESS_DATABASE_PASSWORD
    wordpressPlugins: []
    service:
      type: ClusterIP
    ingress:
      enabled: true
      ingressClassName: traefik
      hostname: ferme-du-jointout.gpenaud.localhost
      annotations:
        kubernetes.io/ingress.class: traefik
        cert-manager.io/cluster-issuer: mkcert-issuer
      extraTls:
        - hosts:
            - ferme-du-jointout.gpenaud.localhost
          secretName: ferme-du-jointout.gpenaud.localhost-tls
  valuesFrom:
    - kind: Secret
      name: gaec
      valuesKey: WORDPRESS_USERNAME
      targetPath: wordpressUsername
    - kind: Secret
      name: gaec
      valuesKey: WORDPRESS_PASSWORD
      targetPath: wordpressPassword
