---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ferme-du-jointout-gaec
resources:
  - ../../../base/wordpress/
  - secrets.enc.yaml
  - backup-pod-config.yaml
patches:
  - target:
      kind: HelmRelease
      name: wordpress
    patch: |
      - op: replace
        path: /metadata/name
        value: ferme-du-jointout-gaec
  - target:
      kind: HelmRelease
      name: ferme-du-jointout-gaec
    path: values.yaml
  - target:
      kind: Namespace
      name: ferme-du-jointout-wordpress
    patch: |
      - op: replace
        path: /metadata/name
        value: ferme-du-jointout-gaec
  - target:
      kind: Schedule
      name: ferme-du-jointout
    patch: |
      - op: replace
        path: /metadata/name
        value:
          name: gaec
      - op: add
        path: /spec
        value:
          podConfigRef:
            name: gaec