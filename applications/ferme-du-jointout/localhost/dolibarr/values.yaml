apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ferme-du-jointout-dolibarr
spec:
  values:
    replicaCount: 1
    image:
      tag: 22.0.4
    cron:
      enabled: false
    pdb:
      create: false
      minAvailable: 1
      maxUnavailable:
    ingress:
      enabled: true
      ingressClassName: traefik
      pathType: Prefix
      annotations:
        kubernetes.io/ingress.class: traefik
        cert-manager.io/cluster-issuer: mkcert-issuer
      hosts:
        - host: dolibarr.ferme-du-jointout.localhost
          paths:
            - /
      tls:
        - secretName: dolibarr.ferme-du-jointout.localhost-tls
          hosts:
            - dolibarr.ferme-du-jointout.localhost
    persistence:
      enabled: true
      size: 5Gi
    dolibarr:
      admin:
        username: ferme-du-jointout
        password: "REPLACED"
      externalUrl: https://dolibarr.ferme-du-jointout.localhost
      cron:
        enabled: false

    existingSecret: dolibarr-credentials
    existingSecretKeyAdminPassword: dolibarr-admin-password
    existingSecretKeyCronSecurityKey: dolibarr-cron-security-key
    
    mariadb:
      auth:
        database: ferme-du-jointout
        username: ferme-du-jointout
        existingSecret: dolibarr-mariadb