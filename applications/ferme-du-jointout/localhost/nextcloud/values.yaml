apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
spec:
  values:
    mariadb:
      enabled: true
      auth:
        database: nextcloud
        username: nextcloud
        password: ""
        rootPassword: ""
      primary:
        persistence:
          enabled: true
          storageClass: "local-path"
          size: 20Gi
    persistence:
      enabled: true
      storageClass: "local-path"
      accessMode: ReadWriteOnce
      size: 10Gi
    nextcloud:
      host: nextcloud.gpenaud.localhost
      datadir: /var/www/html/data
      # Important : trusted domains
      configs:
        custom.config.php: |-
          <?php
          $CONFIG = array(
            'trusted_domains' => ['nextcloud.gpenaud.localhost'],
            'overwrite.cli.url' => 'https://nextcloud.gpenaud.localhost',
            'overwriteprotocol' => 'https',
          );
      existingSecret:
        enabled: true
        secretName: nextcloud
        usernameKey: nextcloud-username
        passwordKey: nextcloud-password
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: "mkcert-issuer"
      hosts:
        - host: nextcloud.gpenaud.localhost
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: nextcloud.gpenaud.localhost
          hosts:
            - nextcloud.gpenaud.localhost
  valuesFrom:
    - kind: Secret
      name: nextcloud
      valuesKey: mariadb-password
      targetPath: mariadb.auth.password
    - kind: Secret
      name: nextcloud
      valuesKey: mariadb-root-password
      targetPath: mariadb.auth.rootPassword