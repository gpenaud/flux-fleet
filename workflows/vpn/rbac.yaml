apiVersion: v1
kind: ServiceAccount
metadata:
  name: ts-router-bootstrap
  namespace: controller-vpn
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ts-bootstrap-headscale
  namespace: headscale
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ts-bootstrap-router
  namespace: controller-vpn
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch]
  - apiGroups: ["apps"]
    resources: [deployments]
    verbs: [get, list, patch]
  - apiGroups: ["apps"]
    resources: [replicasets]
    verbs: [get, list]      # rollout status
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]      # rollout status
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ts-bootstrap-headscale
  namespace: controller-vpn
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: ts-bootstrap-headscale}
subjects:
  - {kind: ServiceAccount, name: ts-router-bootstrap, namespace: controller-vpn}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ts-bootstrap-router
  namespace: controller-vpn
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: ts-bootstrap-router}
subjects:
  - {kind: ServiceAccount, name: ts-router-bootstrap, namespace: controller-vpn}