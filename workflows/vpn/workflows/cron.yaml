
# (B) AUTO-RÉPARATION — récurrent
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: tailscale-router-bootstrap
  namespace: controller-vpn
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  workflowSpec:
    workflowTemplateRef:
      name: tailscale-router-bootstrap