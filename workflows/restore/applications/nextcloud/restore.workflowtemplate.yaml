apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: restore
  namespace: ${tenant}-${application}
spec:
  podGC:
    strategy: OnWorkflowSuccess
  serviceAccountName: restore-runner
  entrypoint: main
  arguments:
    parameters:
      - name: database-dump-filename
        value: ${tenant}-${application}-nextcloud-db-dump.sql
      - name: data-path
        value: "/data/${application}-nextcloud"
      - name: data-pvc
        value: "${application}-nextcloud"
      - name: database-dump-pvc
        value: "${application}-nextcloud-db-dump"
      - name: backup_source_cluster
        value: infra01
      - name: workload-kind
        value: "deployment"
      - name: workload-name
        value: ""
      - name: backup_source_cluster
        value: "${cluster}"
      - name: workload-kind
        value: "deployment"
      - name: workload-name
        value: ""
  volumes:
    - name: ${application}-data
      persistentVolumeClaim:
        claimName: ${application}-nextcloud
    - name: ${application}-db-dump
      persistentVolumeClaim:
        claimName: ${application}-nextcloud-db-dump
    - 
  templates:
    - name: main
      dag:
        tasks:
          - name: scale-down
            templateRef:
              name: scale
              template: main
              clusterScope: true
            arguments:
              parameters: 
                - name: replicas 
                  value: "0"
                - name: workload-name
                  value: "{{workflow.parameters.workload-name}}"
            when: "{{workflow.parameters.workload-name}} != ''"
        
          # restore data

          - name: resolve-data-snapshot-id
            templateRef:
              name: resolve-snapshot-id
              template: main
              clusterScope: true
            arguments:
              parameters: 
                - name: snapshot_path
                  value: "{{workflow.parameters.data-path}}"
                - name: source_bucket
                  value: "{{workflow.parameters.backup_source_cluster}}"
            dependencies: 
              - scale-down

          - name: create-data-restore
            templateRef:
              name: create-k8up-restore
              template: main
              clusterScope: true
            dependencies: 
              - resolve-data-snapshot-id
            arguments:
              parameters:
                - name: namespace
                  value: "${tenant}-${application}"
                - name: restore_target_pvc
                  value: "${application}"
                - name: snapshot_id
                  value: "{{tasks.resolve-data-snapshot-id.outputs.parameters.snapshot-id}}"
                - name: source_bucket
                  value: "alter-it-{{workflow.parameters.backup_source_cluster}}-backup-${tenant}-${application}"          

          - name: wait-data-restore
            templateRef:
              name: wait-for-k8up-restore
              template: main
              clusterScope: true
            dependencies: 
              - create-data-restore
            arguments:
              parameters:
                - name: name
                  value: "{{tasks.create-data-restore.outputs.parameters.restore-name}}"

          - name: resolve-database-dump-snapshot-id
            templateRef:
              name: resolve-snapshot-id
              template: main
              clusterScope: true
            arguments:
              parameters: 
                - name: snapshot_path
                  value: "/{{workflow.parameters.database-dump-filename}}"
                - name: source_bucket
                  value: "{{workflow.parameters.backup_source_cluster}}"
            dependencies: 
              - scale-down

          - name: create-database-dump-restore
            templateRef:
              name: create-k8up-restore
              template: main
              clusterScope: true
            dependencies: 
              - resolve-database-dump-snapshot-id
            arguments:
              parameters:
                - name: snapshot-id
                  value: "{{tasks.resolve-database-dump-snapshot-id.outputs.parameters.snapshot-id}}"
                - name: restore_target_pvc
                  value: "{{workflow.parameters.database-dump-pvc}}"

          - name: wait-for-database-dump-restore
            templateRef:
              name: wait-for-k8up-restore
              template: main
              clusterScope: true
            dependencies: 
              - create-database-dump-restore
            arguments:
              parameters:
                - name: name
                  value: "{{tasks.create-database-dump-restore.outputs.parameters.restore-name}}"
              
          - name: inject-database-dump
            templateRef:
              name: restore-database
              template: main
              clusterScope: true
            dependencies: 
              - wait-for-database-dump-restore
            arguments:
              parameters:
                - name: database-dump-pvc
                  value: "{{workflow.parameters.database-dump-pvc}}"
                - name: dump-file
                  value: "{{workflow.parameters.database-dump-filename}}"
                - name: db-host
                  value: "mysql-version-8-lts.controller-database.svc.cluster.local"

          - name: scale-up
            templateRef:
              name: scale
              template: main
              clusterScope: true
            dependencies:
              - wait-for-database-dump-restore
            arguments:
              parameters:
                - name: replicas
                  value: "1"
                - name: workload-name
                  value: "{{workflow.parameters.workload-name}}"
            when: "{{workflow.parameters.workload-name}} != ''"