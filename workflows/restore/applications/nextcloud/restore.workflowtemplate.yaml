apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: restore-pvc
  namespace: ${tenant}-${application}
spec:
  podGC:
    strategy: OnWorkflowSuccess
  serviceAccountName: restore-runner
  entrypoint: main
  arguments:
    parameters:
      - name: database-dump-path
        value: "/${tenant}-${application}-nextcloud-db-dump.sql"
      - name: data-path
        value: "/data/${application}-nextcloud"
      - name: pvc
        value: "${application}-nextcloud"
      - name: cluster_source
        value: "${cluster}"
      - name: workload-kind
        value: "deployment"
      - name: workload-name
        value: ""
  volumes:
    - name: ${application}-data
      persistentVolumeClaim:
        claimName: ${application}-${application}
  templates:
    - name: main
      dag:
        tasks:
          - name: scale-down
            template: scale
            arguments:
              parameters: 
                - name: replicas 
                  value: "0"
            when: "{{workflow.parameters.workload-name}} != ''"
        
          # restore data

          - name: resolve-data-snapshot-id
            template: resolve-id
            arguments:
              parameters: 
                - name: path 
                  value: "{{workflow.parameters.data-path}}"
            dependencies: 
              - scale-down

          - name: create-data-restore
            template: create-restore
            dependencies: 
              - resolve-data-snapshot-id
            arguments:
              parameters:
                - name: snapshot-id
                  value: "{{tasks.resolve-data-snapshot-id.outputs.parameters.snapshot-id}}"
          
          - name: wait-data-restore
            template: wait-restore
            dependencies: 
              - create-data-restore
            arguments:
              parameters:
                - name: name
                  value: "{{tasks.create-data-restore.outputs.parameters.restore-name}}"

          # restore database-dump

          - name: resolve-database-dump-snapshot-id
            template: resolve-id
            arguments:
              parameters: 
                - name: path 
                  value: "{{workflow.parameters.database-dump-path}}"
            dependencies: 
              - scale-down          

          - name: create-database-dump-restore
            template: create-restore
            dependencies: 
              - resolve-database-dump-snapshot-id
            arguments:
              parameters:
                - name: snapshot-id
                  value: "{{tasks.resolve-database-dump-snapshot-id.outputs.parameters.snapshot-id}}"
          
          - name: wait-database-dump-restore
            template: wait-restore
            dependencies: 
              - create-database-dump-restore
            arguments:
              parameters:
                - name: name
                  value: "{{tasks.create-database-dump-restore.outputs.parameters.restore-name}}"
              
          - name: scale-up
            template: scale
            dependencies:
              - wait-database-dump-restore
            arguments:
              parameters:
                - name: replicas
                  value: "1"
            when: "{{workflow.parameters.workload-name}} != ''"

    - name: resolve-id
      script:
        image: restic/restic:latest
        command:
          - sh
        source: |
          set -euo pipefail
          ID=$(restic snapshots --json --latest 1 --path "{{workflow.parameters.path}}" \
            | jq -r '.[0].short_id')
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "aucun snapshot pour {{workflow.parameters.path}}" >&2
            exit 1
          fi
          echo "resolved snapshot: $ID" >&2
          printf '%s' "$ID" > /tmp/snapshot-id
        env:
          - name: RESTIC_REPOSITORY
            value: "s3:https://s3.${s3_region}.io.cloud.ovh.net/alter-it-{{workflow.parameters.cluster_source}}-backup-${tenant}-${application}"
          - name: RESTIC_PASSWORD
            valueFrom:
              secretKeyRef:
                name: k8up-credentials
                key: RESTIC_PASSWORD
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: k8up-credentials
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: k8up-credentials
                key: AWS_SECRET_ACCESS_KEY
      outputs:
        parameters:
          - name: snapshot-id
            valueFrom:
              path: /tmp/snapshot-id

    - name: create-data-restore
      inputs:
        parameters:
          - name: snapshot-id
      resource:
        action: create
        manifest: |
          apiVersion: k8up.io/v1
          kind: Restore
          metadata:
            generateName: argo-restore-
            namespace: ${tenant}-${application}
          spec:
            snapshot: "{{inputs.parameters.snapshot-id}}"
            restoreMethod:
              folder:
                claimName: "{{workflow.parameters.pvc}}"
            backend:
              repoPasswordSecretRef:
                name: k8up-credentials
                key: RESTIC_PASSWORD
              s3:
                endpoint: https://s3.${s3_region}.io.cloud.ovh.net
                bucket: alter-it-{{workflow.parameters.cluster_source}}-backup-${tenant}-${application}
                accessKeyIDSecretRef:
                  name: k8up-credentials
                  key: AWS_ACCESS_KEY_ID
                secretAccessKeySecretRef:
                  name: k8up-credentials
                  key: AWS_SECRET_ACCESS_KEY
      outputs:
        parameters:
          - name: restore-name
            valueFrom:
              jsonPath: '{.metadata.name}'

    - name: wait-restore
      inputs:
        parameters:
          - name: name
      script:
        image: bitnami/kubectl:latest
        command: 
          - bash
        source: |
          set -euo pipefail
          kubectl wait --for=condition=Completed \
            restore/{{inputs.parameters.name}} \
            -n ${tenant}-${application} --timeout=1800s
          reason=$(kubectl get restore/{{inputs.parameters.name}} \
            -n ${tenant}-${application} \
            -o jsonpath='{.status.conditions[?(@.type=="Completed")].reason}')
          echo "restore reason: $reason"
          [ "$reason" = "Succeeded" ] || { echo "restore failed"; exit 1; }

    - name: scale
      inputs:
        parameters: 
          - name: replicas
      resource:
        action: patch
        mergeStrategy: merge
        flags:
          - "{{workflow.parameters.workload-kind}}"
          - "{{workflow.parameters.workload-name}}"
        manifest: |
          spec:
            replicas: {{inputs.parameters.replicas}}