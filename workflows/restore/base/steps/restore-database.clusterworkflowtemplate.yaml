

apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: restore-database
spec:
  templates:
    - name: main
      inputs:
        parameters:
          - name: dump-file
          - name: db-host
          - name: db-secret-name
          - name: db-secret-database-key 
      container:
        image: mysql:8
        command: [sh, -c]
        args:
          - |
            set -e
            mysql -h "{{inputs.parameters.db-host}}" \
              -u "$DB_USER" -p"$DB_PASS" \
              $DB_NAME < /restore/{{inputs.parameters.dump-file}}
        env:
          - name: DB_NAME
            valueFrom: { secretKeyRef: { name: "{{inputs.parameters.db-secret-name}}", key: "{{inputs.parameters.db-secret-database-key}}" } }
          - name: DB_USER
            valueFrom: { secretKeyRef: { name: mysql-operator, key: rootUser } }
          - name: DB_PASS
            valueFrom: { secretKeyRef: { name: mysql-operator, key: rootPassword } }
        volumeMounts:
          - name: "db-dump"
            mountPath: /restore
            readOnly: true