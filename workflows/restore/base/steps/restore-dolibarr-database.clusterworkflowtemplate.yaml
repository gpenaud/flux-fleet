

apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: restore-dolibarr-database
spec:
  templates:
    - name: main
      inputs:
        parameters:
          - name: dump-file
          - name: db-host
          - name: db-secret-name
          - name: db-secret-database-key
          - name: verify
            value: "true"
      script:
        image: mysql:8
        command: [bash]
        env:
          - name: DB
            valueFrom: { secretKeyRef: { name: "{{inputs.parameters.db-secret-name}}", key: "{{inputs.parameters.db-secret-database-key}}" } }
          - name: PASSWORD
            valueFrom: { secretKeyRef: { name: database, key: mariadb-root } }
        volumeMounts:
          - name: db-dump                 # volume fourni par le Workflow appelant
            mountPath: /dump
            readOnly: true
        source: |
          set -euo pipefail

          HOST='{{inputs.parameters.db-host}}'
          DUMP="/dump/{{inputs.parameters.dump-file}}"

          echo ">> Dump attendu : $DUMP"
          test -s "$DUMP" || { echo "ERREUR: dump absent ou vide: $DUMP"; exit 1; }

          echo ">> Reset de '$DB' : drop de toutes les tables existantes"
          { echo 'SET FOREIGN_KEY_CHECKS=0;';
            mysql --host="$HOST" --user="root" --password="$PASSWORD" -N "$DB" -e \
              "SELECT CONCAT('DROP TABLE IF EXISTS \`', table_name, '\`;')
                 FROM information_schema.tables
                WHERE table_schema='$DB' AND table_type='BASE TABLE';"; } \
          | mysql --host="$HOST" --user="root" --password="$PASSWORD" "$DB"

          echo ">> Import dans '$DB' (base vide, FK/UNIQUE off le temps du chargement)"
          { printf 'SET FOREIGN_KEY_CHECKS=0;\nSET UNIQUE_CHECKS=0;\n'; cat "$DUMP"; } \
          | mysql --host="$HOST" --user="root" --password="$PASSWORD" "$DB"

          if [ '{{inputs.parameters.verify}}' = 'true' ]; then
            echo ">> Validation : CHECK TABLE"
            CHECKS=$(mysql --host="$HOST" --user="root" --password="$PASSWORD" -N "$DB" -e \
              "SELECT CONCAT('CHECK TABLE \`', table_name, '\`;')
                 FROM information_schema.tables
                WHERE table_schema='$DB' AND table_type='BASE TABLE';")
            RES=$(printf '%s\n' "$CHECKS" | mysql --host="$HOST" --user="root" --password="$PASSWORD" -N "$DB")
            printf '%s\n' "$RES"
            if printf '%s\n' "$RES" | grep -vw 'OK' | grep -q .; then
              echo ">> ERREUR: au moins une table KO au CHECK."; exit 1
            fi
            echo ">> Toutes les tables sont OK."
          fi