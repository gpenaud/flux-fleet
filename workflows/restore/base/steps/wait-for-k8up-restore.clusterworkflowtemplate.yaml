
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: wait-for-k8up-restore
spec:
  entrypoint: main
  templates:
    - name: main
      inputs:
        parameters:
          - name: namespace
          - name: restore_name
      script:
        image: bitnami/kubectl:latest
        command: 
          - bash
        source: |
          set -euo pipefail
          kubectl wait --for=condition=Completed \
            restores.k8up.io/{{inputs.parameters.restore_name}} \
            -n {{inputs.parameters.namespace}} --timeout=1800s
          reason=$(kubectl get restores.k8up.io/{{inputs.parameters.restore_name}} \
            -n {{inputs.parameters.namespace}} \
            -o jsonpath='{.status.conditions[?(@.type=="Completed")].reason}')
          echo "restore reason: $reason"
          [ "$reason" = "Succeeded" ] || { echo "restore failed"; exit 1; }