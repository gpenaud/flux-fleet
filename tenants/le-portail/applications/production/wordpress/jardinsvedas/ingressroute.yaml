
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: wordpress-jardinsvedas
  namespace: ${tenant}-wordpress-jardinsvedas
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`jardinsvedas.${domain}`)
      kind: Rule
      services:
        - name: wordpress
          port: 80
  tls:
    secretName: wildcard.${domain}.tls
