apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wordpress
spec:
  values:
    wordpressUsername: le-portail
    wordpressExistingSecret: wordpress
    wordpressEmail: dugrainamoudre@${domain}
    overrideDatabaseSettings: true
    mariadb:
      enabled: false
    externalDatabase:
      host: mysql-version-8-lts.controller-database.svc.cluster.local
      port: 3306
      user: le-portail
      database: lp-wp-site
      existingSecret: wordpress
    wordpressPlugins: []
    service:
      type: ClusterIP
    persistence:
      enabled: true
      storageClass: longhorn
      size: 10Gi
    ingress:
      enabled: false
    resourcesPreset: "none"
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        cpu: 1500m
        memory: 3Gi
    initContainers: []
    volumePermissions:
      enabled: false
      resourcesPreset: "none"
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi

