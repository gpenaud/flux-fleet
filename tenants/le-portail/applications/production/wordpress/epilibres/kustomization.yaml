
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ${tenant}-wordpress-epilibres

resources:
  - ../../../../../../applications/wordpress
  - ../../../../../../applications/wordpress/components/init
  - ../../../../../../applications/wordpress/components/backup
  - ingressroute.yaml
  - secrets.enc.yaml
  # workflows
  - ../../../../../../workflows/restore/applications/wordpress

# Branche le site sur l'annuaire : bouton de connexion unique a cote du
# formulaire, qui reste le recours. Inerte tant que wordpress_directory ne vaut
# pas 1 sur le cluster.
components:
  - ../../../../../../applications/wordpress/components/directory

patches:
  - target:
      kind: HelmRelease
    path: values.yaml