apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
spec:
  values:
    internalDatabase:
      enabled: false
    mariadb:
      enabled: false
    externalDatabase:
      enabled: true
      type: mysql
      # Sans port : le service mariadb n'expose que 3306. Le 6446 tenait de
      # l'ancienne infrastructure MySQL, dont le routeur MaxScale ecoutait la ;
      # repris tel quel a la migration, il ne designait plus rien et faisait
      # echouer l'installation sur « SQLSTATE[HY000] [2002] Connection timed
      # out » — apres cinq secondes d'attente, la ou 3306 repond aussitot.
      host: mariadb.controller-database.svc.cluster.local
      database: lp-nextcloud
      existingSecret:
        enabled: true
        secretName: nextcloud
        usernameKey: mariadb-user
        passwordKey: mariadb-password
    persistence:
      enabled: true
      storageClass: ${storage_class}
      accessMode: ReadWriteOnce
      size: 5Gi
    nextcloud:
      host: nextcloud.${domain}
      datadir: /var/www/html/data
      # Important : trusted domains
      configs:
        custom.config.php: |-
          <?php
          $CONFIG = array(
            'trusted_domains' => [
              'nextcloud.${domain}',
              'cloud.${domain}'
            ],
            'overwrite.cli.url' => 'https://nextcloud.${domain}',
            'overwriteprotocol' => 'https',
          );
      existingSecret:
        enabled: true
        secretName: nextcloud
        usernameKey: nextcloud-username
        passwordKey: nextcloud-password
      # ================================================================
      # Annuaire : comptes par LDAP, SSO par OIDC
      # ================================================================
      # Les deux cohabitent volontairement. Le LDAP conserve la Basic auth, dont
      # dependent les clients bureau, mobiles et WebDAV/CalDAV ; l'OIDC ajoute le
      # bouton de connexion unique dans le navigateur.
      #
      # Ils doivent produire le MEME identifiant, sinon la connexion SSO cree un
      # second compte et l'utilisateur arrive sur un espace vide. D'ou
      # ldapExpertUsernameAttr=uid d'un cote, et --unique-uid=0 avec
      # --mapping-uid=preferred_username de l'autre.
      extraEnv:
        - name: LDAP_BIND_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lldap-bind-nextcloud
              key: password
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: nextcloud-${tenant}-oidc-client-secret
              key: client_secret
      hooks:
        # « before-starting » s'execute a chaque demarrage : la configuration est
        # donc reappliquee, et se corrige d'elle-meme si quelqu'un l'a modifiee
        # depuis l'interface.
        before-starting: |
          #!/bin/sh
          set -eu

          # Variables shell sans accolades : Flux substitue toute occurrence de
          # cette syntaxe dans le manifeste rendu, avant meme le demarrage du
          # conteneur, et vide celles qu'il ne connait pas.
          ACTIF="${nextcloud_directory:=0}"
          if [ "$ACTIF" != "1" ]; then
            echo "Annuaire non active sur ce cluster, configuration inchangee."
            exit 0
          fi

          BASE="dc=alter-it,dc=eu"
          GROUPES="(|(memberOf=cn=${tenant}-nextcloud,ou=groups,$BASE)(memberOf=cn=${tenant}-nextcloud-admins,ou=groups,$BASE)(memberOf=cn=${tenant}-admins,ou=groups,$BASE))"

          php occ app:enable user_ldap >/dev/null

          # Une seule configuration, reutilisee d'un demarrage a l'autre : sans ce
          # test, chaque redemarrage en creerait une nouvelle.
          if ! php occ ldap:show-config s01 >/dev/null 2>&1; then
            php occ ldap:create-empty-config
          fi

          php occ ldap:set-config s01 ldapHost "lldap.controller-directory.svc.cluster.local"
          php occ ldap:set-config s01 ldapPort "3890"
          php occ ldap:set-config s01 ldapAgentName "uid=nextcloud,ou=people,$BASE"
          php occ ldap:set-config s01 ldapAgentPassword "$LDAP_BIND_PASSWORD"
          php occ ldap:set-config s01 ldapBase "$BASE"
          php occ ldap:set-config s01 ldapBaseUsers "ou=people,$BASE"
          php occ ldap:set-config s01 ldapBaseGroups "ou=groups,$BASE"
          php occ ldap:set-config s01 ldapUserFilter "(&(objectClass=person)$GROUPES)"
          php occ ldap:set-config s01 ldapLoginFilter "(&(uid=%uid)$GROUPES)"
          php occ ldap:set-config s01 ldapUserDisplayName "displayname"
          php occ ldap:set-config s01 ldapEmailAttribute "mail"
          # Sans cela, Nextcloud forge un identifiant interne opaque, que la
          # connexion SSO ne retrouverait jamais.
          php occ ldap:set-config s01 ldapExpertUsernameAttr "uid"
          php occ ldap:set-config s01 ldapGroupFilter "(&(objectClass=groupOfNames)(|(cn=${tenant}-nextcloud)(cn=${tenant}-nextcloud-admins)(cn=${tenant}-admins)))"
          php occ ldap:set-config s01 ldapGroupMemberAssocAttr "member"
          php occ ldap:set-config s01 ldapConfigurationActive "1"

          php occ app:install user_oidc >/dev/null 2>&1 || php occ app:enable user_oidc >/dev/null
          # Le secret passe par l'environnement plutot que par la ligne de
          # commande, ou il serait lisible dans la liste des processus.
          php occ user_oidc:provider authelia \
            --clientid="nextcloud-${tenant}" \
            --clientsecret-env=OIDC_CLIENT_SECRET \
            --discoveryuri="https://auth.${domain}/.well-known/openid-configuration" \
            --unique-uid=0 \
            --mapping-uid=preferred_username \
            --mapping-display-name=name \
            --mapping-email=email

          # « mixed » : le formulaire de connexion s'affiche a cote du bouton
          # Authelia. « sso » : /login redirige d'emblee vers Authelia, ce que
          # Nextcloud ne fait que s'il n'existe qu'un seul fournisseur.
          #
          # La porte de secours est native et n'a pas a etre amenagee :
          # /login?direct=1 ramene le formulaire, donc le compte local de
          # depannage reste joignable si l'annuaire tombe.
          MODE="${nextcloud_login_mode:=mixed}"
          if [ "$MODE" = "sso" ]; then
            php occ config:app:set user_oidc allow_multiple_user_backends --value="0"
          else
            php occ config:app:set user_oidc allow_multiple_user_backends --value="1"
          fi

          echo "Annuaire et SSO configures (mode de connexion : $MODE)."
    ingress:
      enabled: false

  # Fait resoudre le nom d'Authelia vers le service ClusterIP de Traefik, au lieu
  # de l'adresse publique du noeud : la requete ne sort plus du cluster pour y
  # revenir. Le nom, le certificat et l'issuer ne changent pas, seul le trajet —
  # de 0,6 a 16 secondes de poignee de main TLS mesurees par l'exterieur, contre
  # une vingtaine de millisecondes par l'interieur.
  #
  # Sans effet sur le navigateur, qui resout par le DNS public : seuls les appels
  # de serveur a serveur, dont l'echange du code contre le jeton, en profitent.
  #
  # Par un postRenderer, et non par les values : ce chart-ci est le seul des
  # quatre a ne pas exposer hostAliases.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: nextcloud
            patch: |
              - op: add
                path: /spec/template/spec/hostAliases
                value:
                  - ip: ${internal_service_ip}
                    hostnames:
                      - auth.${domain}