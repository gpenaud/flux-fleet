apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${tenant}-grist
spec:
  values:
    # Fait resoudre le nom d'Authelia vers le service ClusterIP de Traefik, au
    # lieu de l'adresse publique du noeud : la requete ne sort plus du cluster
    # pour y revenir. Le nom, le certificat et l'issuer ne changent pas, seul le
    # trajet — de 0,6 a 16 secondes de poignee de main TLS mesurees par
    # l'exterieur, contre une vingtaine de millisecondes par l'interieur.
    #
    # Sans effet sur le navigateur, qui resout par le DNS public.
    defaultPodOptions:
      hostAliases:
        - ip: ${internal_service_ip}
          hostnames:
            - auth.${domain}

    controllers:
      grist:
        type: deployment
        strategy: Recreate # ← important pour éviter les problèmes de PV concurrents
        containers:
          app:
            image: &gristImage
              repository: gristlabs/grist
              tag: "1.7.17"
            env:
              PORT: "8484"
              # === STORAGE ===
              GRIST_DB_URL: "sqlite:////persist/home.sqlite3"
              TYPEORM_DATABASE: "/persist/home.sqlite3"
              GRIST_DATA_DIR: "/persist/docs"
              GRIST_SANDBOX_FLAVOR: "unsandboxed"
              # Racine ou Grist cherche les plugins installes (<racine>/plugins).
              # Un sous-dossier dedie plutot que /persist directement : la racine
              # sert aussi d'espace de travail a Grist, et les documents n'ont
              # rien a y faire.
              GRIST_USER_ROOT: "/persist/grist-user"

              # === IDENTITY ===
              GRIST_FORCE_LOGIN: "true"
              GRIST_SINGLE_ORG: "${tenant}"
              GRIST_DEFAULT_EMAIL: "ops.gpenaud@gmail.com"

              # === PUBLIC URLS ===
              APP_HOME_URL: "https://grist.${domain}"
              # Domaine d'ou sont servis les widgets, tenu a l'ecart du domaine
              # principal : leur code est tiers, et l'isoler evite qu'il
              # s'execute dans la session de l'utilisateur.
              #
              # Sans cette valeur, Grist retombe sur son adresse d'ecoute et
              # publie ses widgets embarques sous « http://0.0.0.0:35587/... »,
              # que le navigateur ne peut pas joindre : le calendrier restait
              # vide. L'image 1.7.17 a commence a embarquer ses widgets, jusque-la
              # tous distants, ce qui a rendu le defaut visible.
              APP_UNTRUSTED_URL: "https://grist-widgets.${domain}"
              GRIST_OIDC_SP_HOST: "https://grist.${domain}"

              # === OIDC ===
              GRIST_OIDC_IDP_ISSUER: "https://auth.${domain}"
              GRIST_OIDC_IDP_CLIENT_ID: "grist-${tenant}"
              GRIST_OIDC_IDP_CLIENT_SECRET:
                secretKeyRef:
                  name: grist-oidc-client-secret
                  key: client_secret
              GRIST_OIDC_IDP_SCOPES: "openid email profile"
              GRIST_OIDC_IDP_SKIP_END_SESSION_ENDPOINT: "true"    # ok pour l'instant
              # + tes env actuels : session secret (via secret), sandbox flavor, OIDC Grist, etc.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /status
                    port: 8484
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /status
                    port: 8484

        initContainers:
          # Installe une copie du widget calendrier qui s'ouvre sur le jour
          # courant.
          #
          # Le widget d'origine suit le curseur : au chargement, Grist le pose
          # sur la premiere ligne de la table, et le calendrier saute a la date
          # de cet enregistrement — janvier, quand les donnees commencent la. Le
          # widget n'offre aucun reglage pour cela, et le code distant est
          # identique au code embarque : il faut donc le modifier.
          #
          # La copie vit dans le volume, hors de l'image, et se refait a chaque
          # demarrage a partir de la version embarquee : une montee de version de
          # Grist est ainsi reprise sans intervention.
          #
          # Si le motif attendu disparait du code amont, l'installation est
          # abandonnee et le message le dit. On ne fait pas echouer le
          # demarrage : mieux vaut le widget d'origine, meme mal cadre, qu'une
          # instance qui ne demarre pas.
          install-calendar-widget:
            # Meme image que le conteneur principal, par ancre YAML : c'est
            # d'elle qu'on copie le widget, et deux versions differentes
            # installeraient le widget de l'ancienne dans la nouvelle.
            image: *gristImage
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                SRC=/grist/node_modules/@gristlabs/grist-widget/dist/plugins/grist-bundled
                DST=/persist/grist-user/plugins/calendrier-du-jour

                rm -rf "$DST"
                mkdir -p "$DST"
                cp -r "$SRC/archive" "$DST/archive"

                PAGE="$DST/archive/widgets/calendar/page.js"
                AVANT=$(grep -c "this.calendar.setDate(startDate);" "$PAGE" || true)
                if [ "$AVANT" != "1" ]; then
                  echo "AVERTISSEMENT : motif attendu introuvable dans page.js ($AVANT occurrence(s))."
                  echo "Widget calendrier non installe ; le widget d'origine reste disponible."
                  rm -rf "$DST"
                  exit 0
                fi

                # Le premier positionnement est ignore : la vue reste sur le jour
                # courant. Les suivants — clic sur une ligne — deplacent le
                # calendrier comme avant.
                sed -i \
                  's|this.calendar.setDate(startDate);|if (this._gristVueInitiale) { this.calendar.setDate(startDate); } this._gristVueInitiale = true;|' \
                  "$PAGE"

                # printf plutot qu'un heredoc : le contenu ne depend alors
                # d'aucune indentation, que le rendu YAML de ce bloc rognerait
                # de facon difficile a prevoir.
                printf '%s\n' \
                  'name: calendrier-du-jour' \
                  'components:' \
                  '  widgets: archive/manifest.json' \
                  > "$DST/manifest.yml"

                # Le manifeste est DERIVE de celui d'origine, jamais reecrit :
                # il porte un bloc « archive » qui declare les domaines
                # embarques et les points d'entree i18n. Un manifeste minimal
                # les perd, et le widget s'affiche alors vide.
                #
                # Seuls le nom et l'identifiant changent — l'identifiant parce
                # qu'il doit differer de celui du widget d'origine, sans quoi
                # les deux se confondraient.
                node -e '
                  const fs = require("fs");
                  const chemin = process.argv[1];
                  const tous = JSON.parse(fs.readFileSync(chemin, "utf8"));
                  const cal = tous.find(w => w.widgetId === "@gristlabs/widget-calendar");
                  if (!cal) {
                    console.error("Entree calendrier introuvable dans le manifeste amont.");
                    process.exit(1);
                  }
                  cal.name = "Calendrier (jour courant)";
                  cal.widgetId = "leportail/widget-calendar-jour-courant";
                  cal.description = "Comme le calendrier standard, mais ouvre sur le jour courant.";
                  fs.writeFileSync(chemin, JSON.stringify([cal], null, 2));
                ' "$DST/archive/manifest.json" || {
                  echo "AVERTISSEMENT : manifeste non derivable, widget non installe."
                  rm -rf "$DST"
                  exit 0
                }

                echo "Widget « Calendrier (jour courant) » installe dans $DST."
    service:
      app:
        controller: grist
        ports:
          http:
            port: 8484

    persistence:
      persist:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        storageClass: ${storage_class}
        globalMounts:
          - path: /persist
        # annotations:
        #   k8up.io/backup: "false"