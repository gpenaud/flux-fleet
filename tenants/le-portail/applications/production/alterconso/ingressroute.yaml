
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: alterconso
  namespace: ${tenant}-alterconso
  annotations:
    external-dns.alpha.kubernetes.io/hostname: alterconso.${tenant}
    external-dns.alpha.kubernetes.io/target: ${tenant}
    external-dns.alpha.kubernetes.io/ttl: "300"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`alterconso.${tenant}`)
      kind: Rule
      services:
        - name: alterconso
          port: 80
  tls:
    secretName: wildcard.${domain}.tls
