
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: alterconso
  namespace: ${tenant}-alterconso
  annotations:
    external-dns.alpha.kubernetes.io/hostname: alterconso.${domain}
    external-dns.alpha.kubernetes.io/target: ${domain}
    external-dns.alpha.kubernetes.io/ttl: "300"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`alterconso.${domain}`)
      kind: Rule
      services:
        - name: alterconso
          port: 8080
  tls:
    secretName: wildcard.${domain}.tls
