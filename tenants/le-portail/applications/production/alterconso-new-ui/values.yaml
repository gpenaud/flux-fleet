apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alterconso
spec:
  values:
    # Nom distinct de celui de la production : les deux instances vivent dans
    # des namespaces separes, mais un nom propre evite qu'un kubectl lance dans
    # le mauvais contexte designe l'autre sans qu'on s'en apercoive.
    nameOverride: "alterconso-new-ui"
    fullnameOverride: "alterconso-new-ui"
    image:
      repository: ghcr.io/gpenaud/alterconso
      # Tag fixe, et non ${alterconso_image_tag} comme en production : cette
      # instance sert precisement a eprouver une version que la production ne
      # porte pas. La faire suivre la variable de cluster reviendrait a lui
      # faire montrer ce qui tourne deja a cote.
      #
      # rc-60ec758 : tete de refonte-ui. La branche s appelait
      # refonte-legacy-29aout, du jour ou la refonte de l interface historique
      # a ete reconstituee ; elle porte seule la refonte desormais, et
      # refonte-front — la SPA React, jamais servie ici — est archivee sous le
      # tag archive/refonte-front.
      #
      # Elle ne part plus de d2735b9 : les quatre commits que la production
      # avait pris depuis y sont reportes — les producteurs clos qui ne
      # bloquent plus toute la commande, le tri sur le nom de famille et la
      # numerotation des paniers du 5 septembre. Les index d unicite que la
      # base de cette instance porte deja s accordent donc au code, au lieu
      # d en attendre la suite.
      #
      # S y ajoutent l ecriture des fiches producteurs — creation, correction
      # et suppression, jusqu ici possibles par la seule API JSON — et deux
      # mises d aplomb sur telephone. La premiere ajoute une colonne :
      # vendors.group_id, posee au demarrage par AutoMigrate, nullable, que
      # rien d autre ne lit.
      #
      # Puis l ouverture d un catalogue, qui ne se faisait qu en dupliquant un
      # autre : le premier catalogue d un producteur nouvellement saisi n avait
      # aucun moyen d exister. Et sa fermeture, qui n existait pas du tout —
      # refusee des qu une commande y tient, les ecritures comptables ne
      # s effacant pas. Sans migration pour ces deux-la : les ecrans n ecrivent
      # que dans des colonnes deja en place.
      tag: "rc-60ec758"
    imagePullSecrets:
      - name: regcred
    replicaCount: 1
    waitForDatabase:
      enabled: true
      image: mysql:8.4
      timeoutSeconds: 60

    # Meme raison qu'en production : l'application compare time.Now() a des
    # dates ecrites en heure locale francaise, sans conversion.
    extraEnv:
      - name: TZ
        value: Europe/Paris

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

    ingress:
      enabled: false

    database:
      external:
        host: mariadb.controller-database.svc.cluster.local
        port: "3306"
      init:
        enabled: true
        image: mysql:8.4
        adminSecret: "database"
        passwordSecretKey: "mariadb-root"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi

    secrets:
      existingSecret: alterconso-new-ui
    config:
      port: "80"
      debug: false

      # Base distincte de lp-alterconso, et c'est le point qui compte le plus
      # ici. L'application execute a chaque demarrage db.Migrate puis sept
      # migrations de donnees, dont BackfillBasketNumbers, qui fusionne des
      # paniers, en cree, les numerote et pose deux index d'unicite. Branchee
      # sur la base de production, cette instance ne serait pas un deploiement
      # a cote : elle migrerait la production avec du code que la production ne
      # porte pas encore.
      #
      # L'initContainer init-db la cree si elle n'existe pas. Elle nait donc
      # vide ; c'est une copie de lp-alterconso qui la remplit, refaite quand
      # on veut repartir de l'etat courant.
      db_user: alterconso
      db_name: lp-alterconso-new-ui

      jwt_expiry_hours: 168
      host: new-ui-alterconso.${domain}

      smtp_host: smtp-relay.brevo.com
      smtp_port: 587
      # Identifiant SMTP et cles d'API laisses vides, ici et dans le Secret :
      # cette instance travaille sur une copie des donnees de production, donc
      # sur les vraies adresses des adherents. Un message parti d'un ecran en
      # cours de refonte arriverait chez eux. Les envois echouent, et c'est
      # l'effet recherche.
      smtp_user: ""
      default_email: alterconso@leportail.org

      technical_manager:
        email: "guillaume.penaud@gmail.com"
        first_name: Guillaume
        last_name: Penaud

      messages:
        recipient_categories:
          - name: "Membres réguliers"
            pattern: ">= 3 commandes sur 3m"
          - name: "Membres occasionnels"
            pattern: ">= 1 commande sur 6m"
          - name: "Membres inactifs"
            pattern: "< 1 commande sur 6m"

      notifications:
        enabled: false
        recipient_category: "Membres réguliers"
