apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alterconso
spec:
  values:
    # Nom distinct de celui de la production : les deux instances vivent dans
    # des namespaces separes, mais un nom propre evite qu'un kubectl lance dans
    # le mauvais contexte designe l'autre sans qu'on s'en apercoive.
    nameOverride: "alterconso-new-ui"
    fullnameOverride: "alterconso-new-ui"
    image:
      repository: ghcr.io/gpenaud/alterconso
      # Tag fixe, et non ${alterconso_image_tag} comme en production : cette
      # instance sert precisement a eprouver une version que la production ne
      # porte pas. La faire suivre la variable de cluster reviendrait a lui
      # faire montrer ce qui tourne deja a cote.
      #
      # rc-07f3ee8 : tete de refonte-ui. La branche s appelait
      # refonte-legacy-29aout, du jour ou la refonte de l interface historique
      # a ete reconstituee ; elle porte seule la refonte desormais, et
      # refonte-front — la SPA React, jamais servie ici — est archivee sous le
      # tag archive/refonte-front.
      #
      # Elle ne part plus de d2735b9 : les quatre commits que la production
      # avait pris depuis y sont reportes — les producteurs clos qui ne
      # bloquent plus toute la commande, le tri sur le nom de famille et la
      # numerotation des paniers du 5 septembre. Les index d unicite que la
      # base de cette instance porte deja s accordent donc au code, au lieu
      # d en attendre la suite.
      #
      # S y ajoutent l ecriture des fiches producteurs — creation, correction
      # et suppression, jusqu ici possibles par la seule API JSON — et deux
      # mises d aplomb sur telephone. La premiere ajoute une colonne :
      # vendors.group_id, posee au demarrage par AutoMigrate, nullable, que
      # rien d autre ne lit.
      #
      # Puis l ouverture d un catalogue, qui ne se faisait qu en dupliquant un
      # autre : le premier catalogue d un producteur nouvellement saisi n avait
      # aucun moyen d exister. Et sa fermeture, qui n existait pas du tout —
      # refusee des qu une commande y tient, les ecritures comptables ne
      # s effacant pas. Sans migration pour ces deux-la : les ecrans n ecrivent
      # que dans des colonnes deja en place.
      #
      # Enfin une bande d image entre la prochaine distribution et la suite de
      # l accueil, les deux images de la page etant au passage attenuees pour
      # peser moins que ce qu elles accompagnent.
      #
      # rc-a7c58cd reporte la correction partie en production le 12 septembre :
      # le droit « Gestion des distributions » ouvre desormais la liste des
      # commandes d une date, sa repartition par producteur, son export, et les
      # actions qui corrigent une commande sur place. Ces ecrans vivent sous
      # « /contractAdmin » par heritage et en avaient garde le droit
      # « catalogues », si bien que celui qui tient la distribution se les
      # voyait refuser le jour meme.
      #
      # Reportee et non fusionnee, comme les quatre commits precedents : cette
      # branche porte la refonte, que master n a pas. L ouverture d un
      # catalogue, qu elle seule connait, reste au droit « catalogues » — elle
      # n est pas un geste de distribution.
      #
      # rc-79607f1 rend l accueil lisible d un pouce. Mesure a 360 px de large,
      # une carte de distribution occupait presque tout l ecran : horaire,
      # adresse et permanences y prenaient quatre rangees, l adresse deux a
      # elle seule. Elles passent dans un volet sous le bouton de commande,
      # avec le meme mecanisme que celui des producteurs ; sur grand ecran
      # elles restent a droite de la pastille, ou elles comblent le vide
      # qu elle laisse.
      #
      # S y ajoutent l etat des commandes sur la ligne du lieu — en un mot sur
      # telephone, en phrase sur grand ecran — et la date centree dans sa
      # pastille, qui s etirait sans que son contenu suive.
      #
      # La banniere change d image et de couleur AVEC : les cagettes
      # remplacent l ancienne photo, agrandies de 215 a 270 px. L ancienne
      # etait sombre et portait du blanc ; celle-ci est claire — le blanc y
      # tombait a 1,33:1, trois fois moins que le minimum lisible — d ou un
      # voile creme et le brun terre de la charte, a 7,9:1. La bande d image du
      # bas disparait.
      #
      # rc-be6191e ne change rien a l ecran : elle retire « default-banner.jpg »
      # de l image, que plus aucun gabarit ni aucune feuille de style ne
      # nommait depuis que la banniere a change de photo — trois cent cinquante-
      # sept kilo-octets embarques pour rien.
      #
      # rc-55df059 detache l accroche de la banniere des titres du site — elle
      # portait le brun qui NOMME les choses, alors qu elle ne designe rien —
      # et surtout donne aux feuilles de style une adresse qui change avec
      # elles.
      #
      # CE DERNIER POINT N EST PAS COSMETIQUE. Les gabarits demandaient
      # « /css/alterconso.css » sans version : un navigateur qui tenait
      # l ancienne feuille en cache la resservait avec le HTML neuf, et ce que
      # la nouvelle devait cacher s affichait. On a vu sur cette instance les
      # trois lignes d informations ET le bouton cense les remplacer. Cela
      # valait pour chaque adherent a chaque livraison.
      #
      # rc-d156431 ramene a la distribution qu on vient de commander plutot
      # qu en haut de l accueil, et met en retrait les producteurs dont la
      # commande n est pas encore ouverte — chacun ouvre quand il veut, si bien
      # qu une distribution ouverte peut en compter qu on ne peut pas encore
      # commander. Ils restent listes, avec la mention qui l explique : les
      # retirer les ferait passer pour absents alors qu ils viennent.
      #
      # rc-3a1ce42 baisse d un cran le titre de la banniere — il pesait
      # davantage que celui de la carte juste en dessous, laquelle porte
      # pourtant ce qu on vient chercher.
      #
      # rc-8ee09de range le volet des producteurs sur deux criteres : les
      # signales d abord — une mise en avant est un arbitrage explicite du
      # groupe, et elle l emporte meme si la commande n est pas encore ouverte
      # — puis ceux dont la commande est ouverte. Il remplace un epinglage qui
      # ne remontait qu un producteur, le premier rencontre : deux campagnes le
      # meme jour n en voyaient qu une passer devant.
      #
      # Le titre du bandeau-image descend encore, a 1,6 em et 1,2 sur
      # telephone : c est la police de titre et la graisse qui font desormais
      # l ecart avec le texte, plus que la taille.
      tag: "rc-8ee09de"
    imagePullSecrets:
      - name: regcred
    replicaCount: 1
    waitForDatabase:
      enabled: true
      image: mysql:8.4
      timeoutSeconds: 60

    # Meme raison qu'en production : l'application compare time.Now() a des
    # dates ecrites en heure locale francaise, sans conversion.
    extraEnv:
      - name: TZ
        value: Europe/Paris

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

    ingress:
      enabled: false

    database:
      external:
        host: mariadb.controller-database.svc.cluster.local
        port: "3306"
      init:
        enabled: true
        image: mysql:8.4
        adminSecret: "database"
        passwordSecretKey: "mariadb-root"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi

    secrets:
      existingSecret: alterconso-new-ui
    config:
      port: "80"
      debug: false

      # Base distincte de lp-alterconso, et c'est le point qui compte le plus
      # ici. L'application execute a chaque demarrage db.Migrate puis sept
      # migrations de donnees, dont BackfillBasketNumbers, qui fusionne des
      # paniers, en cree, les numerote et pose deux index d'unicite. Branchee
      # sur la base de production, cette instance ne serait pas un deploiement
      # a cote : elle migrerait la production avec du code que la production ne
      # porte pas encore.
      #
      # L'initContainer init-db la cree si elle n'existe pas. Elle nait donc
      # vide ; c'est une copie de lp-alterconso qui la remplit, refaite quand
      # on veut repartir de l'etat courant.
      db_user: alterconso
      db_name: lp-alterconso-new-ui

      jwt_expiry_hours: 168
      host: new-ui-alterconso.${domain}

      smtp_host: smtp-relay.brevo.com
      smtp_port: 587
      # Identifiant SMTP et cles d'API laisses vides, ici et dans le Secret :
      # cette instance travaille sur une copie des donnees de production, donc
      # sur les vraies adresses des adherents. Un message parti d'un ecran en
      # cours de refonte arriverait chez eux. Les envois echouent, et c'est
      # l'effet recherche.
      smtp_user: ""
      default_email: alterconso@leportail.org

      technical_manager:
        email: "guillaume.penaud@gmail.com"
        first_name: Guillaume
        last_name: Penaud

      messages:
        recipient_categories:
          - name: "Membres réguliers"
            pattern: ">= 3 commandes sur 3m"
          - name: "Membres occasionnels"
            pattern: ">= 1 commande sur 6m"
          - name: "Membres inactifs"
            pattern: "< 1 commande sur 6m"

      notifications:
        enabled: false
        recipient_category: "Membres réguliers"
