apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: podconfig
  namespace: ${tenant}-dolibarr
spec:
  template:
    spec:
      securityContext:
        fsGroup: 33
      containers:
        - name: backup
          securityContext:
            runAsUser: 33
            runAsGroup: 33
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: dolibarr
  namespace: ${tenant}-dolibarr
spec:
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 1
  podConfigRef:
    name: podconfig
  backend:
    repoPasswordSecretRef:
      name: k8up-credentials
      key: RESTIC_PASSWORD
    s3:
      endpoint: https://s3.sbg.io.cloud.ovh.net 
      bucket: "${owner}-${cluster}-backup-${tenant}-dolibarr"
      accessKeyIDSecretRef:
        name: k8up-credentials
        key: AWS_ACCESS_KEY_ID
      secretAccessKeySecretRef:
        name: k8up-credentials
        key: AWS_SECRET_ACCESS_KEY
  backup:
    # 4 fois par semaine : lundi, mardi, mercredi, jeudi à 02h00
    schedule: '0 2 * * 2,3,4,5'
  check:
    schedule: '0 3 * * 4' # vérification chaque jeudi
  prune:
    schedule: '0 4 * * 4' # nettoyage chaque jeudi selon la rétention ci-dessous
    retention:
      keepLast: 4    # toujours garder les 4 derniers (couvre la 1ère semaine)
      keepWeekly: 4  # 1 snapshot par semaine pendant 4 semaines (1 mois)
      keepMonthly: 2 # 1 snapshot par mois pendant 6 mois (~2 snapshots sur 1 an)
      keepYearly: 1  # 1 snapshot annuel

---
apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: pre-backup
  labels:
    reflector/mysql-operator: "true"
  annotations:
    k8up.io/backup: "true"
spec:
  backupCommand: sh -c 'mysqldump --add-drop-table --set-gtid-purged=OFF --no-tablespaces --single-transaction --hex-blob --init-command="SET SQL_MODE=\"NO_AUTO_VALUE_ON_ZERO\"" -h mysql-version-8-lts.controller-mysql-operator.svc.cluster.local -u $DOLIBARR_MYSQL_USER -p"$DOLIBARR_MYSQL_PASSWORD" $DOLIBARR_MYSQL_DATABASE'
  fileExtension: .sql
  pod:
    spec:
      containers:
        - name: db-dump
          image: mysql:8.4.3
          command: ["sleep", "infinity"]
          env:
            - name: MYSQL_ALLOW_EMPTY_PASSWORD
              value: "true"
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: mysql-operator
                  key: rootPassword
            - name: DOLIBARR_MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: dolibarr
                  key: mariadb-user
            - name: DOLIBARR_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dolibarr
                  key: mariadb-password
            - name: DOLIBARR_MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: dolibarr
                  key: mariadb-database

