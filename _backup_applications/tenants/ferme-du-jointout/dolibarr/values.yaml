apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${tenant}-dolibarr
spec:
  values:
    replicaCount: 1
    image:
      tag: 23.0.1
    cron:
      enabled: false
    pdb:
      create: false
      minAvailable: 1
      maxUnavailable:
    ingress:
      enabled: true
      ingressClassName: traefik
      pathType: Prefix
      annotations:
        kubernetes.io/ingress.class: traefik
        cert-manager.io/cluster-issuer: letsencrypt-production
      hosts:
        - host: compta.${tenant_domain}
          paths:
            - /
      tls:
        - secretName: compta.${tenant_domain}-tls
          hosts:
            - compta.${tenant_domain}
    persistence:
      enabled: true
      size: 5Gi
    dolibarr:
      admin:
        username: ${tenant}
        password: "REPLACED"
      externalUrl: https://compta.${tenant_domain}
      cron:
        enabled: false
    existingSecret: dolibarr
    existingSecretKeyAdminPassword: dolibarr-admin-password
    existingSecretKeyCronSecurityKey: dolibarr-cron-security-key
    mariadb:
      enabled: false
    externalMariadb:
      enabled: true
      host: mysql-version-8-lts.controller-mysql-operator.svc.cluster.local
      port: 3306
      database: fdj-dolibarr
      username: ${tenant}
      existingSecret: dolibarr
      existingSecretKeyPassword: mariadb-password