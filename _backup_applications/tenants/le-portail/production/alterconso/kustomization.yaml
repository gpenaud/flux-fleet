---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: le-portail-alterconso
resources:
  - ../../../../base/alterconso/
  - secrets.enc.yaml
patches:
  - path: values.yaml
    target:
      kind: HelmRelease
      name: alterconso
  - target:
      kind: ImageUpdateAutomation
      name: alterconso
    patch: |
      - op: replace
        path: /spec/update/path
        value: ./applications/tenants/le-portail/production
  # Overrides the k8up bucket values with subPath
  - target:
      kind: Schedule
      name: alterconso
    patch: |-
      - op: replace
        path: /spec/backend/s3/bucket
        value: "alter-it-infra01-backup-le-portail-alterconso"