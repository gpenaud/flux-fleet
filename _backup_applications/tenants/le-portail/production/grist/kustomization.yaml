---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: le-portail-grist
resources:
  - ../../../../base/grist/
  - storage.yaml
  - secrets.enc.yaml
patches:
  - target:
      kind: Namespace
      name: grist
    path: namespace.yaml
  - target:
      kind: HelmRelease
      name: grist
    patch: |
      - op: replace
        path: /metadata/name
        value: le-portail-grist
  - target:
      kind: HelmRelease
      name: le-portail-grist
    path: values.yaml
  # Add the k8up backup annotation to the PVC
  - target:
      kind: PersistentVolumeClaim
      namespace: le-portail-grist
    patch: |-
      - op: add
        path: /metadata/annotations/k8up.io~1backup
        value: "true"
  # Overrides the k8up bucket values with subPath
  - target:
      kind: Schedule
      name: grist
    patch: |-
      - op: replace
        path: /spec/backend/s3/bucket
        value: "alter-it-infra01-backup-le-portail-grist"